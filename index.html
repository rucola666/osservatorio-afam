const categorie = {
  scuole: { campo: 'tipo_scuola', titolo: 'Scuola', tipo: 'bottoni' },
  contratti: { campo: 'tipo_contratto', titolo: 'Contratto', tipo: 'bottoni' },
  luoghi: { campo: 'dove', titolo: 'Luogo', tipo: 'dropdown' },
  discipline: { campo: 'discipline_nomi', titolo: 'Disciplina', tipo: 'dropdown', codice: 'codice_sector' }
};

const filtriAttivi = {};
Object.keys(categorie).forEach(k => { filtriAttivi[k] = new Set(); });

let ordinamentoScadenza = false;
let mostraCodiciAfam = false;
let filtriAperti = false;
let filtriTotali = 0;
let haAzzeratiGlobali = false;
const dropdownAperti = new Set();

const codicePerDisciplina = new Map();
offerte.forEach(o => {
  const nome = (o.discipline_nomi || '').trim();
  const cod = (o.codice_sector || '').trim();
  if (nome && cod && !codicePerDisciplina.has(nome)) {
    codicePerDisciplina.set(nome, cod);
  }
});

function labelValore(val) {
  return (val === '') ? '/' : val;
}

function etichettaDisciplina(valore) {
  if (!mostraCodiciAfam) return labelValore(valore);
  const cod = codicePerDisciplina.get(valore);
  if (valore === '' || !cod) return '/';
  return cod.replace(/^AFAM/, '');
}

function applicaFiltri(filtri) {
  return offerte.filter(o => {
    return Object.keys(categorie).every(key => {
      const set = filtri[key];
      if (!set || set.size === 0) return true;
      return set.has(o[categorie[key].campo]);
    });
  });
}

function conteggiaValori(lista, campo) {
  const m = new Map();
  lista.forEach(o => {
    const v = (o[campo] || '').trim() === '' ? '' : o[campo];
    m.set(v, (m.get(v) || 0) + 1);
  });
  return m;
}

function configuraEtichetta(key, valore, conf, mostraCodici) {
  if (conf.codice) return etichettaDisciplina(valore);
  if (key === 'contratti') {
    const abbrev = {
      'altri contratti': 'altri',
      'tempo determinato': 'determinato',
      'tempo indeterminato': 'indeterminato'
    };
    const base = valore.toLowerCase();
    return abbrev[base] !== undefined ? abbrev[base] : labelValore(valore);
  }
  return labelValore(valore);
}

function renderFiltri() {
  const aside = document.getElementById('filtri');
  aside.innerHTML = '';
  filtriTotali = 0;
  haAzzeratiGlobali = false;

  Object.keys(categorie).forEach(key => {
    const conf = categorie[key];
    const filtriEsclusi = {};
    Object.keys(categorie).forEach(k => {
      if (k !== key) filtriEsclusi[k] = filtriAttivi[k];
    });
    const tutti = conteggiaValori(offerte, conf.campo);
    const base = applicaFiltri(filtriEsclusi);
    const attive = base.filter(o => !isScaduta(o));
    const conteggi = conteggiaValori(attive, conf.campo);
    const items = [...tutti.keys()]
      .map((valore) => ({ valore: valore, etichetta: configuraEtichetta(key, valore, conf, mostraCodiciAfam), conteggio: conteggi.get(valore) || 0 }))
      .filter((it) => it.conteggio > 0 || filtriAttivi[key].has(it.valore))
      .sort((a, b) => a.etichetta.localeCompare(b.etichetta));
    renderFiltro(key, conf.titolo, items, conf.tipo, conf.codice);
    items.forEach(it => {
      if (filtriAttivi[key].has(it.valore)) {
        filtriTotali += 1;
        if (it.conteggio === 0) haAzzeratiGlobali = true;
      }
    });
  });

  const resetBtn = document.createElement('button');
  resetBtn.className = 'filtro-reset';
  resetBtn.textContent = 'reset';
  resetBtn.addEventListener('click', resetFiltri);
  aside.appendChild(resetBtn);

  if (filtriAperti) {
    aside.classList.add('aperto');
  } else {
    aside.classList.remove('aperto');
  }
}

function resetFiltri() {
  Object.keys(categorie).forEach(k => { filtriAttivi[k].clear(); });
  if (!window.matchMedia('(max-width: 768px)').matches) {
    dropdownAperti.clear();
  }
  renderFiltri();
  renderOfferte();
}

function renderFiltro(key, titolo, items, tipo, codice) {
  const aside = document.getElementById('filtri');
  const div = document.createElement('div');
  div.className = 'filtro-categoria';

  if (tipo === 'dropdown') {
    renderDropdown(div, key, titolo, items, codice);
  } else {
    const titleEl = document.createElement('div');
    titleEl.className = 'filtro-titolo';
    titleEl.textContent = titolo;
    div.appendChild(titleEl);
    renderBottoni(div, key, items);
  }

  aside.appendChild(div);
}

function renderBottoni(div, key, items) {
  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    btn.textContent = it.etichetta + ' ' + it.conteggio;
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  div.appendChild(bottoni);
}

function abbreviaNomeDisciplina(nome) {
  const parole = String(nome).trim().split(/\s+/).filter(Boolean);
  if (parole.length <= 3) return nome;
  return parole.slice(0, 3).join(' ') + '...';
}

function labelToggle(aperto) {
  return aperto ? '-\u00A0\u00A0\u00A0' : '+\u00A0\u00A0\u00A0';
}

function renderDropdown(div, key, titolo, items, codice) {
  const wrapper = document.createElement('div');
  wrapper.className = 'filtro-dropdown';

  const trigger = document.createElement('button');
  trigger.className = 'filtro-dropdown-trigger';
  const toggle = document.createElement('span');
  toggle.className = 'filtro-dropdown-toggle';
  toggle.textContent = labelToggle(false);
  const triggerLabel = document.createElement('span');
  triggerLabel.textContent = titolo;
  trigger.appendChild(toggle);
  trigger.appendChild(triggerLabel);

  const menu = document.createElement('div');
  menu.className = 'filtro-dropdown-menu';

  if (codice) {
    const toggleVista = document.createElement('button');
    toggleVista.className = 'filtro-reset filtro-codice-toggle';
    toggleVista.textContent = mostraCodiciAfam ? 'mostra nomi' : 'codici afam';
    toggleVista.addEventListener('click', () => {
      mostraCodiciAfam = !mostraCodiciAfam;
      renderFiltri();
    });
    menu.appendChild(toggleVista);
  }

  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  const mostraCodici = !!(codice && mostraCodiciAfam);
  const mobile = window.matchMedia('(max-width: 768px)').matches;
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    if (key === 'luoghi') btn.classList.add('filtro-bottone-luogo');
    if (key === 'discipline') btn.classList.add('filtro-bottone-disciplina');
    let etichetta = it.etichetta;
    if (codice && !mostraCodici && mobile) {
      etichetta = abbreviaNomeDisciplina(etichetta);
    }
    btn.textContent = (codice && mostraCodici) ? it.etichetta : (etichetta + '\u00A0' + it.conteggio);
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  menu.appendChild(bottoni);

  const haAzzerati = items.some(it => filtriAttivi[key].has(it.valore) && it.conteggio === 0);
  if (haAzzerati) {
    trigger.classList.add('ha-azzerati');
  }

  trigger.addEventListener('click', () => {
    let aperto = menu.classList.toggle('aperto');
    trigger.classList.toggle('aperto', aperto);
    toggle.textContent = labelToggle(aperto);
    if (aperto) {
      dropdownAperti.add(key);
    } else {
      dropdownAperti.delete(key);
    }
  });

  if (dropdownAperti.has(key)) {
    menu.classList.add('aperto');
    trigger.classList.add('aperto');
    toggle.textContent = labelToggle(true);
  }

  if (filtriAttivi[key].size > 0) {
    trigger.classList.add('ha-filtri');
  }

  wrapper.appendChild(trigger);
  wrapper.appendChild(menu);
  div.appendChild(wrapper);
}

function toggleFiltro(key, val, btn) {
  if (filtriAttivi[key].has(val)) {
    filtriAttivi[key].delete(val);
  } else {
    filtriAttivi[key].add(val);
  }
  renderFiltri();
  renderOfferte();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function titleCase(s) {
  if (!s) return s;
  return s.toLowerCase().split(/\s+/).map(function (w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function parseDataBando(s) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec((s || '').trim());
  if (!m) return null;
  const gg = parseInt(m[1], 10), mm = parseInt(m[2], 10), aaaa = parseInt(m[3], 10);
  const d = new Date(aaaa, mm - 1, gg);
  if (d.getFullYear() !== aaaa || d.getMonth() !== mm - 1 || d.getDate() !== gg) return null;
  return d.getTime();
}

function isScaduta(o, nowMs = Date.now()) {
  const ts = parseDataBando(o.ultimo_giorno_candidatura);
  return ts !== null && nowMs > ts + 86399999;
}

function ordinaScadenza(lista, crescente) {
  const copia = lista.slice();
  copia.sort((a, b) => {
    const ta = parseDataBando(a.ultimo_giorno_candidatura);
    const tb = parseDataBando(b.ultimo_giorno_candidatura);
    const inA = ta === null;
    const inB = tb === null;
    if (inA && inB) return 0;
    if (inA) return 1;
    if (inB) return -1;
    if (ta === tb) return 0;
    return crescente ? (ta - tb) : (tb - ta);
  });
  return copia;
}

function renderOfferte() {
  let filtrate = applicaFiltri(filtriAttivi);
  if (ordinamentoScadenza !== null) {
    filtrate = ordinaScadenza(filtrate, ordinamentoScadenza);
  }

  const section = document.getElementById('offerte');
  section.innerHTML = '';

  const attive = filtrate.filter(o => !isScaduta(o));
  const headerConteggio = document.querySelector('.header-conteggio');
  if (headerConteggio) {
    headerConteggio.textContent = String(attive.length);
  }

  const bar = document.createElement('div');
  bar.className = 'offerte-bar';
  bar.style.cssText = 'display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;';

  if (window.matchMedia('(max-width: 768px)').matches) {
    const filtriToggle = document.createElement('button');
    filtriToggle.className = 'filtri-toggle';
    filtriToggle.textContent = filtriAperti ? '-\u00A0\u00A0\u00A0filtri' : '+\u00A0\u00A0\u00A0filtri';
    if (filtriTotali > 0) filtriToggle.classList.add('ha-filtri');
    if (haAzzeratiGlobali) filtriToggle.classList.add('ha-azzerati');
    filtriToggle.addEventListener('click', () => {
      filtriAperti = !filtriAperti;
      renderFiltri();
      renderOfferte();
    });
    bar.appendChild(filtriToggle);
  }

  const count = document.createElement('div');
  count.className = 'offerte-conteggio';
  count.style.cssText = 'color: var(--contrasto); font-size: var(--font-size); font-weight: var(--weight-3);';
  const numero = document.createElement('span');
  numero.className = 'offerte-numero';
  numero.textContent = String(attive.length);
  const testo = document.createElement('span');
  testo.className = 'offerte-etichetta';
  testo.textContent = ' offert' + (attive.length === 1 ? 'a' : 'e') + ' trovat' + (attive.length === 1 ? 'a' : 'e');
  count.appendChild(numero);
  count.appendChild(testo);
  bar.appendChild(count);

  const sortBtn = document.createElement('button');
  sortBtn.className = 'filtro-bottone ordina-bottone';
  const etichettaOrd = ordinamentoScadenza === true ? 'Scadenza più vicina' : 'Scadenza più lontana';
  sortBtn.textContent = etichettaOrd;
  sortBtn.addEventListener('click', () => {
    ordinamentoScadenza = ordinamentoScadenza === true ? false : true;
    renderOfferte();
  });
  bar.appendChild(sortBtn);

  section.appendChild(bar);

  const grid = document.createElement('div');
  grid.className = 'lista-offerte';

  if (filtrate.length === 0) {
    const msg = document.createElement('p');
    msg.style.cssText = 'color: var(--neutro-1); font-size: var(--font-size); padding: 40px;';
    msg.textContent = 'Nessuna offerta trovata con i filtri selezionati.';
    grid.appendChild(msg);
  }

  const isMobile = window.matchMedia('(max-width: 768px)').matches;

  filtrate.forEach(o => {
    const card = document.createElement('div');
    card.className = 'card';

    if (isScaduta(o)) {
      card.classList.add('offerta-scaduta');
    }

    const disc = document.createElement('div');
    disc.className = 'card-disciplina';
    if (o.sito_istituzionale) {
      const a = document.createElement('a');
      a.className = 'card-id';
      a.href = o.sito_istituzionale;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = o.discipline_nomi ? o.discipline_nomi : '/';
      disc.appendChild(a);
    } else {
      disc.textContent = o.discipline_nomi ? o.discipline_nomi : '/';
    }
    card.appendChild(disc);

    const infoWrap = document.createElement('span');
    infoWrap.className = 'card-info-icon';
    infoWrap.textContent = '+';
    const tip = document.createElement('div');
    tip.className = 'tooltip';
    tip.textContent = o.discipline_descrizione;
    card.appendChild(infoWrap);
    card.appendChild(tip);

    const campo = (label, value) => {
      const el = document.createElement('div');
      el.className = 'card-campo';
      const lbl = document.createElement('span');
      lbl.className = 'card-etichetta';
      lbl.textContent = label;
      const val = document.createElement('span');
      val.className = 'card-valore';
      val.textContent = value;
      el.appendChild(lbl);
      el.appendChild(val);
      return el;
    };

    const istituto = document.createElement('div');
    istituto.className = 'card-campo card-valore-puro';
    istituto.textContent = o.istituto ? o.istituto : '/';
    card.appendChild(istituto);

    card.appendChild(campo('Scade il ', (o.ultimo_giorno_candidatura || '').trim().replace(/-/g, '.')));

    if (!isMobile) {
      const idCampo = document.createElement('div');
      idCampo.className = 'card-campo';
      const idLabel = document.createElement('span');
      idLabel.className = 'card-etichetta';
      idLabel.textContent = 'Allegati ';
      idCampo.appendChild(idLabel);
      o.allegati.forEach((url, i) => {
        if (!url) return;
        const al = document.createElement('a');
        al.className = 'card-id';
        al.href = url;
        al.target = '_blank';
        al.rel = 'noopener';
        al.textContent = String(i + 1);
        idCampo.appendChild(al);
        if (i < o.allegati.length - 1) {
          idCampo.appendChild(document.createTextNode(' '));
        }
      });
      card.appendChild(idCampo);

      if (o.bando_inpa) {
        const inpaCampo = document.createElement('div');
        inpaCampo.className = 'card-campo';
        const inpaLabel = document.createElement('span');
        inpaLabel.className = 'card-etichetta';
        inpaLabel.textContent = 'Candidature ';
        const inpa = document.createElement('a');
        inpa.className = 'card-id';
        inpa.href = o.bando_inpa;
        inpa.target = '_blank';
        inpa.rel = 'noopener';
        inpa.textContent = 'portale reclutamento';
        inpaCampo.appendChild(inpaLabel);
        inpaCampo.appendChild(inpa);
        card.appendChild(inpaCampo);
      }

      const email = document.createElement('div');
      email.className = 'card-campo card-valore-puro';
      email.textContent = o.email_rup;
      card.appendChild(email);

      const telefono = document.createElement('div');
      telefono.className = 'card-campo card-valore-puro';
      telefono.textContent = '+39 ' + o.telefono_rup;
      card.appendChild(telefono);
    }

    grid.appendChild(card);
  });

  section.appendChild(grid);
}

const PAYPAL_URL = 'https://www.paypal.com/ncp/payment/YVLBRBL8NKXBE';
const DONA_PRIMO = 1;
const DONA_OGNI = 3;

let donaContatore = (() => {
  const n = parseInt(localStorage.getItem('donazione_click') || '0', 10);
  return isNaN(n) ? 0 : n;
})();

let linkInAttesa = null;

function dovrebbeMostrare() {
  return donaContatore === DONA_PRIMO ||
    (donaContatore > DONA_PRIMO && (donaContatore - DONA_PRIMO) % DONA_OGNI === 0);
}

function incrementaClickLink() {
  donaContatore += 1;
  localStorage.setItem('donazione_click', String(donaContatore));
  return dovrebbeMostrare();
}

function mostraDonazione(href) {
  linkInAttesa = href;
  document.getElementById('donazione-overlay').classList.add('aperto');
}

function chiudiDonazione() {
  document.getElementById('donazione-overlay').classList.remove('aperto');
  linkInAttesa = null;
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  if (a.id === 'donazione-paypal') return;
  const href = a.getAttribute('href');
  if (!href || !/^https?:\/\//i.test(href)) return;
  e.preventDefault();
  if (incrementaClickLink()) {
    mostraDonazione(href);
  } else {
    window.open(href, '_blank', 'noopener');
  }
}, true);

document.getElementById('donazione-paypal').addEventListener('click', (e) => {
  e.preventDefault();
  const href = linkInAttesa;
  chiudiDonazione();
  window.open(PAYPAL_URL, '_blank', 'noopener');
  if (href) window.open(href, '_blank', 'noopener');
});

document.getElementById('donazione-continua').addEventListener('click', () => {
  const href = linkInAttesa;
  chiudiDonazione();
  if (href) window.open(href, '_blank', 'noopener');
});

renderFiltri();
renderOfferte();
  </script>
