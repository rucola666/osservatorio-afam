<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osservatorio-afam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sfondo: #FCFDFD;
  --accento: #0066CC;
  --accento-2: #FF0000;
  --contrasto: #000000;
  --neutro-1: #E8E8E8;
  --neutro-2: #525252;
  --font-size: 20px;
  --font-size-mobile: 14px;
  --testo: lowercase;
  --weight-1: 420;
  --weight-2: 570;
  --weight-3: 720;
  --raggio-bottoni: 10px;
  --raggio-card: 30px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  text-transform: var(--testo);
  background: var(--sfondo);
  color: var(--accento);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  font-size: var(--font-size);
  background: var(--sfondo);
  text-transform: var(--testo);
  padding: 10px 10px;
  border-bottom: 2px solid var(--neutro-1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-testo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.br-mobile {
  display: none;
}

header h1 {
  font-size: var(--font-size);
  font-weight: var(--weight-3);
  text-transform: var(--testo);
  letter-spacing: 0;
  white-space: nowrap;
}

.header-sottotitolo {
  font-weight: var(--weight-1);
  color: var(--accento);
  margin-top: 0;
  margin-left: auto;
  letter-spacing: 0;
  white-space: nowrap;
}

.header-conteggio {
  display: none;
}

main {
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);

  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#filtri {
  width: 33.333%;
  min-width: 33.333%;
  overflow-y: auto;
  padding: 20px;
  border-right: 2px solid var(--neutro-1);
  background: var(--sfondo);
}

#offerte {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.filtro-categoria {
  margin-bottom: 14px;
}

.filtro-titolo {
  color: var(--accento);
  letter-spacing: 0;
  margin-bottom: 10px;
}

.filtro-bottoni {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filtro-bottone {
  font-size: var(--font-size);
  font-weight: var(--weight-1);
  background: var(--neutro-1);
  color: var(--neutro-2);
  text-transform: var(--testo);
  border: 1px solid transparent;
  border-radius: var(--raggio-bottoni);
  padding: 1px 7px;
  font-family: 'Titillium Web', sans-serif;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filtro-bottone.attivo {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo.azzerato {
  background: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown {
  position: relative;
}

.filtro-dropdown-trigger {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0;
  transition: all 0.15s ease;
}

.filtro-dropdown-trigger.ha-filtri,
.filtro-dropdown-trigger.aperto {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-dropdown-trigger.ha-azzerati {
  background: var(--accento-2);
  border-color: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown-toggle {
  line-height: 1;
}

.filtro-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sfondo);
  border: 0px solid var(--neutro-2);
  z-index: 200;
  padding: 6px;
}

.filtro-dropdown-menu.aperto {
  display: block;
  position: static;
  margin-top: 6px;
  width: 100%;
}

.filtro-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.filtro-dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--neutro-2);
}

.filtro-dropdown-menu .filtro-codice-toggle {
  margin-top: 6px;
  margin-bottom: 6px;
}

.filtro-reset {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  margin-top: 7px;
  transition: all 0.15s ease;
}

@media (hover: hover) and (pointer: fine) {
  .filtro-bottone:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-dropdown-trigger:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-reset:hover {
    background: var(--accento);
    color: var(--sfondo);
  }
}

.lista-offerte {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 900px) {
  .lista-offerte {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
  min-width: 0;
  overflow-wrap: break-word;
}

.card:hover {
  border-color: var(--accento);
}

.card-disciplina {
  font-weight: var(--weight-3);
  color:  var(--accento);
  line-height: 1.1;
  margin-bottom: 3px;
}

.card-info-icon {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--accento);
  cursor: pointer;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
}

.card .tooltip {
  display: none;
  position: absolute;
  top: 34px;
  right: 20px;
  width: calc(100% - 40px);
  background: var(--neutro-1);
  color: var(--contrasto);
  border: 1px solid var(--contrasto);
  padding: 12px;
  font-weight: var(--weight-1);
  line-height: 1.15;
  z-index: 1000;
  white-space: normal;
}

.card:has(.card-info-icon:hover) .tooltip,
.card:has(.tooltip:hover) .tooltip {
  display: block;
    color: var(--neutro-2);
}

.card-campo {
  font-weight: var(--weight-2);
  margin-bottom: 3px;
  line-height: 1.4;
}

.card-valore-puro {
  color: var(--contrasto);
}

.card-etichetta {
  color: var(--neutro-2);
  font-weight: 400;

}

.card-valore {
  color: var(--contrasto);
}

.card-id,
.card-id:visited {
  color: var(--accento);
  text-decoration: none;
}

.card-id:hover {
  color: var(--accento);
  text-decoration: none;
}

.card.offerta-scaduta,
.card.offerta-scaduta .card-disciplina,
.card.offerta-scaduta .card-valore-puro,
.card.offerta-scaduta .card-valore,
.card.offerta-scaduta .card-etichetta,
.card.offerta-scaduta .card-id,
.card.offerta-scaduta .card-id:visited {
  color: var(--neutro-1);
}

.card.offerta-scaduta .card-info-icon {
  color: var(--neutro-1);
}

.card.offerta-scaduta:hover {
  border-color: var(--neutro-1);
}

#filtri::-webkit-scrollbar,
#offerte::-webkit-scrollbar {
  width: 6px;
}

#filtri::-webkit-scrollbar-track,
#offerte::-webkit-scrollbar-track {
  background: transparent;
}

#filtri::-webkit-scrollbar-thumb,
#offerte::-webkit-scrollbar-thumb {
  background: var(--neutro-1);
}

@media (max-width: 768px) {
  :root {
    --font-size: var(--font-size-mobile);
  }

  body {
    height: auto;
    overflow: visible;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 300;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: start;
  }

  .header-testo {
    display: contents;
  }

  header h1 {
    grid-column: 1;
    grid-row: 1 / 3;
    white-space: normal;
    align-self: start;
    line-height: 1;
  }

  .header-sottotitolo {
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: start;
    margin-left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1;
  }

  .br-mobile {
    display: block;
  }

  .hyphen {
    display: none;
  }

  main {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #filtri {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--neutro-1);
    overflow-x: auto;
    display: none;
  }

  #filtri.aperto {
    display: block;
  }

  .card .tooltip,
  .card-info-icon {
    display: none;
  }

  .filtro-bottoni {
    flex-wrap: nowrap;
  }

  .filtro-dropdown-menu .filtro-bottoni {
    flex-wrap: wrap;
  }

  .filtro-dropdown-menu .filtro-bottone {
    flex: 0 1 auto;
  }

  .filtro-bottone-luogo {
    white-space: nowrap;
  }

  .filtro-bottone-disciplina {
    white-space: normal;
    overflow-wrap: break-word;
  }

  .filtro-bottone {
    line-height: 1;
  }

  .filtro-dropdown-trigger {
    line-height: 1;
  }

  .filtro-reset {
    line-height: 1;
  }

  .filtri-toggle {
    background: transparent;
    color: var(--accento);
    border: 2px solid var(--accento);
    border-radius: var(--raggio-bottoni);
    padding: 6px 10px;
    font-family: 'Titillium Web', sans-serif;
    font-size: var(--font-size);
    font-weight: var(--weight-2);
    text-transform: var(--testo);
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filtri-toggle.ha-filtri {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtri-toggle.ha-azzerati {
    background: var(--accento-2);
    border-color: var(--accento-2);
    color: var(--sfondo);
  }

  .filtro-dropdown-menu .filtro-codice-toggle {
    display: none;
  }

  .header-conteggio {
    display: block;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--font-size) * 1.5);
    font-weight: var(--weight-3);
    line-height: 1;
    color: var(--contrasto);
  }

  .offerte-bar .offerte-conteggio {
    display: none;
  }

  #offerte {
    overflow: visible;
  }

  .card {
    padding: 14px;
  }
}

#donazione-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
}

#donazione-overlay.aperto {
  display: flex;
}

.donazione-modal {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 24px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
}

.donazione-contenuto {
  display: flex;
  gap: 20px;
  align-items: center;
}

.donazione-qr {
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
}

.donazione-qr img {
  width: 100%;
  height: 100%;
  display: block;
  border: 2px solid var(--neutro-1);
  border-radius: 8px;
}

.donazione-testo {
  flex: 1;
  min-width: 0;
}

.donazione-testo h2 {
  color: var(--accento);
  font-weight: var(--weight-3);
  margin-bottom: 8px;
}

.donazione-testo p {
  color: var(--neutro-2);
  font-weight: var(--weight-1);
  margin-bottom: 16px;
  line-height: 1.3;
}

.donazione-bottone-paypal {
  display: block;
  text-align: center;
  background: var(--accento);
  color: var(--sfondo);
  padding: 10px;
  border-radius: var(--raggio-bottoni);
  text-decoration: none;
  font-weight: var(--weight-2);
  margin-bottom: 10px;
}

.donazione-bottone-continua {
  display: block;
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  padding: 8px;
  border-radius: var(--raggio-bottoni);
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
}

@media (max-width: 768px) {
  .donazione-contenuto {
    flex-direction: column;
  }
  .donazione-qr {
    width: 140px;
    height: 140px;
  }
}
  </style>
</head>

ali riconducibili al concetto base di Decorazione, nel quale è compreso l’insieme degli approfondimenti che vanno dalla conoscenza dei materiali dell’arte sino all’esecuzione dell’opera in rapporto allo spazio, sia esso fisico o sociale, urbano o naturale. Nel settore sono comprese le convergenze interdisciplinari che vanno dal disegno alla pittura, dalla realizzazione plastica all’installazione, dal video alla performance, alla progettazione ed esecuzione di opere d’arte, opere esperienziali e relazionali che, sconfinando e contaminandosi con una dimensione funzionale, favoriscono il dialogo tra le arti visive, il territorio e la società, con l’architettura, con il paesaggio, con l’ambiente, e con il design nelle sue varie declinazioni. La centralità dell’attività laboratoriale garantisce un dialogo e un equilibrio tra tecniche consolidate della tradizione artistica, nuovi linguaggi e tecnologie applicabili alle arti e al design, includendo l’uso dell’Intelligenza Artificiale. La formazione, la ricerca e la correlata produzione sono finalizzate nell’ambito del variegato panorama delle pratiche contemporanee al ripensamento dello spazio sia pubblico che privato","codice_sector":"AFAM084","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"12-11-2026","ultimo_giorno_candidatura":"16-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15034/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0e2290e7b91643379bf429ae7c49f387","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"2932","istituto":"CONSERVATORIO DI MUSICA DI TARANTO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2932","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Oboe","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM013","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"TARANTO","puoi_candidarsi_da":"11-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14958/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/b04357655b93458f9ee50e5d1584316c","email_rup":"protocollo@paisiello.it","telefono_rup":"0999627000"},{"bando_id":"2932","istituto":"CONSERVATORIO DI MUSICA DI TARANTO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2932","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione, arrangiamento e concertazione per i nuovi linguaggi musicali","discipline_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"TARANTO","puoi_candidarsi_da":"11-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14958/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/b04357655b93458f9ee50e5d1584316c","email_rup":"protocollo@paisiello.it","telefono_rup":"0999627000"},{"bando_id":"2924","istituto":"CONSERVATORIO DI MUSICA DI TRAPANI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2924","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TRAPANI","puoi_candidarsi_da":"30-10-2026","ultimo_giorno_candidatura":"04-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14672/download/BANDO","https://afam-anagrafiche.mur.gov.it/14673/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=082255e3961843a9b1658a48a2e2a468","email_rup":"direttore.amministrativo@constp.it","telefono_rup":"0923556124-25"},{"bando_id":"2922","istituto":"ISTITUTO SUPERIORE DI STUDI MUSICALI E COREUTICI DI TERAMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2922","sito_istituzionale":"https://www.conservatoriobraga.it/amministrazionetrasparente","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Istituto","dove":"TERAMO","puoi_candidarsi_da":"04-11-2026","ultimo_giorno_candidatura":"04-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14625/download/BANDO","https://afam-anagrafiche.mur.gov.it/14626/download/BANDO","https://afam-anagrafiche.mur.gov.it/14630/download/BANDO"],"bando_inpa":"","email_rup":"direzione.amministrativa@conservatoriobraga.it","telefono_rup":"0861248866"},{"bando_id":"2911","istituto":"ACCADEMIA DI BELLE ARTI DI CATANZARO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2911","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"CATANZARO","puoi_candidarsi_da":"04-11-2026","ultimo_giorno_candidatura":"04-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14591/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/3e80cc25bad2406d8f2ec946e1f6c21f","email_rup":"protocollo@abacatanzaro.it","telefono_rup":"0961773679"},{"bando_id":"2989","istituto":"CONSERVATORIO DI MUSICA DI BOLZANO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2989","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-tes imo_giorno_candidatura":"02-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15240/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"conservatoriovicenza@consvi.it","telefono_rup":"0444 507551"},{"bando_id":"2982","istituto":"ACCADEMIA DI BELLE ARTI DI VENEZIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2982","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"VENEZIA","puoi_candidarsi_da":"17-11-2026","ultimo_giorno_candidatura":"01-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15212/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=f8c7ce270caf441ea478428e90845902","email_rup":"protocollo@accademiavenezia.it","telefono_rup":"0412413752"},{"bando_id":"2981","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2981","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-docenti-esterni/procedura-selettiva-pubblica-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-ed-accademici-a-a-2026-2027/","discipline_nomi":"Strumenti a corde per i nuovi linguaggi musicali","discipline_descrizione":"per i nuovi linguaggi musicali Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM028","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"16-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15190/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/cbfe7130c7fa472bad0f69d60ebaa12d","email_rup":"personale.arnoni@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2980","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2980","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-docenti-esterni/procedura-selettiva-pubblica-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-ed-accademici-a-a-2026-2027/","discipline_nomi":"Tecnologie del suono e della multimedialità","discipline_descrizione":"Il settore delle Tecnologie del suono e della multimedialità comprende diversi ambiti di ricerca e applicazione delle tecnologie nella produzione musicale, nei multimedia e in tutte le forme d’arte che coinvolgano il suono. Tali ambiti riguardano le tecnologie elettroacustiche e informatiche rivolte all’attività degli studi di registrazione e produzione sonora e musicale; le tecnologie per l’audio e la multimedialità utilizzate nelle produzioni per la radio, la televisione, la diffusione di contenuti multimediali sul web, e simili; le tecnologie per l’audio e la multimedialità impiegate nello spettacolo dal vivo (sia per quanto riguarda gli aspetti sonori che multimediali, anche in termini di realizzazione di sistemi interattivi per la scena); le tecnologie per l’audio e la multimedialità rivolte alle forme artistiche performative o installative, nonché alla comunicazione in genere","codice_sector":"AFAM047","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"16-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15188/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/ae035786999c49da94d6dfcf004cf7f5","email_rup":"personale.arnoni@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2979","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2979","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-docenti-esterni/procedura-selettiva-pubblica-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-ed-accademici-a-a-2026-2027/","discipline_nomi":"Strumenti ad arco storici","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative agli strumenti ad arco storici, necessarie per affrontare con piena consapevolezza le prassi esecutive storicamente informate, con possibilità di estensione per ogni profilo disciplinare, oltre che alle eventuali diverse taglie, allo studio dei relativi strumenti affini. Per il raggiungimento di tali obiettivi si studiano in particolare le tecniche esecutive specifiche del periodo storico di ogni singolo profilo disciplinare, la pratica del basso continuo per gli strumenti di continuo e si approfondisce la conoscenza organologica, della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, alla gestualità e alle tecniche di esecuzione della musica delle avanguardie storiche e contemporanea, eventualmente contemplata nei repertori dei profili disciplinari. È prevista inoltre la conoscenza delle metodologie riferite alla didattica dello strumento","codice_sector":"AFAM024","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"16-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15187/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/9b9b15ea52a941dea8627144484aa76f","email_rup":"personale.arnoni@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709 ne_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"16-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15180/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/c2493bfc9f90460e83288f216b09c2df","email_rup":"personale.arnoni@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2971","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2971","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-docenti-esterni/procedura-selettiva-pubblica-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-ed-accademici-a-a-2026-2027/","discipline_nomi":"Diritto delle arti, del design, dello spettacolo e dei beni culturali","discipline_descrizione":"Il settore comprende competenze e ambiti di ricerca inerenti al diritto dei beni e delle attività culturali, al diritto del lavoro e della previdenza sociale con particolare riguardo all’ambito artistico e dello spettacolo, alla proprietà intellettuale – incluso il diritto d’autore – nel contesto nazionale e internazionale in una prospettiva di comparazione, alla gestione delle imprese operanti nel mondo delle arti e dello spettacolo ed ai relativi sistemi produttivi-industriali, anche legati allo sviluppo delle nuove tecnologie e delle intelligenze artificiali, alla legislazione di cantiere e in materia di sicurezza sul lavoro, nonché all’ordinamento scolastico e dell’Alta Formazione Artistica e Musicale. Completano il settore gli studi riguardanti il rapporto tra diritto e discipline umanistiche, nelle varie declinazioni riconosciute","codice_sector":"AFAM058","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"16-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15179/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/8f6378d647a94af1a3325cabb6acf7de","email_rup":"personale.arnoni@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2970","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2970","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-docenti-esterni/procedura-selettiva-pubblica-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-ed-accademici-a-a-2026-2027/","discipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, t prende competenze e ambiti di ricerca inerenti al diritto dei beni e delle attività culturali, al diritto del lavoro e della previdenza sociale con particolare riguardo all’ambito artistico e dello spettacolo, alla proprietà intellettuale – incluso il diritto d’autore – nel contesto nazionale e internazionale in una prospettiva di comparazione, alla gestione delle imprese operanti nel mondo delle arti e dello spettacolo ed ai relativi sistemi produttivi-industriali, anche legati allo sviluppo delle nuove tecnologie e delle intelligenze artificiali, alla legislazione di cantiere e in materia di sicurezza sul lavoro, nonché all’ordinamento scolastico e dell’Alta Formazione Artistica e Musicale. Completano il settore gli studi riguardanti il rapporto tra diritto e discipline umanistiche, nelle varie declinazioni riconosciute","codice_sector":"AFAM058","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15140/download/BANDO","https://afam-anagrafiche.mur.gov.it/15142/download/BANDO","https://afam-anagrafiche.mur.gov.it/15143/download/BANDO","https://afam-anagrafiche.mur.gov.it/15144/download/BANDO","https://afam-anagrafiche.mur.gov.it/15145/download/BANDO","https://afam-anagrafiche.mur.gov.it/15146/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=4e4e63eacfa147c3a5489268ba583a0a","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2958","istituto":"ISIA DI PESCARA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2958","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Economia, management marketing delle imprese culturali creative e dello spettacolo","discipline_descrizione":"Il settore si occupa di aspetti economici, gestionali, di marketing, di comunicazione e ricerca specifici per le industrie culturali e creative, dalle arti visive, cinematografiche e audiovisive allo spettacolo dal vivo, dall’organizzazione di eventi al design e alla tutela e valorizzazione del patrimonio culturale. Il settore comprende l’organizzazione e promozione dello spettacolo e di eventi artistici e culturali, il fundraising e il project management","codice_sector":"AFAM059","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15140/download/BANDO","https://afam-anagrafiche.mur.gov.it/15142/download/BANDO","https://afam-anagrafiche.mur.gov.it/15143/download/BANDO","https://afam-anagrafiche.mur.gov.it/15144/download/BANDO","https://afam-anagrafiche.mur.gov.it/15145/download/BANDO","https://afam-anagrafiche.mur.gov.it/15146/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=4e4e63eacfa147c3a5489268ba583a0a","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2958","istituto":"ISIA DI PESCARA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2958","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Ingegnerizzazione, matematica e fisica per il design","discipline_descrizione":"Il settore tratta l’ingegnerizzazione del prodotto, inquadrandola come una disciplina interdisciplinare che abbraccia aspetti economici, tecnici e sociali, mirata a ottimizzare i processi produttivi, i materiali e le tecnologie per armonizzare fra loro i requisiti economici, ambientali e prestazionali in fase di progettazione, pre-produzione e produzione. Oltre a considerare la sostenibilità ambientale, sociale ed economica, questo approccio si avvale di competenze in ambito logico-matematico e scientifico. In particolare, la progettazione di prodotti e sistemi implica la conoscenza di principi di fisica applicata al design, calcolo differenziale e integrale, algebra lineare e algoritmi utili alla rappresentazione geometrica e visiva. Il settore include pertanto competenze matematiche e fisiche utili a fornire una base essenziale per l’analisi e la stima dei dati e la comunicazione efficace di informazioni complesse, con un focus sull’ottimizzazione dei processi anche in presenza di vincoli. Inoltre l’adozione di materiali ecocompatibili e processi produttivi a basso impatto energetico in fase progettuale si affianca alla verifica strutturale e prestazionale dei materiali, utilizzando strumenti della fisica applicata. Il settore tratta inoltre sia l’innovazione tecnologica, sia l’uso di modelli matematici e fisici avanzati per migliorare la funzionalità dei prodotti e dei processi produttivi, anche attraverso l’uso di software specifici, attraverso il calcolo e lo sviluppo di soluzioni sostenibili lungo tutto il ciclo di vita del prodotto, dalla progettazione allo smaltimento. Il settore include, ancora, riflessioni storiche e teoriche sui rapporti tra scienza, arte e design, arricchendo il processo progettuale con una prospettiva culturale più ampia. La ricerca operativa e la fisica applicata svolgono un ruolo chiave non solo nell’ottimizzazione produttiva, ma anche nella conservazione del patrimonio culturale","codice_sector":"AFAM091","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15140/download/BANDO","https://afam-anagrafiche.mur.gov.it/15142/download/BANDO","https://afam-anagrafiche.mur.gov.it/15143/download/BANDO","https://afam-anagrafiche.mur.gov.it/15144/download/BANDO","https://afam-anagrafiche.mur.gov.it/15145/download/BANDO","https://afam-anagrafiche.mur.gov.it/15146/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=4e4e63eacfa147c3a5489268ba583a0a","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2958","istituto":"ISIA DI PESCARA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2958","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Teorie e tecniche computazionali","discipline_descrizione":"Il settore si occupa delle attività scientifiche, artistiche, progettuali e didattico-formative legate all’utilizzo di sistemi informatici e di metodi computazionali. Si concentra sulle teorie e le tecniche applicate a forme computazionali per la progettazione e la creazione artistica; sulla programmazione per creare software e prodotti interattivi per la comunicazione; sulle possibilità dei sensori e degli attuatori elettronici per interagire con l’ambiente circostante; sull’uso dell’Intelligenza Artificiale e i suoi metodi e applicazioni in sistemi computazionali tecnologicamente avanzati. La ricerca, la produzione e la didattica si articolano in conoscenze e competenze, teoriche, progettuali e operative, relative alla programmazione computazionale (creative coding), alla progettazione, sviluppo e gestione di prodotti per la comunicazione mediante protocolli Internet (web/mobile programming), alla progettazione e realizzazione di dispositivi capaci di interagire con l’ambiente, in particolare mediante tecniche di sensoristica, microelettronica e robotica (physical computing), alle applicazioni delle tecniche e degli strumenti nell’ambito dell’Intelligenza Artificiale, nonché alla riflessione di carattere filosofico attorno alle tecnologie","codice_sector":"AFAM095","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"PESCARA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15140/download/BANDO","https://afam-anagrafiche.mur.gov.it/15142/download/BANDO","https://afam-anagrafiche.mur.gov.it/15143/download/BANDO","https://afam-anagrafiche.mur.gov.it/15144/download/BANDO","https://afam-anagrafiche.mur.gov.it/15145/download/BANDO","https://afam-anagrafiche.mur.gov.it/15146/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=4e4e63eacfa147c3a5489268ba583a0a","email_rup":"roberto.deramo@isiadesign.pe.it","telefono_rup":"0852059763"},{"bando_id":"2957","istituto":"ACCADEMIA DI BELLE ARTI DELL'AQUILA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2957","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della moda","discipline_descrizione":"I contenuti scientifico-disciplinari riguardano le conoscenze e le abilità teorico pratiche fondamentali per la gestione dell’iter progettuale, i metodi e le tecniche per la realizzazione di abiti, collezioni, borse, scarpe e accessori contraddistinte da una forte componente creativa, resa tangibile dalla manualità e dall’acquisizione di tecniche artigianali-industriali impiegate in forme innovative. Un complesso di saperi concettuali e strumentali utili ad attivare processi critici e analitici con l’obiettivo di determinare processi di innovazione nel prodotto moda in relazione agli aspetti estetici ed economici che connotano le tendenze evolutive dei costumi delle società evolute. Le competenze riguardano: lo studio e la ricerca di nuovi materiali idonei ad ampliare la gamma dei linguaggi formali multimaterici; la creazione del prototipo, comprendente la modellazione, il taglio e la confezione di capi in una struttura sartoriale artigianale o industriale","codice_sector":"AFAM114","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"AQUILA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"01-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15136/download/BANDO","https://afam-anagrafiche.mur.gov.it/15137/download/BANDO","https://afam-anagrafiche.mur.gov.it/15138/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=f0092856f60944648788bc3e179718aa","email_rup":"protocollo@abaq.it","telefono_rup":"0862 317380-317360"},{"bando_id":"2955","istituto":"ACCADEMIA DI BELLE ARTI DI GENOVA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2955","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"GENOVA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"01-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15125/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/ee6a1118f60e428ead45c9c9f86b4c04","email_rup":"direttore.amministrativo@accademialigustica.it","telefono_rup":"010560131"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Strumenti a pizzico storici","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative agli strumenti a pizzico storici, necessarie per affrontare con piena consapevolezza le prassi esecutive storicamente informate, con possibilità di estensione per ogni profilo disciplinare allo studio dei relativi strumenti affini. Per il raggiungimento di tali obiettivi si studiano in particolare le tecniche esecutive specifiche del periodo storico di ogni singolo profilo disciplinare, la prassi esecutiva del basso continuo e si approfondisce la conoscenza organologica, della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, alla gestualità e alle tecniche di esecuzione della musica delle avanguardie storiche e contemporanea, eventualmente contemplata nei repertori dei profili disciplinari. È prevista inoltre la conoscenza delle metodologie riferite alla didattica dello strumento","codice_sector":"AFAM023","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Strumenti a fiato storici","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative agli strumenti a fiato storici, necessarie per affrontare con piena consapevolezza le prassi esecutive storicamente informate, con possibilità di estensione per ogni profilo disciplinare, oltre che alle eventuali diverse taglie, allo studio dei relativi strumenti affini. Per il raggiungimento di tali obiettivi si studiano in particolare le tecniche esecutive specifiche del periodo storico di ogni singolo profilo disciplinare, la pratica del basso continuo per gli strumenti di continuo e si approfondisce la conoscenza organologica, della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, alla gestualità e alle tecniche di esecuzione della musica delle avanguardie storiche e contemporanea, eventualmente contemplata nei repertori dei profili disciplinari. È prevista inoltre la conoscenza delle metodologie riferite alla didattica dello strumento","codice_sector":"AFAM025","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Prepolifonia e canto storico","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare con piena consapevolezza le prassi esecutive storiche relative al canto storico nella sua più ampia accezione: dal linguaggio musicale sviluppatosi a partire dall’Alto Medioevo fino allo sviluppo della polifonia; dalla polifonia sacra e profana, alla monodia fino al teatro musicale. Per il raggiungimento di tali obiettivi nel profilo disciplinare di prepolifonia si studiano tutte le forme musicali della cultura occidentale, partendo dal canto monodico cristiano sino alle forme più evolute della polifonia medievale. Fondamentale lo studio delle fonti storiche, paleografiche e semiologiche, nonché delle strutture modali e delle tecniche compositive, allo scopo di sviluppare sia competenze analitiche, che capacità di ricerca musicologica, trascrizione, elaborazione e produzione musicale. Nel profilo disciplinare di canto storico si studiano le tecniche esecutive specifiche del periodo tra il rinascimento e il classicismo compreso, si approfondisce la conoscenza della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica vocale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, all’espressione del testo attraverso il canto correlato alla gestualità. È prevista inoltre la conoscenza della didattica del canto e degli aspetti riguardanti la fisiologia dell’apparato vocale","codice_sector":"AFAM027","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Strumenti a corde per i nuovi linguaggi musicali","discipline_descrizione":"per i nuovi linguaggi musicali Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM028","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Strumenti a fiato per i nuovi linguaggi musicali","discipline_descrizione":"per i nuovi linguaggi musicali Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM029","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione, arrangiamento e concertazione per i nuovi linguaggi musicali","discipline_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Esecuzione della musica elettroacustica e applicazioni del suono per le arti interattive","discipline_descrizione":"Il settore dell’Esecuzione della musica elettroacustica e applicazioni del suono nelle arti interattive comprende la ricerca, l’esecuzione, l’interpretazione e la regia del suono di opere musicali, su supporto e live, con mezzi di generazione o elaborazione elettronica, mediate da rappresentazioni simboliche o del segnale, nonché la pratica dell’improvvisazione elettroacustica. Fanno parte del settore le competenze culturali inerenti il repertorio elettroacustico dagli inizi al passato recente e la restituzione e produzione di opere originali, negli organici dal solo all’ensemble elettroacustico e misto e in forme sperimentali anche legate alla multimedialità e alle arti interattive. Le competenze tecniche comprendono l’uso in ambito concertistico, performativo e installativo dei microfoni e delle tecnologie elettroacustiche in genere, il controllo informatizzato e lo sviluppo informatico di ambienti esecutivi, anche con l’ausilio di sensori e interfacce gestuali, così come l’interazione tra suono, immagine e movimento","codice_sector":"AFAM044","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"16-11-2026","ultimo_giorno_candidatura":"26-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/15120/download/BANDO","https://afam-anagrafiche.mur.gov.it/15121/download/BANDO","https://afam-anagrafiche.mur.gov.it/15318/download/BANDO"],"bando_inpa":"","email_rup":"consvr@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2954","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2954","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Lingua straniera","discipline_descrizione":"Il settore concerne gli studi e le ricerche sulle lingue europee ed extra europee con attenzione rivolta particolarmente all’utilizzo dei differenti modelli linguistici in ambito artistico, dello spettacolo, del design e del restauro. Comprende, inoltre, le modalità espressive e più estesamente concettuali usate nelle diverse culture con specifiche terminologie critiche e tecniche utilizzate oggi nel mo t/ricerca-bandi-ante-2025","discipline_nomi":"Pratiche d'insieme ed estemporanee per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, comprende le pratiche musicali d’insieme e l’improvvisazione nei loro vari aspetti. Particolare rilievo assume la valorizzazione di specifiche competenze di interazione, dal duo alla compagine orchestrale, sia in contesti dove l’estemporaneità è limitata, che nell’elaborazione dei processi di creazione estemporanea e nella configurazione di assetti ritmici d’insieme idiomatici nonché nella gestione degli equilibri timbrico/dinamici connessi","codice_sector":"AFAM037","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"VIBO VALENTIA","puoi_candidarsi_da":"04-11-2026","ultimo_giorno_candidatura":"19-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14594/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/7171a14e33654759be85c5a9ad2024db","email_rup":"p.cataudella@consvv.it","telefono_rup":"0963591084"},{"bando_id":"2909","istituto":"CONSERVATORIO DI MUSICA DI VIBO VALENTIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2909","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pedagogia musicale e psicologia della musica","discipline_descrizione":"Il settore concerne lo studio e la ricerca sia delle metodologie e della didattica dell’insegnamento musicale, sia degli aspetti psicologici e pedagogici che sottendono ai processi di insegnamento/apprendimento della musica e dello strumento, dalla prima infanzia fino all’età adulta, in contesti scolastici ed extrascolastici. È previsto l’approfondimento delle tematiche relative alle disabilità e ai bisogni educativi speciali","codice_sector":"AFAM053","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"VIBO VALENTIA","puoi_candidarsi_da":"03-11-2026","ultimo_giorno_candidatura":"03-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14540/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/fd67444ea3d24fb9a48188fcf70516e2","email_rup":"p.cataudella@consvv.it","telefono_rup":"0963591084"},{"bando_id":"2904","istituto":"CONSERVATORIO DI MUSICA DI PESARO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2904","sito_istituzionale":"http://www.conservatorio.pr.it/","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"PESARO","puoi_candidarsi_da":"03-11-2026","ultimo_giorno_candidatura":"02-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14427/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/b2871baa0f2b4e4bb6751d1439e82072","email_rup":"reclutamento@conservatorio.pr.it","telefono_rup":"0 scipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, timbrico, nonché le competenze tecnicoespressive relative all’uso della voce. Fondamentale aspetto di questo settore è lo studio delle forme compositive e delle tecniche della comunicazione musicale. Il settore concerne inoltre la didattica della composizione, con specifico riferimento all’applicazione in ambito formativo-educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM041","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"FERMO","puoi_candidarsi_da":"02-11-2026","ultimo_giorno_candidatura":"02-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14388/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/intro-table","email_rup":"direttore.fermo@conservatorio.net","telefono_rup":"0734225495"},{"bando_id":"2889","istituto":"ACCADEMIA DI BELLE ARTI DI FIRENZE","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2889","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"FIRENZE","puoi_candidarsi_da":"31-10-2026","ultimo_giorno_candidatura":"30-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14359/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=520886b65515411298b4cb89f3c04a40","e a realizzazione di percorsi armonici al pianoforte, le trasposizioni tonali e le metodologie di armonizzazione al pianoforte, anche con specifico riferimento all’applicazione in ambito didattico","codice_sector":"AFAM051","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"SASSARI","puoi_candidarsi_da":"30-10-2026","ultimo_giorno_candidatura":"02-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14291/download/BANDO","https://afam-anagrafiche.mur.gov.it/14994/download/BANDO","https://afam-anagrafiche.mur.gov.it/15231/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/dcaa4b10254f41ccbe735679bfc39df1","email_rup":"protocollo@conservatorio.sassari.it","telefono_rup":"079296447"},{"bando_id":"2874","istituto":"CONSERVATORIO DI MUSICA DI SASSARI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2874","sito_istituzionale":"https://www.conservatorio.sassari.it/AmministrazioneTrasparente/Index/66e0c98e-30d2-468c-95b9-7ce2919eb2f3_at-page","discipline_nomi":"Composizione, arrangiamento e concertazione per i nuovi linguaggi musicali","discipline_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"SASSARI","puoi_candidarsi_da":"30-10-2026","ultimo_giorno_candidatura":"02-12-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14290/download/BANDO","https://afam-anagrafiche.mur.gov.it/14992/download/BANDO","https://afam-anagrafiche.mur.gov.it/15227/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/78d2e6c057654265ba3a098d0dcdd21a","email_rup":"protocollo@conservatorio.sassari.it","telefono_rup":"079296447"},{"bando_id":"2873","istituto":"CONSERVATORIO DI MUSICA DELL'AQUILA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2873","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pedagogia musicale e psicologia della musica","discipline_descrizione":"Il settore concerne lo studio e la ricerca sia delle metodologie e della didattica dell’insegnamento musicale, sia degli aspetti psicologici e pedagogici che sottendono ai processi di insegnamento/apprendimento della musica e dello strumento, dalla prima infanzia fino all’età adulta, in contesti scolastici ed extrascolastici. È previsto l’approfondimento delle tematiche relative alle disabilità e ai bisogni educativi speciali","codice_sector":"AFAM053","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"AQUILA","puoi_candidarsi_da":"29-10-2026","ultimo_giorno_candidatura":"28-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14256/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/e66d5064ef3140c2b0510cbfda47d8c9","email_rup":"personale@consaq.it","telefono_rup":"086222122"},{"bando_id":"2872","istituto":"CONSERVATORIO DI MUSICA DELL'AQUILA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2872","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Trombone","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM016","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"AQUILA","puoi_candidarsi_da":"29-10-2026","ultimo_giorno_candidatura":"28-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14254/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/47c55a7cb1884dfe907bd85aa0c6bc07","email_rup":"personale@consaq.it","telefono_rup":"086222122"},{"bando_id":"2870","istituto":"ACCADEMIA DI BELLE ARTI DI RAVENNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2870","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"RAVENNA","puoi_candidarsi_da":"30-10-2026","ultimo_giorno_candidatura":"19-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14229/download/BANDO","https://afam-anagrafiche.mur.gov.it/14230/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@abaravenna.it","telefono_rup":"0544453125"},{"bando_id":"2869","istituto":"CONSERVATORIO DI MUSICA DI CUNEO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2869","sito_istituzionale":"https://www.conservatoriocuneo.it/","discipline_nomi":"Violino","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM006","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatori
