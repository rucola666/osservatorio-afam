<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osservatorio-afam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sfondo: #FCFDFD;
  --accento: #0066CC;
  --accento-2: #FF0000;
  --contrasto: #000000;
  --neutro-1: #E8E8E8;
  --neutro-2: #525252;
  --font-size: 20px;
  --font-size-mobile: 14px;
  --testo: lowercase;
  --weight-1: 420;
  --weight-2: 570;
  --weight-3: 720;
  --raggio-bottoni: 10px;
  --raggio-card: 30px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  text-transform: var(--testo);
  background: var(--sfondo);
  color: var(--accento);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  font-size: var(--font-size);
  background: var(--sfondo);
  text-transform: var(--testo);
  padding: 10px 10px;
  border-bottom: 2px solid var(--neutro-1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-testo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.br-mobile {
  display: none;
}

header h1 {
  font-size: var(--font-size);
  font-weight: var(--weight-3);
  text-transform: var(--testo);
  letter-spacing: 0;
  white-space: nowrap;
}

.header-sottotitolo {
  font-weight: var(--weight-1);
  color: var(--accento);
  margin-top: 0;
  margin-left: auto;
  letter-spacing: 0;
  white-space: nowrap;
}

.header-conteggio {
  display: none;
}

main {
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);

  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#filtri {
  width: 33.333%;
  min-width: 33.333%;
  overflow-y: auto;
  padding: 20px;
  border-right: 2px solid var(--neutro-1);
  background: var(--sfondo);
}

#offerte {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.filtro-categoria {
  margin-bottom: 14px;
}

.filtro-titolo {
  color: var(--accento);
  letter-spacing: 0;
  margin-bottom: 10px;
}

.filtro-bottoni {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filtro-bottone {
  font-size: var(--font-size);
  font-weight: var(--weight-1);
  background: var(--neutro-1);
  color: var(--neutro-2);
  text-transform: var(--testo);
  border: 1px solid transparent;
  border-radius: var(--raggio-bottoni);
  padding: 1px 7px;
  font-family: 'Titillium Web', sans-serif;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filtro-bottone.attivo {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo.azzerato {
  background: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown {
  position: relative;
}

.filtro-dropdown-trigger {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0;
  transition: all 0.15s ease;
}

.filtro-dropdown-trigger.ha-filtri,
.filtro-dropdown-trigger.aperto {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-dropdown-trigger.ha-azzerati {
  background: var(--accento-2);
  border-color: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown-toggle {
  line-height: 1;
}

.filtro-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sfondo);
  border: 0px solid var(--neutro-2);
  z-index: 200;
  padding: 6px;
}

.filtro-dropdown-menu.aperto {
  display: block;
  position: static;
  margin-top: 6px;
  width: 100%;
}

.filtro-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.filtro-dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--neutro-2);
}

.filtro-dropdown-menu .filtro-codice-toggle {
  margin-top: 6px;
  margin-bottom: 6px;
}

.filtro-reset {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  margin-top: 7px;
  transition: all 0.15s ease;
}

@media (hover: hover) and (pointer: fine) {
  .filtro-bottone:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-dropdown-trigger:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-reset:hover {
    background: var(--accento);
    color: var(--sfondo);
  }
}

.lista-offerte {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 900px) {
  .lista-offerte {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
  min-width: 0;
  overflow-wrap: break-word;
}

.card:hover {
  border-color: var(--accento);
}

.card-disciplina {
  font-weight: var(--weight-3);
  color:  var(--accento);
  line-height: 1.1;
  margin-bottom: 3px;
}

.card-info-icon {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--accento);
  cursor: pointer;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
}

.card .tooltip {
  display: none;
  position: absolute;
  top: 34px;
  right: 20px;
  width: calc(100% - 40px);
  background: var(--neutro-1);
  color: var(--contrasto);
  border: 1px solid var(--contrasto);
  padding: 12px;
  font-weight: var(--weight-1);
  line-height: 1.15;
  z-index: 1000;
  white-space: normal;
}

.card:has(.card-info-icon:hover) .tooltip,
.card:has(.tooltip:hover) .tooltip {
  display: block;
    color: var(--neutro-2);
}

.card-campo {
  font-weight: var(--weight-2);
  margin-bottom: 3px;
  line-height: 1.4;
}

.card-valore-puro {
  color: var(--contrasto);
}

.card-etichetta {
  color: var(--neutro-2);
  font-weight: 400;

}

.card-valore {
  color: var(--contrasto);
}

.card-id,
.card-id:visited {
  color: var(--accento);
  text-decoration: none;
}

.card-id:hover {
  color: var(--accento);
  text-decoration: none;
}

.card.offerta-scaduta,
.card.offerta-scaduta .card-disciplina,
.card.offerta-scaduta .card-valore-puro,
.card.offerta-scaduta .card-valore,
.card.offerta-scaduta .card-etichetta,
.card.offerta-scaduta .card-id,
.card.offerta-scaduta .card-id:visited {
  color: var(--neutro-1);
}

.card.offerta-scaduta .card-info-icon {
  color: var(--neutro-1);
}

.card.offerta-scaduta:hover {
  border-color: var(--neutro-1);
}

#filtri::-webkit-scrollbar,
#offerte::-webkit-scrollbar {
  width: 6px;
}

#filtri::-webkit-scrollbar-track,
#offerte::-webkit-scrollbar-track {
  background: transparent;
}

#filtri::-webkit-scrollbar-thumb,
#offerte::-webkit-scrollbar-thumb {
  background: var(--neutro-1);
}

@media (max-width: 768px) {
  :root {
    --font-size: var(--font-size-mobile);
  }

  body {
    height: auto;
    overflow: visible;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 300;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: start;
  }

  .header-testo {
    display: contents;
  }

  header h1 {
    grid-column: 1;
    grid-row: 1 / 3;
    white-space: normal;
    align-self: start;
    line-height: 1;
  }

  .header-sottotitolo {
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: start;
    margin-left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1;
  }

  .br-mobile {
    display: block;
  }

  .hyphen {
    display: none;
  }

  main {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #filtri {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--neutro-1);
    overflow-x: auto;
    display: none;
  }

  #filtri.aperto {
    display: block;
  }

  .card .tooltip,
  .card-info-icon {
    display: none;
  }

  .filtro-bottoni {
    flex-wrap: nowrap;
  }

  .filtro-dropdown-menu .filtro-bottoni {
    flex-wrap: wrap;
  }

  .filtro-dropdown-menu .filtro-bottone {
    flex: 0 1 auto;
  }

  .filtro-bottone-luogo {
    white-space: nowrap;
  }

  .filtro-bottone-disciplina {
    white-space: normal;
    overflow-wrap: break-word;
  }

  .filtro-bottone {
    line-height: 1;
  }

  .filtro-dropdown-trigger {
    line-height: 1;
  }

  .filtro-reset {
    line-height: 1;
  }

  .filtri-toggle {
    background: transparent;
    color: var(--accento);
    border: 2px solid var(--accento);
    border-radius: var(--raggio-bottoni);
    padding: 6px 10px;
    font-family: 'Titillium Web', sans-serif;
    font-size: var(--font-size);
    font-weight: var(--weight-2);
    text-transform: var(--testo);
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filtri-toggle.ha-filtri {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtri-toggle.ha-azzerati {
    background: var(--accento-2);
    border-color: var(--accento-2);
    color: var(--sfondo);
  }

  .filtro-dropdown-menu .filtro-codice-toggle {
    display: none;
  }

  .header-conteggio {
    display: block;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--font-size) * 1.5);
    font-weight: var(--weight-3);
    line-height: 1;
    color: var(--contrasto);
  }

  .offerte-bar .offerte-conteggio {
    display: none;
  }

  #offerte {
    overflow: visible;
  }

  .card {
    padding: 14px;
  }
}

#donazione-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
}

#donazione-overlay.aperto {
  display: flex;
}

.donazione-modal {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 24px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
}

.donazione-contenuto {
  display: flex;
  gap: 20px;
  align-items: center;
}

.donazione-qr {
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
}

.donazione-qr img {
  width: 100%;
  height: 100%;
  display: block;
  border: 2px solid var(--neutro-1);
  border-radius: 8px;
}

.donazione-testo {
  flex: 1;
  min-width: 0;
}

.donazione-testo h2 {
  color: var(--accento);
  font-weight: var(--weight-3);
  margin-bottom: 8px;
}

.donazione-testo p {
  color: var(--neutro-2);
  font-weight: var(--weight-1);
  margin-bottom: 16px;
  line-height: 1.3;
}

.donazione-bottone-paypal {
  display: block;
  text-align: center;
  background: var(--accento);
  color: var(--sfondo);
  padding: 10px;
  border-radius: var(--raggio-bottoni);
  text-decoration: none;
  font-weight: var(--weight-2);
  margin-bottom: 10px;
}

.donazione-bottone-continua {
  display: block;
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  padding: 8px;
  border-radius: var(--raggio-bottoni);
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
}

@media (max-width: 768px) {
  .donazione-contenuto {
    flex-direction: column;
  }
  .donazione-qr {
    width: 140px;
    height: 140px;
  }
}
  </style>
</head>

bilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"RAVENNA","puoi_candidarsi_da":"30-10-2026","ultimo_giorno_candidatura":"19-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/14229/download/BANDO","https://afam-anagrafiche.mur.gov.it/14230/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@abaravenna.it","telefono_rup":"0544453125"},{"bando_id":"2869","istituto":"CONSERVATORIO DI MUSICA DI CUNEO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2869","sito_istituzionale":"https://www.conservatoriocuneo.it/","discipline_nomi":"Violino","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessar ione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM028","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"CATANIA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13780/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/60e31b47aea6408fb99a4479eaf33719","email_rup":"protocollo@conservatoriocatania.it","telefono_rup":"095437127"},{"bando_id":"2795","istituto":"CONSERVATORIO DI MUSICA DI CATANIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2795","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Strumenti a tastiera per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM030","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"CATANIA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13778/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/1915a5f9f54543d1b01b0aad127f278b","email_rup":"protocollo@conservatoriocatania.it","telefono_rup":"095437127"},{"bando_id":"2794","istituto":"CONSERVATORIO DI MUSICA DI CATANIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2794","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Movimento espressivo e consapevolezza corporea per le arti performative","discipline_descrizione":"Il settore concerne la ricerca e la conoscenza delle metodologie e delle tecniche utili al fine di acquisire la consapevolezza corporea per le arti performative, favorendo altresì lo sviluppo motorio-gestuale ed espressivo in ambito artistico e musicale","codice_sector":"AFAM054","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"CATANIA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13770/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/1e4421736fbb4e55a5d8244953db1372","email_rup":"protocollo@conservatoriocatania.it","telefono_rup":"095437127"},{"bando_id":"2793","istituto":"CONSERVATORIO DI MUSICA DI CATANIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2793","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Esecuzione della musica elettroacustica e applicazioni del suono per le arti interattive","discipline_descrizione":"Il settore dell’Esecuzione della musica elettroacustica e applicazioni del suono nelle arti interattive comprende la ricerca, l’esecuzione, l’interpretazione e la regia del suono di opere musicali, su supporto e live, con mezzi di generazione o elaborazione elettronica, mediate da rappresentazioni simboliche o del segnale, nonché la pratica dell’improvvisazione elettroacustica. Fanno parte del settore le competenze culturali inerenti il repertorio elettroacustico dagli inizi al passato recente e la restituzione e produzione di opere originali, negli organici dal solo all’ensemble elettroacustico e misto e in forme sperimentali anche legate alla multimedialità e alle arti interattive. Le competenze tecniche comprendono l’uso in ambito concertistico, performativo e installativo dei microfoni e delle tecnologie elettroacustiche in genere, il controllo informatizzato e lo sviluppo informatico di ambienti esecutivi, anche con l’ausilio di sensori e interfacce gestuali, così come l’interazione tra suono, immagine e movimento","codice_sector":"AFAM044","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"CATANIA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13768/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/2c99d63814c244e39cf70d7b3b223b85","email_rup":"protocollo@conservatoriocatania.it","telefono_rup":"095437127"},{"bando_id":"2793","istituto":"CONSERVATORIO DI MUSICA DI CATANIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2793","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Scienze del suono per la musica","discipline_descrizione":"Il settore delle Scienze del suono per la musica integra diversi ambiti della ricerca artistica e scientifica e le relative applicazioni nella musica elettronica. Tali ambiti sono correlati ad alcuni campi della fisica acustica, dell’analisi numerica, dell’informatica, del design dell’interazione, oltre che della psicologia sperimentale, con riferimento alla cornice disciplinare del Sound and Music Computing. Più nello specifico essi riguardano i fondamenti dell’acustica degli ambienti e degli strumenti musicali, nonché l’ecologia acustica; i modelli di sintesi ed elaborazione del segnale sonoro; l’analisi e la rappresentazione dell’informazione sonora e musicale (inclusa quella simbolica delle diverse forme di notazione musicale); i linguaggi di programmazione, inclusivi delle librerie utili alla produzione di algoritmi per la musica elettroacustica, mista e per i sistemi interattivi, così come i vari applicativi dell’industria musicale; il design del suono per l’interazione; gli elementi della fisiologia e della psicologia della percezione e cognizione uditiva e multimodale","codice_sector":"AFAM046","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"CATANIA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13768/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/2c99d63814c244e39cf70d7b3b223b85","email_rup":"protocollo@conservatoriocatania.it","telefono_rup":"095437127"},{"bando_id":"2793","istituto":"CONSERVATORIO DI MUSICA DI CATANIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2793","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecnologie del suono e della multimedialità","discipline_descrizione":"Il settore delle Tecnologie del suono e della multimedialità comprende diversi ambiti di ricerca e applicazione delle tecnologie nella produzione musicale, nei multimedia e in tutte le forme d’arte che coinvolgano il suono. Tali ambiti riguardano le tecnologie elettroacustiche e informatiche rivolte all’attività degli studi di registrazione e produzione sonora e musicale; le tecnologie per l’audio e la multimedialità utilizzate nelle produzioni per la radio, la televisione, la diffusione di contenuti multimediali sul web, e simili; le tecnologie per l’audio e la multimedialità impiegate nello spettacolo dal vivo (sia per quanto riguarda gli aspetti sonori che multimediali, anche in termini di realizzazione di sistemi interattivi per la scena); le tecnologie per l’audio e la multimedialità rivolte alle forme artistiche performative o installative, nonché alla comunicazione in genere","codice_sector":"AFAM047","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"CATANIA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13768/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/2c99d63814c244e39cf70d7b3b223b85","email_rup":"protocollo@conservatoriocatania.it","telefono_rup":"095437127"},{"bando_id":"2791","istituto":"CONSERVATORIO DI MUSICA DI TRIESTE","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2791","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Oboe","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM013","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"TRIESTE","puoi_candidarsi_da":"23-10-2026","ultimo_giorno_candidatura":"04-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13745/download/BANDO","https://afam-anagrafiche.mur.gov.it/13746/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=13c36503a2ee4d4fabe6db78f638bd35","email_rup":"protocollo@conts.it","telefono_rup":"0406724911"},{"bando_id":"2790","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2790","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-pubbliche-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-2026-2027-sede-di-corigliano-rossano/","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"21-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13657/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","e terpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM028","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"21-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13642/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"personale.timpano@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2776","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2776","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-pubbliche-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-2026-2027-sede-di-corigliano-rossano/","discipline_nomi":"Canto per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica del canto e conoscenze di base della fisiologia dell’apparato vocale e delle componenti psicologiche che contribuiscono alla formazione del suono","codice_sector":"AFAM032","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"21-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13641/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"personale.timpano@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2775","istituto":"ACCADEMIA DI BELLE ARTI DI LECCE","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2775","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecniche artistiche della scultura","discipline_descrizione":"Il settore disciplinare comprende conoscenze, metodi e strumenti per sviluppare competenze multidisciplinari necessarie per un completo sviluppo professionale nel mondo della produzione artistica e industriale. Le applicazioni spaziano dalla realizzazione di opere alla progettazione e rappresentazione di manufatti artistici, includendo la sperimentazione in ambito pubblico e privato. Il settore comprende l’insieme dei saperi delle tecniche per la scultura, la fonderia, marmo e pietre dure, la lavorazione del legno e la saldatura, sviluppando una preparazione tecnica che copre sia le metodologie tradizionali che quelle moderne e contemporanee. L’attività di laboratorio è inscindibile dall’attività della ricerca progettuale, affrontata in una dimensione personale o nelle possibili relazioni interdisciplinari. I contenuti scientifico-disciplinari includono esperienze pratico-operative con materiali tradizionali e di nuova generazione utilizzati nella scultura contemporanea, approfondendo i procedimenti tecnici e le sollecitazioni percettive ed emotive che questi materiali possono originare. Attraverso la pratica si esplorano tecniche di lavorazione delle argille, costruzione di stampi, colatura e stratificazione di materiali, oltre a tecniche di brasatura e saldatura dei metalli. La lavorazione del legno copre tipologie, caratteristiche fisiche e meccaniche, strumenti, incastri, intarsio, assemblaggi e finitura per la creazione di opere tridimensionali. La brasatura e saldatura, compresa la modellazione, forniscono competenze pratico-operative per lavorazioni di strutture e opere scultoree complesse. Il percorso didattico interagisce con imprese creative e culturali, oltre che con istituzioni pubbliche e private operanti nel settore. Il settore delle tecniche del marmo comprende una conoscenza delle problematiche operative per la realizzazione di manufatti in materiale lapideo, sia dal punto di vista teorico, sia sul versante della pratica. La parte teorica si basa sullo studio dei materiali (marmi, graniti, basalti, pietre arenarie e calcaree), delle tecnologie e degli strumenti da utilizzare. La parte pratica assicura un processo completo di lavorazione. I contenuti scientifico-disciplinari delle tecniche per la scultura comprendono lo sviluppo di esperienze pratico operative. Si trattano sia i materiali della tradizione che di nuova generazione della scultura contemporanea, approfondendone la conoscenza Ciò anche per consentire un monitoraggio attento delle innumerevoli sollecitazioni percettive ed emotive che da tali materiali possono avere origine. Si approfondiscono, attraverso la pratica laboratoriale, le varie tecniche di lavorazione delle argille, le tecniche di costruzione di stampi (in gesso, vetro resina e con gomme siliconiche) il riempimento degli stampi attraverso la colatura e la stratificazione dei vari materiali (cemento, cere, polimeri termoplastici e termoindurenti). Inoltre si trattano le tecniche di brasatura e saldatura dei metalli compresa la modellazione. Le tecniche della lavorazione del legno abbracciano attività didattico-formative e di ricerca per fornire metodologie e strumenti sia tradizionali che tecnologici. Lo studente apprenderà la conoscenza delle varie tipologie di legno, gli strumenti per la lavorazione e gli incastri, l’intarsio, gli assemblaggi e la finitura. Le tecniche di fonderia racchiudono conoscenze delle differenti tecniche fusorie, della formatura e lo studio delle cere che, partendo dalle problematiche relative alla produzione di sculture e oggetti, individuano e risolvono gli snodi critici connessi alle tecniche di assemblaggio, all’uso vantaggioso dei materiali metallici nella scultura con strumenti per esplorare il rapporto spaziale della forma con l’ambiente, anche in dialogo con altre discipline","codice_sector":"AFAM082","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"LECCE","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"21-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13574/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=ef541525bba8450ca3c6c896595f00b1","email_rup":"direzioneamministrativa@accademialecce.edu.it","telefono_rup":"0832258635"},{"bando_id":"2773","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2773","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-pubbliche-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-2026-2027-sede-di-corigliano-rossano/","discipline_nomi":"Strumenti a percussione per i nuovi linguaggi musicali","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM031","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"21-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13565/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"personale.timpano@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2772","istituto":"CONSERVATORIO DI MUSICA DI COSENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2772","sito_istituzionale":"https://www.conservatoriocosenza.it/bandi-e-graduatorie/procedure-selettive-pubbliche-per-lattribuzione-di-incarichi-di-docenza-nei-corsi-propedeutici-2026-2027-sede-di-corigliano-rossano/","discipline_nomi":"Composizione, arrangiamento e concertazione per i nuovi linguaggi musicali","discipline_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"COSENZA","puoi_candidarsi_da":"22-10-2026","ultimo_giorno_candidatura":"21-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13564/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"personale.timpano@amministrazione.conservatoriocosenza.it","telefono_rup":"0984709024"},{"bando_id":"2771","istituto":"CONSERVATORIO DI MUSICA DI LIVORNO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2771","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Coro","discipline_descrizione":"Il settore concerne la formazione corale, nella quale l’attenzione viene rivolta alla ricerca, allo studio e all’approfondimento dei principali repertori delle varie epoche fino ai nostri giorni, volte a far acquisire agli studenti competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì lo studio dell’interpretazione, delle tecniche e delle prassi della concertazione, della direzione di coro, applicato a formazioni corali di diverse dimensioni. La formazione del direttore di coro comporta l’approfondimento della composizione, della teoria e dell’analisi della musica vocale corale, nonché la conoscenza dei linguaggi, degli stili vocali e della storia, anche in relazione al teatro musicale. Il settore concerne infine lo studio delle tecniche della concertazione e della direzione di coro con specifico riferimento all’applicazione in ambito formativo - educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM048","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"LIVORNO","puoi_candidarsi_da":"21-10-2026","ultimo_giorno_candidatura":"05-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13488/download/BANDO","https://afam-anagrafiche.mur.gov.it/13489/download/BANDO","https://afam-anagrafiche.mur.gov.it/13605/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=02d430af04f0480db6130760406716b1","email_rup":"direttoreamministrati npa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/9cc3cef6c4534fc7b537de762a733923","email_rup":"personale@conservatorio.tn.it","telefono_rup":"0461 261673"},{"bando_id":"2748","istituto":"CONSERVATORIO DI MUSICA DI TERNI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2748","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Prepolifonia e canto storico","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare con piena consapevolezza le prassi esecutive storiche relative al canto storico nella sua più ampia accezione: dal linguaggio musicale sviluppatosi a partire dall’Alto Medioevo fino allo sviluppo della polifonia; dalla polifonia sacra e profana, alla monodia fino al teatro musicale. Per il raggiungimento di tali obiettivi nel profilo disciplinare di prepolifonia si studiano tutte le forme musicali della cultura occidentale, partendo dal canto monodico cristiano sino alle forme più evolute della polifonia medievale. Fondamentale lo studio delle fonti storiche, paleografiche e semiologiche, nonché delle strutture modali e delle tecniche compositive, allo scopo di sviluppare sia competenze analitiche, che capacità di ricerca musicologica, trascrizione, elaborazione e produzione musicale. Nel profilo disciplinare di canto storico si studiano le tecniche esecutive specifiche del periodo tra il rinascimento e il classicismo compreso, si approfondisce la conoscenza della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica vocale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, all’espressione del testo attraverso il canto correlato alla gestualità. È prevista inoltre la conoscenza della didattica del canto e degli aspetti riguardanti la fisiologia dell’apparato vocale","codice_sector":"AFAM027","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TERNI","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13293/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=3b392c281e164cfaa6edecb0bfd41e8d","email_rup":"direttoreamministrativo@briccialditerni.it","telefono_rup":"0744432170"},{"bando_id":"2746","istituto":"CONSERVATORIO DI MUSICA DI TERNI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2746","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Canto","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM020","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TERNI","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13176/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=9a1f3e17e85346a495a87753666e609c","email_rup":"direttoreamministrativo@briccialditerni.it","telefono_rup":"0744432170"},{"bando_id":"2745","istituto":"CONSERVATORIO DI MUSICA DI TERNI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2745","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pianoforte","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM018","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TERNI","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13174/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=67d09e7e75f8477fa83447451b562bdb","email_rup":"direttoreamministrativo@briccialditerni.it","telefono_rup":"0744432170"},{"bando_id":"2721","istituto":"CONSERVATORIO DI MUSICA DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2721","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione musicale elettroacustica e multimediale","discipline_descrizione":"Il settore della Composizione musicale elettroacustica e multimediale comprende la ricerca e la composizione musicale con mezzi elettroacustici ed informatici anche integrata o abbinata a organici vocali e strumentali; la composizione audiovisiva e la composizione di musica elettroacustica per la multimedialità; la composizione di musica applicata realizzata mediante le nuove tecnologie; la soundscape composition e il sound design nei vari contesti dello spettacolo, delle forme artistiche performative e installative, nonché della comunicazione. Sono richieste competenze inerenti le metodologie dell’analisi musicale dei repertori di interesse","codice_sector":"AFAM045","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"BOLOGNA","puoi_candidarsi_da":"14-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12991/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/3a3b77e6f1d445cc8bea5c4d9690c436","email_rup":"bandiecontratti@consbo.it","telefono_rup":"051 221483"},{"bando_id":"2720","istituto":"ACCADEMIA DI BELLE ARTI DELL'AQUILA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2720","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pittura","discipline_descrizione":"I contenuti artistici del settore disciplinare comprendono le pratiche della pittura finalizzate alla conoscenza analitica e di sintesi delle complesse strutture spaziali/compositive/espressive che la costituiscono, organizzate in processi metodologici di sperimentazione e ricerca, alla luce delle specifiche individualità creative. Nella prassi è previsto sia l’utilizzo dei procedimenti della tradizione come l’affresco, sia la ricerca contemporanea volta alla produzione artistica, anche in una prospettiva metadisciplinare, in rapporto con gli altri campi del sapere e con gli sviluppi tecnologici più recenti. L’autonomia nelle scelte didattiche può tener conto anche delle peculiarità dei contesti territoriali, al fine di sviluppare al meglio le specificità artistiche nel contemporaneo. L’acquisizione della padronanza degli strumenti operativi sarà indispensabile al raggiungimento delle capacità espressive individuali. Fondamentale valore avrà la riflessione sull’operare artistico attraverso la progettualità, la scelta delle poetiche e dei linguaggi, l’analisi e la comparazione con gli esiti formali delle diverse tendenze di pensiero e di espressione in atto","codice_sector":"AFAM079","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"AQUILA","puoi_candidarsi_da":"13-10-2026","ultimo_giorno_candidatura":"12-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12953/download/BANDO","https://afam-anagrafiche.mur.gov.it/13042/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/5793b08a4ff54d0081e7b9574c1a5476","email_rup":"protocollo@abaq.it","telefono_rup":"0862317360"},{"bando_id":"2719","istituto":"ACCADEMIA DI BELLE ARTI DI BARI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2719","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Antropologia e sociologia delle arti, del design e dello spettacolo","discipline_descrizione":"Il settore si articola in due ambiti: antropologico e sociologico. L’ambito antropologico ha come oggetto la riflessione sulle dinamiche simboliche e sociali delle culture, con particolare riferimento all’arte, al design, alla danza e al teatro. Analizza le società complesse e gli archetipi dell’immaginario, esplorati nelle molteplici varianti geografiche e storiche e nel prodursi di relazioni mutevoli tra le comunità umane e la natura, dal tribale al globale. Gli studi si inseriscono nei saperi delle arti e dei linguaggi contemporanei connessi con gli aspetti rituali e sociali. Sono inoltre oggetto di ricerca il folclore, le forme espressive popolari nel rapporto con altre forme della produzione letteraria e artistica e con le strutture antropologiche dell’immaginario. L’ambito sociologico contiene i presupposti teorici, storici e metodologici della ricerca sociale, dei nuovi media, dei processi culturali e della comunicazione, nonché gli strumenti utilizzati nell’analisi delle fenomeniche micro e macro-sociologiche: dai fenomeni della cultura, a quelli comunicativi, dai processi di socializzazione, all’impatto sociale delle arti, del design, della danza, del teatro, del costume, dei media e delle tecnologie avanzate","codice_sector":"AFAM109","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"BARI","puoi_candidarsi_da":"16-10-2026","ultimo_giorno_candidatura":"16-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12872/download/BANDO","https://afam-anagrafiche.mur.gov.it/13106/download/BANDO","https://afam-anagrafiche.mur.gov.it/13233/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"accademiabelleartiba@pec.it","telefono_rup":"080 5566471"},{"bando_id":"2708","istituto":"CONSERVATORIO DI MUSICA DI LA SPEZIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2708","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Musica da camera strumentale e vocale","discipline_descrizione":"Il settore concerne lo studio, la ricerca, la pratica e l’interpretazione della letteratura cameristica strumentale e vocale, con l’approfondimento delle prassi esecutive e i repertori di varie epoche, anche con riferimento all’interpretazione del repertorio vocale da camera e liederistico","codice_sector":"AFAM034","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"LA SPEZIA","puoi_candidarsi_da":"09-10-2026","ultimo_giorno_candidatura":"09-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12759/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"conservatoriospezia@conssp.it","telefono_rup":"0187770333"},{"bando_id":"2702","istituto":"CONSERVATORIO DI MUSICA DI FERMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2702","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come strumento conoscitivo della letteratura musicale e della ricerca, la pratica della lettura a prima vista, della lettura della partitura, dell’accompagnamento e dell’improvvisazione al pianoforte. Comprende inoltre l’identificazione e la realizzazione di percorsi armonici al pianoforte, le trasposizioni tonali e le metodologie di armonizzazione al pianoforte, anche con specifico riferimento all’applicazione in ambito didattico","codice_sector":"AFAM051","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"FERMO","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12712/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/891fd770b8bf40adb37f7eacb4f613ae","email_rup":"protocollo@conservatorio.net","telefono_rup":"0734225495"},{"bando_id":"2701","istituto":"CONSERVATORIO DI MUSICA DI FERMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2701","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come strumento conoscitivo della letteratura musicale e della ricerca, la pratica della lettura a prima vista, della lettura della partitura, dell’accompagnamento e dell’improvvisazione al pianoforte. Comprende inoltre l’identificazione e la realizzazione di percorsi armonici al pianoforte, le trasposizioni tonali e le metodologie di armonizzazione al pianoforte, anche con specifico riferimento all’applicazione in ambito didattico","codice_sector":"AFAM051","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"FERMO","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"07-11-202 const categorie = {
  scuole: { campo: 'tipo_scuola', titolo: 'Scuola', tipo: 'bottoni' },
  contratti: { campo: 'tipo_contratto', titolo: 'Contratto', tipo: 'bottoni' },
  luoghi: { campo: 'dove', titolo: 'Luogo', tipo: 'dropdown' },
  discipline: { campo: 'discipline_nomi', titolo: 'Disciplina', tipo: 'dropdown', codice: 'codice_sector' }
};

const filtriAttivi = {};
Object.keys(categorie).forEach(k => { filtriAttivi[k] = new Set(); });

let ordinamentoScadenza = false;
let mostraCodiciAfam = false;
let filtriAperti = false;
let filtriTotali = 0;
let haAzzeratiGlobali = false;
const dropdownAperti = new Set();

const codicePerDisciplina = new Map();
offerte.forEach(o => {
  const nome = (o.discipline_nomi || '').trim();
  const cod = (o.codice_sector || '').trim();
  if (nome && cod && !codicePerDisciplina.has(nome)) {
    codicePerDisciplina.set(nome, cod);
  }
});

function labelValore(val) {
  return (val === '') ? '/' : val;
}

function etichettaDisciplina(valore) {
  if (!mostraCodiciAfam) return labelValore(valore);
  const cod = codicePerDisciplina.get(valore);
  if (valore === '' || !cod) return '/';
  return cod.replace(/^AFAM/, '');
}

function applicaFiltri(filtri) {
  return offerte.filter(o => {
    return Object.keys(categorie).every(key => {
      const set = filtri[key];
      if (!set || set.size === 0) return true;
      return set.has(o[categorie[key].campo]);
    });
  });
}

function conteggiaValori(lista, campo) {
  const m = new Map();
  lista.forEach(o => {
    const v = (o[campo] || '').trim() === '' ? '' : o[campo];
    m.set(v, (m.get(v) || 0) + 1);
  });
  return m;
}

function configuraEtichetta(key, valore, conf, mostraCodici) {
  if (conf.codice) return etichettaDisciplina(valore);
  if (key === 'contratti') {
    const abbrev = {
      'altri contratti': 'altri',
      'tempo determinato': 'determinato',
      'tempo indeterminato': 'indeterminato'
    };
    const base = valore.toLowerCase();
    return abbrev[base] !== undefined ? abbrev[base] : labelValore(valore);
  }
  return labelValore(valore);
}

function renderFiltri() {
  const aside = document.getElementById('filtri');
  aside.innerHTML = '';
  filtriTotali = 0;
  haAzzeratiGlobali = false;

  Object.keys(categorie).forEach(key => {
    const conf = categorie[key];
    const filtriEsclusi = {};
    Object.keys(categorie).forEach(k => {
      if (k !== key) filtriEsclusi[k] = filtriAttivi[k];
    });
    const tutti = conteggiaValori(offerte, conf.campo);
    const base = applicaFiltri(filtriEsclusi);
    const attive = base.filter(o => !isScaduta(o));
    const conteggi = conteggiaValori(attive, conf.campo);
    const items = [...tutti.keys()]
      .map((valore) => ({ valore: valore, etichetta: configuraEtichetta(key, valore, conf, mostraCodiciAfam), conteggio: conteggi.get(valore) || 0 }))
      .filter((it) => it.conteggio > 0 || filtriAttivi[key].has(it.valore))
      .sort((a, b) => a.etichetta.localeCompare(b.etichetta));
    renderFiltro(key, conf.titolo, items, conf.tipo, conf.codice);
    items.forEach(it => {
      if (filtriAttivi[key].has(it.valore)) {
        filtriTotali += 1;
        if (it.conteggio === 0) haAzzeratiGlobali = true;
      }
    });
  });

  const resetBtn = document.createElement('button');
  resetBtn.className = 'filtro-reset';
  resetBtn.textContent = 'reset';
  resetBtn.addEventListener('click', resetFiltri);
  aside.appendChild(resetBtn);

  if (filtriAperti) {
    aside.classList.add('aperto');
  } else {
    aside.classList.remove('aperto');
  }
}

function resetFiltri() {
  Object.keys(categorie).forEach(k => { filtriAttivi[k].clear(); });
  if (!window.matchMedia('(max-width: 768px)').matches) {
    dropdownAperti.clear();
  }
  renderFiltri();
  renderOfferte();
}

function renderFiltro(key, titolo, items, tipo, codice) {
  const aside = document.getElementById('filtri');
  const div = document.createElement('div');
  div.className = 'filtro-categoria';

  if (tipo === 'dropdown') {
    renderDropdown(div, key, titolo, items, codice);
  } else {
    const titleEl = document.createElement('div');
    titleEl.className = 'filtro-titolo';
    titleEl.textContent = titolo;
    div.appendChild(titleEl);
    renderBottoni(div, key, items);
  }

  aside.appendChild(div);
}

function renderBottoni(div, key, items) {
  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    btn.textContent = it.etichetta + ' ' + it.conteggio;
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  div.appendChild(bottoni);
}

function abbreviaNomeDisciplina(nome) {
  const parole = String(nome).trim().split(/\s+/).filter(Boolean);
  if (parole.length <= 3) return nome;
  return parole.slice(0, 3).join(' ') + '...';
}

function labelToggle(aperto) {
  return aperto ? '-\u00A0\u00A0\u00A0' : '+\u00A0\u00A0\u00A0';
}

function renderDropdown(div, key, titolo, items, codice) {
  const wrapper = document.createElement('div');
  wrapper.className = 'filtro-dropdown';

  const trigger = document.createElement('button');
  trigger.className = 'filtro-dropdown-trigger';
  const toggle = document.createElement('span');
  toggle.className = 'filtro-dropdown-toggle';
  toggle.textContent = labelToggle(false);
  const triggerLabel = document.createElement('span');
  triggerLabel.textContent = titolo;
  trigger.appendChild(toggle);
  trigger.appendChild(triggerLabel);

  const menu = document.createElement('div');
  menu.className = 'filtro-dropdown-menu';

  if (codice) {
    const toggleVista = document.createElement('button');
    toggleVista.className = 'filtro-reset filtro-codice-toggle';
    toggleVista.textContent = mostraCodiciAfam ? 'mostra nomi' : 'codici afam';
    toggleVista.addEventListener('click', () => {
      mostraCodiciAfam = !mostraCodiciAfam;
      renderFiltri();
    });
    menu.appendChild(toggleVista);
  }

  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  const mostraCodici = !!(codice && mostraCodiciAfam);
  const mobile = window.matchMedia('(max-width: 768px)').matches;
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    if (key === 'luoghi') btn.classList.add('filtro-bottone-luogo');
    if (key === 'discipline') btn.classList.add('filtro-bottone-disciplina');
    let etichetta = it.etichetta;
    if (codice && !mostraCodici && mobile) {
      etichetta = abbreviaNomeDisciplina(etichetta);
    }
    btn.textContent = (codice && mostraCodici) ? it.etichetta : (etichetta + '\u00A0' + it.conteggio);
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  menu.appendChild(bottoni);

  const haAzzerati = items.some(it => filtriAttivi[key].has(it.valore) && it.conteggio === 0);
  if (haAzzerati) {
    trigger.classList.add('ha-azzerati');
  }

  trigger.addEventListener('click', () => {
    let aperto = menu.classList.toggle('aperto');
    trigger.classList.toggle('aperto', aperto);
    toggle.textContent = labelToggle(aperto);
    if (aperto) {
      dropdownAperti.add(key);
    } else {
      dropdownAperti.delete(key);
    }
  });

  if (dropdownAperti.has(key)) {
    menu.classList.add('aperto');
    trigger.classList.add('aperto');
    toggle.textContent = labelToggle(true);
  }

  if (filtriAttivi[key].size > 0) {
    trigger.classList.add('ha-filtri');
  }

  wrapper.appendChild(trigger);
  wrapper.appendChild(menu);
  div.appendChild(wrapper);
}

function toggleFiltro(key, val, btn) {
  if (filtriAttivi[key].has(val)) {
    filtriAttivi[key].delete(val);
  } else {
    filtriAttivi[key].add(val);
  }
  renderFiltri();
  renderOfferte();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function titleCase(s) {
  if (!s) return s;
  return s.toLowerCase().split(/\s+/).map(function (w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function parseDataBando(s) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec((s || '').trim());
  if (!m) return null;
  const gg = parseInt(m[1], 10), mm = parseInt(m[2], 10), aaaa = parseInt(m[3], 10);
  const d = new Date(aaaa, mm - 1, gg);
  if (d.getFullYear() !== aaaa || d.getMonth() !== mm - 1 || d.getDate() !== gg) return null;
  return d.getTime();
}

function isScaduta(o, nowMs = Date.now()) {
  const ts = parseDataBando(o.ultimo_giorno_candidatura);
  return ts !== null && nowMs > ts + 86399999;
}

function ordinaScadenza(lista, crescente) {
  const copia = lista.slice();
  copia.sort((a, b) => {
    const ta = parseDataBando(a.ultimo_giorno_candidatura);
    const tb = parseDataBando(b.ultimo_giorno_candidatura);
    const inA = ta === null;
    const inB = tb === null;
    if (inA && inB) return 0;
    if (inA) return 1;
    if (inB) return -1;
    if (ta === tb) return 0;
    return crescente ? (ta - tb) : (tb - ta);
  });
  return copia;
}

function renderOfferte() {
  let filtrate = applicaFiltri(filtriAttivi);
  if (ordinamentoScadenza !== null) {
    filtrate = ordinaScadenza(filtrate, ordinamentoScadenza);
  }

  const section = document.getElementById('offerte');
  section.innerHTML = '';

  const attive = filtrate.filter(o => !isScaduta(o));
  const headerConteggio = document.querySelector('.header-conteggio');
  if (headerConteggio) {
    headerConteggio.textContent = String(attive.length);
  }

  const bar = document.createElement('div');
  bar.className = 'offerte-bar';
  bar.style.cssText = 'display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;';

  if (window.matchMedia('(max-width: 768px)').matches) {
    const filtriToggle = document.createElement('button');
    filtriToggle.className = 'filtri-toggle';
    filtriToggle.textContent = filtriAperti ? '-\u00A0\u00A0\u00A0filtri' : '+\u00A0\u00A0\u00A0filtri';
    if (filtriTotali > 0) filtriToggle.classList.add('ha-filtri');
    if (haAzzeratiGlobali) filtriToggle.classList.add('ha-azzerati');
    filtriToggle.addEventListener('click', () => {
      filtriAperti = !filtriAperti;
      renderFiltri();
      renderOfferte();
    });
    bar.appendChild(filtriToggle);
  }

  const count = document.createElement('div');
  count.className = 'offerte-conteggio';
  count.style.cssText = 'color: var(--contrasto); font-size: var(--font-size); font-weight: var(--weight-3);';
  const numero = document.createElement('span');
  numero.className = 'offerte-numero';
  numero.textContent = String(attive.length);
  const testo = document.createElement('span');
  testo.className = 'offerte-etichetta';
  testo.textContent = ' offert' + (attive.length === 1 ? 'a' : 'e') + ' trovat' + (attive.length === 1 ? 'a' : 'e');
  count.appendChild(numero);
  count.appendChild(testo);
  bar.appendChild(count);

  const sortBtn = document.createElement('button');
  sortBtn.className = 'filtro-bottone ordina-bottone';
  const etichettaOrd = ordinamentoScadenza === true ? 'Scadenza più vicina' : 'Scadenza più lontana';
  sortBtn.textContent = etichettaOrd;
  sortBtn.addEventListener('click', () => {
    ordinamentoScadenza = ordinamentoScadenza === true ? false : true;
    renderOfferte();
  });
  bar.appendChild(sortBtn);

  section.appendChild(bar);

  const grid = document.createElement('div');
  grid.className = 'lista-offerte';

  if (filtrate.length === 0) {
    const msg = document.createElement('p');
    msg.style.cssText = 'color: var(--neutro-1); font-size: var(--font-size); padding: 40px;';
    msg.textContent = 'Nessuna offerta trovata con i filtri selezionati.';
    grid.appendChild(msg);
  }

  const isMobile = window.matchMedia('(max-width: 768px)').matches;

  filtrate.forEach(o => {
    const card = document.createElement('div');
    card.className = 'card';

    if (isScaduta(o)) {
      card.classList.add('offerta-scaduta');
    }

    const disc = document.createElement('div');
    disc.className = 'card-disciplina';
    if (o.bando_url) {
      const a = document.createElement('a');
      a.className = 'card-id';
      a.href = o.bando_url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = o.discipline_nomi ? o.discipline_nomi : '/';
      disc.appendChild(a);
    } else {
      disc.textContent = o.discipline_nomi ? o.discipline_nomi : '/';
    }
    card.appendChild(disc);

    const infoWrap = document.createElement('span');
    infoWrap.className = 'card-info-icon';
    infoWrap.textContent = '+';
    const tip = document.createElement('div');
    tip.className = 'tooltip';
    tip.textContent = o.discipline_descrizione;
    card.appendChild(infoWrap);
    card.appendChild(tip);

    const campo = (label, value) => {
      const el = document.createElement('div');
      el.className = 'card-campo';
      const lbl = document.createElement('span');
      lbl.className = 'card-etichetta';
      lbl.textContent = label;
      const val = document.createElement('span');
      val.className = 'card-valore';
      val.textContent = value;
      el.appendChild(lbl);
      el.appendChild(val);
      return el;
    };

    const istituto = document.createElement('div');
    istituto.className = 'card-campo card-valore-puro';
    istituto.textContent = o.istituto ? o.istituto : '/';
    card.appendChild(istituto);

    card.appendChild(campo('Scade il ', (o.ultimo_giorno_candidatura || '').trim().replace(/-/g, '.')));

    if (!isMobile) {
      const idCampo = document.createElement('div');
      idCampo.className = 'card-campo';
      const idLabel = document.createElement('span');
      idLabel.className = 'card-etichetta';
      idLabel.textContent = 'Allegati ';
      idCampo.appendChild(idLabel);
      o.allegati.forEach((url, i) => {
        if (!url) return;
        const al = document.createElement('a');
        al.className = 'card-id';
        al.href = url;
        al.target = '_blank';
        al.rel = 'noopener';
        al.textContent = String(i + 1);
        idCampo.appendChild(al);
        if (i < o.allegati.length - 1) {
          idCampo.appendChild(document.createTextNode(' '));
        }
      });
      card.appendChild(idCampo);

      if (o.bando_inpa) {
        const inpaCampo = document.createElement('div');
        inpaCampo.className = 'card-campo';
        const inpaLabel = document.createElement('span');
        inpaLabel.className = 'card-etichetta';
        inpaLabel.textContent = 'Candidature ';
        const inpa = document.createElement('a');
        inpa.className = 'card-id';
        inpa.href = o.bando_inpa;
        inpa.target = '_blank';
        inpa.rel = 'noopener';
        inpa.textContent = 'portale reclutamento';
        inpaCampo.appendChild(inpaLabel);
        inpaCampo.appendChild(inpa);
        card.appendChild(inpaCampo);
      }

      const email = document.createElement('div');
      email.className = 'card-campo card-valore-puro';
      email.textContent = o.email_rup;
      card.appendChild(email);

      const telefono = document.createElement('div');
      telefono.className = 'card-campo card-valore-puro';
      telefono.textContent = '+39 ' + o.telefono_rup;
      card.appendChild(telefono);
    }

    grid.appendChild(card);
  });

  section.appendChild(grid);
}

const PAYPAL_URL = 'https://www.paypal.com/ncp/payment/YVLBRBL8NKXBE';
const DONA_PRIMO = 1;
const DONA_OGNI = 3;

let donaContatore = (() => {
  const n = parseInt(localStorage.getItem('donazione_click') || '0', 10);
  return isNaN(n) ? 0 : n;
})();

let linkInAttesa = null;

function dovrebbeMostrare() {
  return donaContatore === DONA_PRIMO ||
    (donaContatore > DONA_PRIMO && (donaContatore - DONA_PRIMO) % DONA_OGNI === 0);
}

function incrementaClickLink() {
  donaContatore += 1;
  localStorage.setItem('donazione_click', String(donaContatore));
  return dovrebbeMostrare();
}

function mostraDonazione(href) {
  linkInAttesa = href;
  document.getElementById('donazione-overlay').classList.add('aperto');
}

function chiudiDonazione() {
  document.getElementById('donazione-overlay').classList.remove('aperto');
  linkInAttesa = null;
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  if (a.id === 'donazione-paypal') return;
  const href = a.getAttribute('href');
  if (!href || !/^https?:\/\//i.test(href)) return;
  e.preventDefault();
  if (incrementaClickLink()) {
    mostraDonazione(href);
  } else {
    window.open(href, '_blank', 'noopener');
  }
}, true);

document.getElementById('donazione-paypal').addEventListener('click', (e) => {
  e.preventDefault();
  const href = linkInAttesa;
  chiudiDonazione();
  window.open(PAYPAL_URL, '_blank', 'noopener');
  if (href) window.open(href, '_blank', 'noopener');
});

document.getElementById('donazione-continua').addEventListener('click', () => {
  const href = linkInAttesa;
  chiudiDonazione();
  if (href) window.open(href, '_blank', 'noopener');
});

renderFiltri();
renderOfferte();
  </script>
