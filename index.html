ca d'insieme per voci e strumenti storici","discipline_descrizione":"Il settore concerne lo studio, la ricerca, la pratica e l’interpretazione della musica d’insieme con voci e strumenti storici. Tale studio serve da punto di raccordo interdisciplinare tra le prassi esecutive strumentali e vocali e la pratica del basso continuo. Lo scopo è la conoscenza e l’approfondimento, oltre che delle tecniche, della letteratura, dei vari stili e dei sistemi di temperamento in uso. Per il raggiungimento di tali obiettivi la pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione e alla gestualità, prevedendo tutti i possibili organici presenti nella letteratura, dalle piccole formazioni da camera ai grandi insiemi","codice_sector":"AFAM038","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"06-10-2026","ultimo_giorno_candidatura":"26-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12328/download/BANDO","https://afam-anagrafiche.mur.gov.it/12329/download/BANDO","https://afam-anagrafiche.mur.gov.it/12330/download/BANDO","https://afam-anagrafiche.mur.gov.it/12668/download/BANDO","https://afam-anagrafiche.mur.gov.it/13035/download/BANDO"],"bando_inpa":"","email_rup":"protocollo@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2679","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2679","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"06-10-2026","ultimo_giorno_candidatura":"26-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12328/download/BANDO","https://afam-anagrafiche.mur.gov.it/12329/download/BANDO","https://afam-anagrafiche.mur.gov.it/12330/download/BANDO","https://afam-anagrafiche.mur.gov.it/12668/download/BANDO","https://afam-anagrafiche.mur.gov.it/13035/download/BANDO"],"bando_inpa":"","email_rup":"protocollo@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2679","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2679","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, timbrico, nonché le competenze tecnicoespressive relative all’uso della voce. Fondamentale aspetto di questo settore è lo studio delle forme compositive e delle tecniche della comunicazione musicale. Il settore concerne inoltre la didattica della composizione, con specifico riferimento all’applicazione in ambito formativo-educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM041","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"06-10-2026","ultimo_giorno_candidatura":"26-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12328/download/BANDO","https://afam-anagrafiche.mur.gov.it/12329/download/BANDO","https://afam-anagrafiche.mur.gov.it/12330/download/BANDO","https://afam-anagrafiche.mur.gov.it/12668/download/BANDO","https://afam-anagrafiche.mur.gov.it/13035/download/BANDO"],"bando_inpa":"","email_rup":"protocollo@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2679","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2679","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione, arrangiamento e concertazione per i nuovi linguaggi musicali","discipline_descrizione":"Oggetto del settore sono gli aspetti compositivi e la relativa ricerca nell’ambito dei nuovi linguaggi musicali, comprendendo sia l’accezione della composizione originale, sia quella dell’elaborazione, della trascrizione, dell’arrangiamento e dell’improvvisazione. Relativamente agli sviluppi storico/stilistici del jazz e della popular music, saranno approfondite le competenze linguistiche e tecnico-espressive relative all’uso della voce e di ogni organico strumentale. L’orchestrazione e l’arrangiamento assumono aspetti particolari in tipologie di repertori in cui la funzione compositiva non è prescrittiva. Saranno promosse le competenze di concertazione e direzione musicale anche in esperienze di creazione istantanea e collettiva eterodiretta","codice_sector":"AFAM042","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"VERONA","puoi_candidarsi_da":"06-10-2026","ultimo_giorno_candidatura":"26-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12328/download/BANDO","https://afam-anagrafiche.mur.gov.it/12329/download/BANDO","https://afam-anagrafiche.mur.gov.it/12330/download/BANDO","https://afam-anagrafiche.mur.gov.it/12668/download/BANDO","https://afam-anagrafiche.mur.gov.it/13035/download/BANDO"],"bando_inpa":"","email_rup":"protocollo@conservatorioverona.it","telefono_rup":"0458002814"},{"bando_id":"2679","istituto":"CONSERVATORIO DI MUSICA DI VERONA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2679","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Scienze del suono per la musica","discipline_descrizione":"Il settore delle Scienze del suono per la musica integra diversi ambiti della ricerca artistica e scientifica e le relative applicazioni nella musica elettronica. Tali ambiti sono correlati ad alcuni campi della fisica acustica, dell’analisi numerica, dell’informatica, del design dell’interazione, oltre che della psicologia sperimentale, con riferimento alla cornice disciplinare del Sound and Music Computing. Più nello specifico essi riguardano i fondamenti dell’acustica degli ambienti e degli strumenti musicali, nonché l’ecologia acustica; i modelli di sintesi ed elaborazione del segnale sonoro; l’analisi e la rappresentazione dell’informazione sonora e musicale (inclusa quella simbolica delle diverse forme di notazione musicale); i linguaggi di programmazione, inclusivi delle librerie utili alla produzione di algoritmi per la musica elettroacustica, mista e per i sistemi interattivi, cos  le metodologie dell’analisi musicale dei repertori di interesse","codice_sector":"AFAM045","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"NOVARA","puoi_candidarsi_da":"21-09-2026","ultimo_giorno_candidatura":"21-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11074/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"fabio.fontaneto@consno.it","telefono_rup":"032131252"},{"bando_id":"2467","istituto":"CONSERVATORIO DI MUSICA DI PADOVA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2467","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pianoforte","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM018","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"PADOVA","puoi_candidarsi_da":"21-09-2026","ultimo_giorno_candidatura":"21-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11051/download/BANDO","https://afam-anagrafiche.mur.gov.it/11052/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/7fa739ff7ec9402596407d9719a7325a","email_rup":"personale@conservatoriopollini.it","telefono_rup":"0498750648"},{"bando_id":"2466","istituto":"CONSERVATORIO DI MUSICA DI FOGGIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza const categorie = {
  scuole: { campo: 'tipo_scuola', titolo: 'Scuola', tipo: 'bottoni' },
  contratti: { campo: 'tipo_contratto', titolo: 'Contratto', tipo: 'bottoni' },
  luoghi: { campo: 'dove', titolo: 'Luogo', tipo: 'dropdown' },
  discipline: { campo: 'discipline_nomi', titolo: 'Disciplina', tipo: 'dropdown', codice: 'codice_sector' }
};

const filtriAttivi = {};
Object.keys(categorie).forEach(k => { filtriAttivi[k] = new Set(); });

let ordinamentoScadenza = false;
let mostraCodiciAfam = false;
let filtriAperti = false;
let filtriTotali = 0;
let haAzzeratiGlobali = false;
const dropdownAperti = new Set();

const codicePerDisciplina = new Map();
offerte.forEach(o => {
  const nome = (o.discipline_nomi || '').trim();
  const cod = (o.codice_sector || '').trim();
  if (nome && cod && !codicePerDisciplina.has(nome)) {
    codicePerDisciplina.set(nome, cod);
  }
});

function labelValore(val) {
  return (val === '') ? '/' : val;
}

function etichettaDisciplina(valore) {
  if (!mostraCodiciAfam) return labelValore(valore);
  const cod = codicePerDisciplina.get(valore);
  if (valore === '' || !cod) return '/';
  return cod.replace(/^AFAM/, '');
}

function applicaFiltri(filtri) {
  return offerte.filter(o => {
    return Object.keys(categorie).every(key => {
      const set = filtri[key];
      if (!set || set.size === 0) return true;
      return set.has(o[categorie[key].campo]);
    });
  });
}

function conteggiaValori(lista, campo) {
  const m = new Map();
  lista.forEach(o => {
    const v = (o[campo] || '').trim() === '' ? '' : o[campo];
    m.set(v, (m.get(v) || 0) + 1);
  });
  return m;
}

function configuraEtichetta(key, valore, conf, mostraCodici) {
  if (conf.codice) return etichettaDisciplina(valore);
  if (key === 'contratti') {
    const abbrev = {
      'altri contratti': 'altri',
      'tempo determinato': 'determinato',
      'tempo indeterminato': 'indeterminato'
    };
    const base = valore.toLowerCase();
    return abbrev[base] !== undefined ? abbrev[base] : labelValore(valore);
  }
  return labelValore(valore);
}

function renderFiltri() {
  const aside = document.getElementById('filtri');
  aside.innerHTML = '';
  filtriTotali = 0;
  haAzzeratiGlobali = false;

  Object.keys(categorie).forEach(key => {
    const conf = categorie[key];
    const filtriEsclusi = {};
    Object.keys(categorie).forEach(k => {
      if (k !== key) filtriEsclusi[k] = filtriAttivi[k];
    });
    const tutti = conteggiaValori(offerte, conf.campo);
    const base = applicaFiltri(filtriEsclusi);
    const attive = base.filter(o => !isScaduta(o));
    const conteggi = conteggiaValori(attive, conf.campo);
    const items = [...tutti.keys()]
      .map((valore) => ({ valore: valore, etichetta: configuraEtichetta(key, valore, conf, mostraCodiciAfam), conteggio: conteggi.get(valore) || 0 }))
      .filter((it) => it.conteggio > 0 || filtriAttivi[key].has(it.valore))
      .sort((a, b) => a.etichetta.localeCompare(b.etichetta));
    renderFiltro(key, conf.titolo, items, conf.tipo, conf.codice);
    items.forEach(it => {
      if (filtriAttivi[key].has(it.valore)) {
        filtriTotali += 1;
        if (it.conteggio === 0) haAzzeratiGlobali = true;
      }
    });
  });

  const resetBtn = document.createElement('button');
  resetBtn.className = 'filtro-reset';
  resetBtn.textContent = 'reset';
  resetBtn.addEventListener('click', resetFiltri);
  aside.appendChild(resetBtn);

  if (filtriAperti) {
    aside.classList.add('aperto');
  } else {
    aside.classList.remove('aperto');
  }
}

function resetFiltri() {
  Object.keys(categorie).forEach(k => { filtriAttivi[k].clear(); });
  if (!window.matchMedia('(max-width: 768px)').matches) {
    dropdownAperti.clear();
  }
  renderFiltri();
  renderOfferte();
}

function renderFiltro(key, titolo, items, tipo, codice) {
  const aside = document.getElementById('filtri');
  const div = document.createElement('div');
  div.className = 'filtro-categoria';

  if (tipo === 'dropdown') {
    renderDropdown(div, key, titolo, items, codice);
  } else {
    const titleEl = document.createElement('div');
    titleEl.className = 'filtro-titolo';
    titleEl.textContent = titolo;
    div.appendChild(titleEl);
    renderBottoni(div, key, items);
  }

  aside.appendChild(div);
}

function renderBottoni(div, key, items) {
  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    btn.textContent = it.etichetta + ' ' + it.conteggio;
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  div.appendChild(bottoni);
}

function abbreviaNomeDisciplina(nome) {
  const parole = String(nome).trim().split(/\s+/).filter(Boolean);
  if (parole.length <= 3) return nome;
  return parole.slice(0, 3).join(' ') + '...';
}

function labelToggle(aperto) {
  return aperto ? '-\u00A0\u00A0\u00A0' : '+\u00A0\u00A0\u00A0';
}

function renderDropdown(div, key, titolo, items, codice) {
  const wrapper = document.createElement('div');
  wrapper.className = 'filtro-dropdown';

  const trigger = document.createElement('button');
  trigger.className = 'filtro-dropdown-trigger';
  const toggle = document.createElement('span');
  toggle.className = 'filtro-dropdown-toggle';
  toggle.textContent = labelToggle(false);
  const triggerLabel = document.createElement('span');
  triggerLabel.textContent = titolo;
  trigger.appendChild(toggle);
  trigger.appendChild(triggerLabel);

  const menu = document.createElement('div');
  menu.className = 'filtro-dropdown-menu';

  if (codice) {
    const toggleVista = document.createElement('button');
    toggleVista.className = 'filtro-reset filtro-codice-toggle';
    toggleVista.textContent = mostraCodiciAfam ? 'mostra nomi' : 'codici afam';
    toggleVista.addEventListener('click', () => {
      mostraCodiciAfam = !mostraCodiciAfam;
      renderFiltri();
    });
    menu.appendChild(toggleVista);
  }

  const bottoni = document.createElement('div');
  bottoni.className = 'filtro-bottoni';
  const mostraCodici = !!(codice && mostraCodiciAfam);
  const mobile = window.matchMedia('(max-width: 768px)').matches;
  items.forEach(it => {
    const btn = document.createElement('button');
    btn.className = 'filtro-bottone';
    if (key === 'luoghi') btn.classList.add('filtro-bottone-luogo');
    if (key === 'discipline') btn.classList.add('filtro-bottone-disciplina');
    let etichetta = it.etichetta;
    if (codice && !mostraCodici && mobile) {
      etichetta = abbreviaNomeDisciplina(etichetta);
    }
    btn.textContent = (codice && mostraCodici) ? it.etichetta : (etichetta + '\u00A0' + it.conteggio);
    btn.dataset.categoria = key;
    btn.dataset.valore = it.valore;
    if (filtriAttivi[key].has(it.valore)) {
      btn.classList.add('attivo');
      if (it.conteggio === 0) btn.classList.add('azzerato');
    }
    btn.addEventListener('click', () => toggleFiltro(key, it.valore, btn));
    bottoni.appendChild(btn);
  });
  menu.appendChild(bottoni);

  const haAzzerati = items.some(it => filtriAttivi[key].has(it.valore) && it.conteggio === 0);
  if (haAzzerati) {
    trigger.classList.add('ha-azzerati');
  }

  trigger.addEventListener('click', () => {
    let aperto = menu.classList.toggle('aperto');
    trigger.classList.toggle('aperto', aperto);
    toggle.textContent = labelToggle(aperto);
    if (aperto) {
      dropdownAperti.add(key);
    } else {
      dropdownAperti.delete(key);
    }
  });

  if (dropdownAperti.has(key)) {
    menu.classList.add('aperto');
    trigger.classList.add('aperto');
    toggle.textContent = labelToggle(true);
  }

  if (filtriAttivi[key].size > 0) {
    trigger.classList.add('ha-filtri');
  }

  wrapper.appendChild(trigger);
  wrapper.appendChild(menu);
  div.appendChild(wrapper);
}

function toggleFiltro(key, val, btn) {
  if (filtriAttivi[key].has(val)) {
    filtriAttivi[key].delete(val);
  } else {
    filtriAttivi[key].add(val);
  }
  renderFiltri();
  renderOfferte();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function titleCase(s) {
  if (!s) return s;
  return s.toLowerCase().split(/\s+/).map(function (w) {
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}

function parseDataBando(s) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec((s || '').trim());
  if (!m) return null;
  const gg = parseInt(m[1], 10), mm = parseInt(m[2], 10), aaaa = parseInt(m[3], 10);
  const d = new Date(aaaa, mm - 1, gg);
  if (d.getFullYear() !== aaaa || d.getMonth() !== mm - 1 || d.getDate() !== gg) return null;
  return d.getTime();
}

function isScaduta(o, nowMs = Date.now()) {
  const ts = parseDataBando(o.ultimo_giorno_candidatura);
  return ts !== null && nowMs > ts + 86399999;
}

function ordinaScadenza(lista, crescente) {
  const copia = lista.slice();
  copia.sort((a, b) => {
    const ta = parseDataBando(a.ultimo_giorno_candidatura);
    const tb = parseDataBando(b.ultimo_giorno_candidatura);
    const inA = ta === null;
    const inB = tb === null;
    if (inA && inB) return 0;
    if (inA) return 1;
    if (inB) return -1;
    if (ta === tb) return 0;
    return crescente ? (ta - tb) : (tb - ta);
  });
  return copia;
}

        const inpa = document.createElement('a');
        inpa.className = 'card-id';
        inpa.href = o.bando_inpa;
        inpa.target = '_blank';
        inpa.rel = 'noopener';
        inpa.textContent = 'portale reclutamento';
        inpaCampo.appendChild(inpaLabel);
        inpaCampo.appendChild(inpa);
        card.appendChild(inpaCampo);
      }

      const email = document.createElement('div');
      email.className = 'card-campo card-valore-puro';
      email.textContent = o.email_rup;
      card.appendChild(email);

      const telefono = document.createElement('div');
      telefono.className = 'card-campo card-valore-puro';
      telefono.textContent = '+39 ' + o.telefono_rup;
      card.appendChild(telefono);
    }

    grid.appendChild(card);
  });

  section.appendChild(grid);
}

const PAYPAL_URL = 'https://www.paypal.com/ncp/payment/YVLBRBL8NKXBE';
const DONA_PRIMO = 1;
const DONA_OGNI = 3;

let donaContatore = (() => {
  const n = parseInt(localStorage.getItem('donazione_click') || '0', 10);
  return isNaN(n) ? 0 : n;
})();

let linkInAttesa = null;

function dovrebbeMostrare() {
  return donaContatore === DONA_PRIMO ||
    (donaContatore > DONA_PRIMO && (donaContatore - DONA_PRIMO) % DONA_OGNI === 0);
}

function incrementaClickLink() {
  donaContatore += 1;
  localStorage.setItem('donazione_click', String(donaContatore));
  return dovrebbeMostrare();
}

function mostraDonazione(href) {
  linkInAttesa = href;
  document.getElementById('donazione-overlay').classList.add('aperto');
}

function chiudiDonazione() {
  document.getElementById('donazione-overlay').classList.remove('aperto');
  linkInAttesa = null;
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  if (a.id === 'donazione-paypal') return;
  const href = a.getAttribute('href');
  if (!href || !/^https?:\/\//i.test(href)) return;
  e.preventDefault();
  if (incrementaClickLink()) {
    mostraDonazione(href);
  } else {
    window.open(href, '_blank', 'noopener');
  }
}, true);

document.getElementById('donazione-paypal').addEventListener('click', (e) => {
  e.preventDefault();
  const href = linkInAttesa;
  chiudiDonazione();
  window.open(PAYPAL_URL, '_blank', 'noopener');
  if (href) window.open(href, '_blank', 'noopener');
});

document.getElementById('donazione-continua').addEventListener('click', () => {
  const href = linkInAttesa;
  chiudiDonazione();
  if (href) window.open(href, '_blank', 'noopener');
});

renderFiltri();
renderOfferte();
  </script>
