<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osservatorio-afam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sfondo: #FCFDFD;
  --accento: #0066CC;
  --accento-2: #FF0000;
  --contrasto: #000000;
  --neutro-1: #E8E8E8;
  --neutro-2: #525252;
  --font-size: 20px;
  --font-size-mobile: 14px;
  --testo: lowercase;
  --weight-1: 420;
  --weight-2: 570;
  --weight-3: 720;
  --raggio-bottoni: 10px;
  --raggio-card: 30px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  text-transform: var(--testo);
  background: var(--sfondo);
  color: var(--accento);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  font-size: var(--font-size);
  background: var(--sfondo);
  text-transform: var(--testo);
  padding: 10px 10px;
  border-bottom: 2px solid var(--neutro-1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-testo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.br-mobile {
  display: none;
}

header h1 {
  font-size: var(--font-size);
  font-weight: var(--weight-3);
  text-transform: var(--testo);
  letter-spacing: 0;
  white-space: nowrap;
}

.header-sottotitolo {
  font-weight: var(--weight-1);
  color: var(--accento);
  margin-top: 0;
  margin-left: auto;
  letter-spacing: 0;
  white-space: nowrap;
}

.header-conteggio {
  display: none;
}

main {
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);

  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#filtri {
  width: 33.333%;
  min-width: 33.333%;
  overflow-y: auto;
  padding: 20px;
  border-right: 2px solid var(--neutro-1);
  background: var(--sfondo);
}

#offerte {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.filtro-categoria {
  margin-bottom: 14px;
}

.filtro-titolo {
  color: var(--accento);
  letter-spacing: 0;
  margin-bottom: 10px;
}

.filtro-bottoni {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filtro-bottone {
  font-size: var(--font-size);
  font-weight: var(--weight-1);
  background: var(--neutro-1);
  color: var(--neutro-2);
  text-transform: var(--testo);
  border: 1px solid transparent;
  border-radius: var(--raggio-bottoni);
  padding: 1px 7px;
  font-family: 'Titillium Web', sans-serif;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filtro-bottone.attivo {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo.azzerato {
  background: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown {
  position: relative;
}

.filtro-dropdown-trigger {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0;
  transition: all 0.15s ease;
}

.filtro-dropdown-trigger.ha-filtri,
.filtro-dropdown-trigger.aperto {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-dropdown-trigger.ha-azzerati {
  background: var(--accento-2);
  border-color: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown-toggle {
  line-height: 1;
}

.filtro-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sfondo);
  border: 0px solid var(--neutro-2);
  z-index: 200;
  padding: 6px;
}

.filtro-dropdown-menu.aperto {
  display: block;
  position: static;
  margin-top: 6px;
  width: 100%;
}

.filtro-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.filtro-dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--neutro-2);
}

.filtro-dropdown-menu .filtro-codice-toggle {
  margin-top: 6px;
  margin-bottom: 6px;
}

.filtro-reset {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  margin-top: 7px;
  transition: all 0.15s ease;
}

@media (hover: hover) and (pointer: fine) {
  .filtro-bottone:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-dropdown-trigger:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-reset:hover {
    background: var(--accento);
    color: var(--sfondo);
  }
}

.lista-offerte {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 900px) {
  .lista-offerte {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
  min-width: 0;
  overflow-wrap: break-word;
}

.card:hover {
  border-color: var(--accento);
}

.card-disciplina {
  font-weight: var(--weight-3);
  color:  var(--accento);
  line-height: 1.1;
  margin-bottom: 3px;
}

.card-info-icon {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--accento);
  cursor: pointer;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
}

.card .tooltip {
  display: none;
  position: absolute;
  top: 34px;
  right: 20px;
  width: calc(100% - 40px);
  background: var(--neutro-1);
  color: var(--contrasto);
  border: 1px solid var(--contrasto);
  padding: 12px;
  font-weight: var(--weight-1);
  line-height: 1.15;
  z-index: 1000;
  white-space: normal;
}

.card:has(.card-info-icon:hover) .tooltip,
.card:has(.tooltip:hover) .tooltip {
  display: block;
    color: var(--neutro-2);
}

.card-campo {
  font-weight: var(--weight-2);
  margin-bottom: 3px;
  line-height: 1.4;
}

.card-valore-puro {
  color: var(--contrasto);
}

.card-etichetta {
  color: var(--neutro-2);
  font-weight: 400;

}

.card-valore {
  color: var(--contrasto);
}

.card-id,
.card-id:visited {
  color: var(--accento);
  text-decoration: none;
}

.card-id:hover {
  color: var(--accento);
  text-decoration: none;
}

.card.offerta-scaduta,
.card.offerta-scaduta .card-disciplina,
.card.offerta-scaduta .card-valore-puro,
.card.offerta-scaduta .card-valore,
.card.offerta-scaduta .card-etichetta,
.card.offerta-scaduta .card-id,
.card.offerta-scaduta .card-id:visited {
  color: var(--neutro-1);
}

.card.offerta-scaduta .card-info-icon {
  color: var(--neutro-1);
}

.card.offerta-scaduta:hover {
  border-color: var(--neutro-1);
}

#filtri::-webkit-scrollbar,
#offerte::-webkit-scrollbar {
  width: 6px;
}

#filtri::-webkit-scrollbar-track,
#offerte::-webkit-scrollbar-track {
  background: transparent;
}

#filtri::-webkit-scrollbar-thumb,
#offerte::-webkit-scrollbar-thumb {
  background: var(--neutro-1);
}

@media (max-width: 768px) {
  :root {
    --font-size: var(--font-size-mobile);
  }

  body {
    height: auto;
    overflow: visible;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 300;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: start;
  }

  .header-testo {
    display: contents;
  }

  header h1 {
    grid-column: 1;
    grid-row: 1 / 3;
    white-space: normal;
    align-self: start;
    line-height: 1;
  }

  .header-sottotitolo {
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: start;
    margin-left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1;
  }

  .br-mobile {
    display: block;
  }

  .hyphen {
    display: none;
  }

  main {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #filtri {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--neutro-1);
    overflow-x: auto;
    display: none;
  }

  #filtri.aperto {
    display: block;
  }

  .card .tooltip,
  .card-info-icon {
    display: none;
  }

  .filtro-bottoni {
    flex-wrap: nowrap;
  }

  .filtro-dropdown-menu .filtro-bottoni {
    flex-wrap: wrap;
  }

  .filtro-dropdown-menu .filtro-bottone {
    flex: 0 1 auto;
  }

  .filtro-bottone-luogo {
    white-space: nowrap;
  }

  .filtro-bottone-disciplina {
    white-space: normal;
    overflow-wrap: break-word;
  }

  .filtro-bottone {
    line-height: 1;
  }

  .filtro-dropdown-trigger {
    line-height: 1;
  }

  .filtro-reset {
    line-height: 1;
  }

  .filtri-toggle {
    background: transparent;
    color: var(--accento);
    border: 2px solid var(--accento);
    border-radius: var(--raggio-bottoni);
    padding: 6px 10px;
    font-family: 'Titillium Web', sans-serif;
    font-size: var(--font-size);
    font-weight: var(--weight-2);
    text-transform: var(--testo);
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filtri-toggle.ha-filtri {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtri-toggle.ha-azzerati {
    background: var(--accento-2);
    border-color: var(--accento-2);
    color: var(--sfondo);
  }

  .filtro-dropdown-menu .filtro-codice-toggle {
    display: none;
  }

  .header-conteggio {
    display: block;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--font-size) * 1.5);
    font-weight: var(--weight-3);
    line-height: 1;
    color: var(--contrasto);
  }

  .offerte-bar .offerte-conteggio {
    display: none;
  }

  #offerte {
    overflow: visible;
  }

  .card {
    padding: 14px;
  }
}

#donazione-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
}

#donazione-overlay.aperto {
  display: flex;
}

.donazione-modal {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 24px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
}

.donazione-contenuto {
  display: flex;
  gap: 20px;
  align-items: center;
}

.donazione-qr {
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
}

.donazione-qr img {
  width: 100%;
  height: 100%;
  display: block;
  border: 2px solid var(--neutro-1);
  border-radius: 8px;
}

.donazione-testo {
  flex: 1;
  min-width: 0;
}

.donazione-testo h2 {
  color: var(--accento);
  font-weight: var(--weight-3);
  margin-bottom: 8px;
}

.donazione-testo p {
  color: var(--neutro-2);
  font-weight: var(--weight-1);
  margin-bottom: 16px;
  line-height: 1.3;
}

.donazione-bottone-paypal {
  display: block;
  text-align: center;
  background: var(--accento);
  color: var(--sfondo);
  padding: 10px;
  border-radius: var(--raggio-bottoni);
  text-decoration: none;
  font-weight: var(--weight-2);
  margin-bottom: 10px;
}

.donazione-bottone-continua {
  display: block;
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  padding: 8px;
  border-radius: var(--raggio-bottoni);
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
}

@media (max-width: 768px) {
  .donazione-contenuto {
    flex-direction: column;
  }
  .donazione-qr {
    width: 140px;
    height: 140px;
  }
}
  </style>
</head>

ur.gov.it/13317/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/eab07db666404cefa272d8cbbc98f4a6","email_rup":"personale@conservatorio.tn.it","telefono_rup":"0461 261673"},{"bando_id":"2750","istituto":"CONSERVATORIO DI MUSICA DI TRENTO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2750","sito_istituzionale":"https://conservatorio.tn.it/graduatorie-di-istituto/","discipline_nomi":"Strumenti a corde per i nuovi linguaggi musicali","discipline_descrizione":"per i nuovi linguaggi musicali Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare i diversi repertori stilistici del jazz e della popular music con piena consapevolezza delle correlate prassi esecutive e improvvisative, accanto a connesse acquisizioni storico/organologiche e didattiche. Le peculiari esigenze poste dalla creazione musicale estemporanea orienteranno la promozione delle specificità del performer creativo. Al fine di una completa formazione sono altresì comprese nel settore conoscenze metodologiche riferite alla didattica degli strumenti","codice_sector":"AFAM028","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"TRENTO","puoi_candidarsi_da":"19-10-2026","ultimo_giorno_candidatura":"04-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13316/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/8029084e2b8843fbb0f7e3d14c209472","email_rup":"personale@conservatorio.tn.it","telefono_rup":"0461 261673"},{"bando_id":"2749","istituto":"CONSERVATORIO DI MUSICA DI TRENTO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2749","sito_istituzionale":"https://conservatorio.tn.it/graduatorie-di-istituto/","discipline_nomi":"Strumenti a percussione","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM019","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"TRENTO","puoi_candidarsi_da":"19-10-2026","ultimo_giorno_candidatura":"04-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13315/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/9cc3cef6c4534fc7b537de762a733923","email_rup":"personale@conservatorio.tn.it","telefono_rup":"0461 261673"},{"bando_id":"2748","istituto":"CONSERVATORIO DI MUSICA DI TERNI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2748","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Prepolifonia e canto storico","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative necessarie per affrontare con piena consapevolezza le prassi esecutive storiche relative al canto storico nella sua più ampia accezione: dal linguaggio musicale sviluppatosi a partire dall’Alto Medioevo fino allo sviluppo della polifonia; dalla polifonia sacra e profana, alla monodia fino al teatro musicale. Per il raggiungimento di tali obiettivi nel profilo disciplinare di prepolifonia si studiano tutte le forme musicali della cultura occidentale, partendo dal canto monodico cristiano sino alle forme più evolute della polifonia medievale. Fondamentale lo studio delle fonti storiche, paleografiche e semiologiche, nonché delle strutture modali e delle tecniche compositive, allo scopo di sviluppare sia competenze analitiche, che capacità di ricerca musicologica, trascrizione, elaborazione e produzione musicale. Nel profilo disciplinare di canto storico si studiano le tecniche esecutive specifiche del periodo tra il rinascimento e il classicismo compreso, si approfondisce la conoscenza della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica vocale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, all’espressione del testo attraverso il canto correlato alla gestualità. È prevista inoltre la conoscenza della didattica del canto e degli aspetti riguardanti la fisiologia dell’apparato vocale","codice_sector":"AFAM027","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TERNI","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13293/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=3b392c281e164cfaa6edecb0bfd41e8d","email_rup":"direttoreamministrativo@briccialditerni.it","telefono_rup":"0744432170"},{"bando_id":"2746","istituto":"CONSERVATORIO DI MUSICA DI TERNI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2746","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Canto","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM020","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TERNI","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13176/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=9a1f3e17e85346a495a87753666e609c","email_rup":"direttoreamministrativo@briccialditerni.it","telefono_rup":"0744432170"},{"bando_id":"2745","istituto":"CONSERVATORIO DI MUSICA DI TERNI","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2745","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pianoforte","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM018","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"TERNI","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13174/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=67d09e7e75f8477fa83447451b562bdb","email_rup":"direttoreamministrativo@briccialditerni.it","telefono_rup":"0744432170"},{"bando_id":"2743","istituto":"ACCADEMIA DI BELLE ARTI DI MACERATA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2743","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Anatomia artistica e rappresentazioni del corpo","discipline_descrizione":"artistica e rappresentazioni del corpo I contenuti artistico-disciplinari e scientifici dell’Anatomia artistica riguardano la rappresentazione e l’illustrazione scientifica del corpo umano, sia sul piano espressivo che della comunicazione visiva, e le relative conoscenze strutturali, morfologiche, antropometriche e simboliche. Il settore include competenze e ambiti di ricerca concernenti la lettura storica e contemporanea della forma umana e del corpo nell’arte, dall’antichità ai nostri giorni, compresi la storia della disciplina, lo sviluppo delle teorie e dei metodi, la relazione del corpo con l’ambiente, naturale e costruito. Include inoltre lo studio del corpo umano come modello per la struttura organica dell’opera d’arte, nell’ampia accezione di riferimento e mezzo conoscitivo delle regole che definiscono la forma, fino all’atto espressivo autoreferenziale. La metodologia formativa e di ricerca si avvale anche di strumenti interdisciplinari in relazione con le altre forme del sapere; il metodo morfologico si estende all’analisi dell’opera d’arte e alla rappresentazione del mondo naturale. L’attività laboratoriale ha finalità sia espressive sia analitico-descrittive e si realizza mediante il disegno e le altre tecniche tradizionali, dei nuovi media, della multimedialità e dell’Intelligenza Artificiale","codice_sector":"AFAM075","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"MACERATA","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"29-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13150/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=d189d76c67f648a083b9caa16a86b9e2","email_rup":"docenti@abamc.it","telefono_rup":"0733405119"},{"bando_id":"2742","istituto":"CONSERVATORIO DI MUSICA DI ROVIGO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2742","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Oboe","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM013","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"ROVIGO","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"25-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13142/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=4e01395268b44c4c8b17697dc96d1282","email_rup":"stefano.romani@docenti.consrovigo.it","telefono_rup":"042522273"},{"bando_id":"2741","istituto":"ACCADEMIA DI BELLE ARTI DI ROMA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2741","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"31-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13124/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"direzione@abaroma.it","telefono_rup":"063227025"},{"bando_id":"2740","istituto":"CONSERVATORIO DI MUSICA DI SALERNO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2740","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Coro","discipline_descrizione":"Il settore concerne la formazione corale, nella quale l’attenzione viene rivolta alla ricerca, allo studio e all’approfondimento dei principali repertori delle varie epoche fino ai nostri giorni, volte a far acquisire agli studenti competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì lo studio dell’interpretazione, delle tecniche e delle prassi della concertazione, della direzione di coro, applicato a formazioni corali di diverse dimensioni. La formazione del direttore di coro comporta l’approfondimento della composizione, della teoria e dell’analisi della musica vocale corale, nonché la conoscenza dei linguaggi, degli stili vocali e della storia, anche in relazione al teatro musicale. Il settore concerne infine lo studio delle tecniche della concertazione e della direzione di coro con specifico riferimento all’applicazione in ambito formativo - educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM048","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"SALERNO","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"30-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13115/download/BANDO"],"bando_inpa":"","email_rup":"helpdesk@consalerno.it","telefono_rup":"089241086"},{"bando_id":"2739","istituto":"CONSERVATORIO DI MUSICA DI SALERNO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2739","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, timbrico, nonché le competenze tecnicoespressive relative all’uso della voce. Fondamentale aspetto di questo settore è lo studio delle forme compositive e delle tecniche della comunicazione musicale. Il settore concerne inoltre la didattica della composizione, con specifico riferimento all’applicazione in ambito formativo-educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM041","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"SALERNO","puoi_candidarsi_da":"15-10-2026","ultimo_giorno_candidatura":"30-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13114/download/BANDO"],"bando_inpa":"","email_rup":"helpdesk@consalerno.it","telefono_rup":"089241086"},{"bando_id":"2738","istituto":"CONSERVATORIO DI MUSICA DI VICENZA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2738","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"VICENZA","puoi_candidarsi_da":"14-10-2026","ultimo_giorno_candidatura":"24-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/13068/download/BANDO"],"bando_inpa":"https://www.inpa.g timo_giorno_candidatura":"13-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12991/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/3a3b77e6f1d445cc8bea5c4d9690c436","email_rup":"bandiecontratti@consbo.it","telefono_rup":"051 221483"},{"bando_id":"2720","istituto":"ACCADEMIA DI BELLE ARTI DELL'AQUILA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2720","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pittura","discipline_descrizione":"I contenuti artistici del settore disciplinare comprendono le pratiche della pittura finalizzate alla conoscenza analitica e di sintesi delle complesse strutture spaziali/compositive/espressive che la costituiscono, organizzate in processi metodologici di sperimentazione e ricerca, alla luce delle specifiche individualità creative. Nella prassi è previsto sia l’utilizzo dei procedimenti della tradizione come l’affresco, sia la ricerca contemporanea volta alla produzione artistica, anche in una prospettiva metadisciplinare, in rapporto con gli altri campi del sapere e con gli sviluppi tecnologici più recenti. L’autonomia nelle scelte didattiche può tener conto anche delle peculiarità dei contesti territoriali, al fine di sviluppare al meglio le specificità artistiche nel contemporaneo. L’acquisizione della padronanza degli strumenti operativi sarà indispensabile al raggiungimento delle capacità espressive individuali. Fondamentale valore avrà la riflessione sull’operare artistico attraverso la progettualità, la scelta delle poetiche e dei linguaggi, l’analisi e la comparazione con gli esiti formali delle diverse tendenze di pensiero e di espressione in atto","codice_sector":"AFAM079","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"AQUILA","puoi_candidarsi_da":"13-10-2026","ultimo_giorno_candidatura":"12-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12953/download/BANDO","https://afam-anagrafiche.mur.gov.it/13042/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/5793b08a4ff54d0081e7b9574c1a5476","email_rup":"protocollo@abaq.it","telefono_rup":"0862317360"},{"bando_id":"2718","istituto":"CONSERVATORIO DI MUSICA DI TORINO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2718","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Diritto delle arti, del design, dello spettacolo e dei beni culturali","discipline_descrizione":"Il settore comprende competenze e ambiti di ricerca inerenti al diritto dei beni e delle attività culturali, al diritto del lavoro e della previdenza sociale con particolare riguardo all’ambito artistico e dello spettacolo, alla proprietà intellettuale – incluso il diritto d’autore – nel contesto nazionale e internazionale in una prospettiva di comparazione, alla gestione delle imprese operanti nel mondo delle arti e dello spettacolo ed ai relativi sistemi produttivi-industriali, anche legati allo sviluppo delle nuove tecnologie e delle intelligenze artificiali, alla legislazione di cantiere e in materia di sicurezza sul lavoro, nonché all’ordinamento scolastico e dell’Alta Formazione Artistica e Musicale. Completano il settore gli studi riguardanti il rapporto tra diritto e discipline umanistiche, nelle varie declinazioni riconosciute","codice_sector":"AFAM058","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"TORINO","puoi_candidarsi_da":"12-10-2026","ultimo_giorno_candidatura":"27-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12848/download/BANDO","https://afam-anagrafiche.mur.gov.it/12849/download/BANDO","https://afam-anagrafiche.mur.gov.it/12850/download/BANDO","https://afam-anagrafiche.mur.gov.it/12851/download/BANDO","https://afam-anagrafiche.mur.gov.it/12852/download/BANDO","https://afam-anagrafiche.mur.gov.it/12853/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=bf480f5c8d2f4c4fb17481bb3adf5270","email_rup":"direzione@conservatoriotorino.eu","telefono_rup":"0118178458"},{"bando_id":"2714","istituto":"CONSERVATORIO DI MUSICA DI NOCERA TERINESE","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2714","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Antropologia e sociologia delle arti, del design e dello spettacolo","discipline_descrizione":"Il settore si articola in due ambiti: antropologico e sociologico. L’ambito antropologico ha come oggetto la riflessione sulle dinamiche simboliche e sociali delle culture, con particolare riferimento all’arte, al design, alla danza e al teatro. Analizza le società complesse e gli archetipi dell’immaginario, esplorati nelle molteplici varianti geografiche e storiche e nel prodursi di relazioni mutevoli tra le comunità umane e la natura, dal tribale al globale. Gli studi si inseriscono nei saperi delle arti e dei linguaggi contemporanei connessi con gli aspetti rituali e sociali. Sono inoltre oggetto di ricerca il folclore, le forme espressive popolari nel rapporto con altre forme della produzione letteraria e artistica e con le strutture antropologiche dell’immaginario. L’ambito sociologico contiene i presupposti teorici, storici e metodologici della ricerca sociale, dei nuovi media, dei processi culturali e della comunicazione, nonché gli strumenti utilizzati nell’analisi delle fenomeniche micro e macro-sociologiche: dai fenomeni della cultura, a quelli comunicativi, dai processi di socializzazione, all’impatto sociale delle arti, del design, della danza, del teatro, del costume, dei media e delle tecnologie avanzate","codice_sector":"AFAM109","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"NOCERA TERINESE","puoi_candidarsi_da":"12-10-2026","ultimo_giorno_candidatura":"27-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12832/download/BANDO","https://afam-anagrafiche.mur.gov.it/12833/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"ufficiopersonale@tchaikovsky.it","telefono_rup":"0968923854"},{"bando_id":"2713","istituto":"CONSERVATORIO DI MUSICA DI FROSINONE","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2713","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"FROSINONE","puoi_candidarsi_da":"12-10-2026","ultimo_giorno_candidatura":"27-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12829/download/BANDO","https://afam-anagrafiche.mur.gov.it/12830/download/BANDO","https://afam-anagrafiche.mur.gov.it/12831/download/BANDO"],"bando_inpa":"","email_rup":"direttore.amministrativo@conservatorio-frosinone.it","telefono_rup":"0775840060"},{"bando_id":"2712","istituto":"ISTITUTO SUPERIORE DI STUDI MUSICALI E COREUTICI DI TERAMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2712","sito_istituzionale":"https://www.conservatoriobraga.it/amministrazionetrasparente","discipline_nomi":"Saxofono","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM014","tipo_contratto":"Altri contratti","tipo_scuola":"Istituto","d iche.mur.gov.it/12759/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"conservatoriospezia@conssp.it","telefono_rup":"0187770333"},{"bando_id":"2704","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2704","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione della danza, progettazione e realizzazione coreografica","discipline_descrizione":"Il settore disciplinare favorisce lo sviluppo del processo creativo individuale e originale e offre le conoscenze necessarie per realizzare le proprie intenzioni espressive anche nell’ambito della ricerca nei diversi linguaggi della danza, sia storici che attuali. Stimola l’acquisizione delle forme di organizzazione e costruzione dei materiali coreografici individuali, il consolidamento del processo coreografico, le capacità di trasmettere. Il settore comprende altresì l’analisi e la progettazione degli aspetti relativi alla regia e alla drammaturgia della creazione coreografica. Forma coreografi di livello professionale in grado di realizzare opere coreografiche, per solisti e ensemble, fornisce la preparazione per elaborare progetti coreografici e per allestirli in spazi convenzionali e alternativi","codice_sector":"AFAM064","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12746/download/BANDO","https://afam-anagrafiche.mur.gov.it/12747/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=c041f9bd70b9402d8a344c81e07422ff","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2703","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2703","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecnica e repertorio della danza classica","discipline_descrizione":"Il settore comprende i due ambiti disciplinari di Tecnica e di Repertorio della danza classica; prevede la conoscenza dell’analisi dei principi tecnici e stilistici concernenti i due ambiti disciplinari, con particolare riguardo alla ricerca nel campo artistico, performativo, metodologico e didattico. Il settore include le abilità tecniche e interpretative che concorrono alla formazione del danzatore, del coreografo, del ripetitore e dell’insegnante. Relativamente alla Tecnica della danza classica le competenze acquisite consentono di progettare corsi per danzatori di diverso livello, dalla formazione di base a quella professionale. Relativamente al Repertorio della danza classica è richiesta un’esperienza artistico-professionale, con particolare riguardo ai principali ruoli del balletto classico, incluse le danze di carattere e le danze di sala a uso scenico. Le competenze acquisite consentono di analizzare il repertorio dal punto vista tecnico, stilistico, drammaturgico, inquadrandolo nel suo contesto storico","codice_sector":"AFAM061","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12744/download/BANDO","https://afam-anagrafiche.mur.gov.it/12748/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=dc5448553f87485fa3e091ca8128ed12","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2702","istituto":"CONSERVATORIO DI MUSICA DI FERMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2702","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come strumento conoscitivo della letteratura musicale e della ricerca, la pratica della lettura a prima vista, della lettura della partitura, dell’accompagnamento e dell’improvvisazione al pianoforte. Comprende inoltre l’identificazione e la realizzazione di percorsi armonici al pianoforte, le trasposizioni tonali e le metodologie di armonizzazione al pianoforte, anche con specifico riferimento all’applicazione in ambito didattico","codice_sector":"AFAM051","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"FERMO","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12712/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/891fd770b8bf40adb37f7eacb4f613ae","email_rup":"protocollo@conservatorio.net","telefono_rup":"0734225495"},{"bando_id":"2701","istituto":"CONSERVATORIO DI MUSICA DI FERMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2701","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come strumento conoscitivo della letteratura musicale e della ricerca, la pratica della lettura a prima vista, della lettura della partitura, dell’accompagnamento e dell’improvvisazione al pianoforte. Comprende inoltre l’identificazione e la realizzazione di percorsi armonici al pianoforte, le trasposizioni tonali e le metodologie di armonizzazione al pianoforte, anche con specifico riferimento all’applicazione in ambito didattico","codice_sector":"AFAM051","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"FERMO","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12714/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/31529175e5484fb0b3119ee670d36965","email_rup":"protocollo@conservatorio.net","telefono_rup":"0734225495"},{"bando_id":"2700","istituto":"CONSERVATORIO DI MUSICA DI FERMO","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2700","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Musicologia e storia della musica","discipline_descrizione":"Il settore comprende le attività didattiche e di ricerca relative alla musicologia, alla storia della musica e dei linguaggi musicali, dal mondo antico all’età contemporanea, al teatro musicale, affrontate secondo diversi approcci metodologici: storico-filologico, teorico-analitico, bibliograficobiblioteconomico, estetico, semiotico, sociologico, etnomusicologico, tecnologico e interdisciplinare. Gli ambiti di approfondimento comprendono anche l’organologia, l’iconografia e l’iconologia musicale, la semiografia, la paleografia musicale, le relazioni musica-testo poetico e la drammaturgia musicale. Gli ambiti di competenza del settore sono trattati sia distintamente, sia in relazione reciproca, sia in rapporto alle discipline artistiche, teatrali, cinematografiche, coreutiche e umanistiche, sia in prospettiva di tutela e valorizzazione del patrimonio musicale materiale e immateriale. Il settore concerne infine lo studio della didattica della storia della musica con riferimento all’applicazione in ambito formativo ed educativo","codice_sector":"AFAM040","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"FERMO","puoi_candidarsi_da":"08-10-2026","ultimo_giorno_candidatura":"07-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12710/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/ad4d51312cdf49f4918d52117861676b","email_rup":"protocollo@conservatorio.net","telefono_rup":"0734225495"},{"bando_id":"2699","istituto":"C turali e interpretative relative agli strumenti a pizzico storici, necessarie per affrontare con piena consapevolezza le prassi esecutive storicamente informate, con possibilità di estensione per ogni profilo disciplinare allo studio dei relativi strumenti affini. Per il raggiungimento di tali obiettivi si studiano in particolare le tecniche esecutive specifiche del periodo storico di ogni singolo profilo disciplinare, la prassi esecutiva del basso continuo e si approfondisce la conoscenza organologica, della letteratura, dei vari stili e dei sistemi di temperamento in uso. La pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, alla gestualità e alle tecniche di esecuzione della musica delle avanguardie storiche e contemporanea, eventualmente contemplata nei repertori dei profili disciplinari. È prevista inoltre la conoscenza delle metodologie riferite alla didattica dello strumento","codice_sector":"AFAM023","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"MUSICA D'ALESSANDRIA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"08-11-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12590/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=8d347d74cd984ebdbca19c34d8348586","email_rup":"direttore.amministrativo@conservatoriovivaldi.it","telefono_rup":"0131-051500"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Scenografia","discipline_descrizione":"I contenuti del settore fanno riferimento ai diversi ambiti di competenza della ricerca e della progettazione scenografica e scenotecnica per il teatro, il teatro di figura, il cinema, la televisione e i nuovi media. Si contemplano le connessioni con le tecniche e tecnologie della tradizione e del contemporaneo, incluse le modalità di restituzione grafica, pittorica, plastica e la rappresentazione esecutiva dello spazio scenico. I contenuti disciplinari comprendono: la progettazione per il teatro (dalla prosa al teatro musicale alle sperimentazioni drammaturgiche, musicali e coreutiche in spazi tradizionali, urbani e di nuova concezione); la progettazione dello spazio per eventi e allestimenti; la progettazione dello spazio scenico, performativo e coreutico; le tecniche di realizzazione per il teatro di figura; la scenografia del cinema comprese le tecnologie per la creazione di ambienti ed architetture virtuali per la produzione filmica, seriale, documentaristica e di sperimentazione; per la televisione di palinsesto, di divulgazione ed intrattenimento compresa la progettazione e restituzione in spazi e set tradizionali ed ambienti virtuali o di nuova concezione. Si contempla la progettazione e la ricerca con una particolare attenzione al ciclo di vita delle realizzazioni scenografiche, nell’ottica della sostenibilità e dell’economicità","codice_sector":"AFAM072","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Grafica d'arte","discipline_descrizione":"I contenuti artistici e tecnico scientifici del settore riguardano la ricerca e la sperimentazione dei linguaggi visivi e percettivi, l’analisi dei processi creativi e grafico espressivi nell’accezione metaforica, antropologica e simbolica delle molteplici forme della comunicazione e nell’interazione tra segno e messaggio. Il settore include competenze e ambiti di ricerca relativi alla lettura storica e contemporanea dei linguaggi visivi della grafica d’arte, agli aspetti che includono le tecniche e la tecnologia dei materiali, con particolare attenzione alla sostenibilità nonché lo studio del segno nella complessità tonale e semantica, fino ai processi artistico-tecnico-culturali della divulgazione e fruizione dell’immagine. La prassi laboratoriale si avvale della conoscenza metodologica di strumenti, mezzi, supporti e materiali tipici della stampa, a cominciare dalla carta e dagli inchiostri, dell’elaborazione delle matrici grafiche, dell’acquisizione della manualità delle tecniche calcografiche, xilografiche, litografiche e della stampa d’arte e della stampa manuale e digitale, dall’esemplare unico alla produzione seriale, fino alla sperimentazione delle più innovative pratiche tecnologiche e multimediali della contemporaneità, compresi gli aspetti tecnico-industriali, editoriali e di ricerca propri del processo divulgativo dell’immagine in ambito visivo","codice_sector":"AFAM076","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pittura","discipline_descrizione":"I contenuti artistici del settore disciplinare comprendono le pratiche della pittura finalizzate alla conoscenza analitica e di sintesi delle complesse strutture spaziali/compositive/espressive che la costituiscono, organizzate in processi metodologici di sperimentazione e ricerca, alla luce delle specifiche individualità creative. Nella prassi è previsto sia l’utilizzo dei procedimenti della tradizione come l’affresco, sia la ricerca contemporanea volta alla produzione artistica, anche in una prospettiva metadisciplinare, in rapporto con gli altri campi del sapere e con gli sviluppi tecnologici più recenti. L’autonomia nelle scelte didattiche può tener conto anche delle peculiarità dei contesti territoriali, al fine di sviluppare al meglio le specificità artistiche nel contemporaneo. L’acquisizione della padronanza degli strumenti operativi sarà indispensabile al raggiungimento delle capacità espressive individuali. Fondamentale valore avrà la riflessione sull’operare artistico attraverso la progettualità, la scelta delle poetiche e dei linguaggi, l’analisi e la comparazione con gli esiti formali delle diverse tendenze di pensiero e di espressione in atto","codice_sector":"AFAM079","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Metodi e strumenti per la rappresentazione del progetto","discipline_descrizione":"Il settore disciplinare si fonda sull’assunto culturale che la rappresentazione sia un’estensione del pensiero e un linguaggio universalmente riconosciuto di comunicazione. L’attività di ricerca, progettuale, artistica e didattico-formativa, sia teorica sia pratica, comprende l’insieme dei saperi, delle teorie, dei metodi e delle tecniche per la produzione di rappresentazioni bidimensionali e tridimensionali, sia analogiche sia digitali sia post-digitali, relative alle attività di ideazione alle diverse scale, dello spazio, del manufatto e dell’oggetto, sia reali sia immaginate, compresi i beni culturali","codice_sector":"AFAM083","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design del prodotto","discipline_descrizione":"Il Design del Prodotto riguarda i temi della ricerca e della progettazione di prodotti che soddisfino le esigenze funzionali, ergonomiche, formali, sociali ed etiche in sintonia con le esigenze del mercato e del benessere, nell’ottica degli obiettivi imprescindibili di una progettazione attenta e sostenibile per l’uomo, l’ambiente e le altre forme di vita che popolano il pianeta. I designer del prodotto lavorano su soluzioni innovative di processo o di prodotto che migliorino la vita quotidiana degli utenti e delle comunità, che rispondano a sfide tecnologiche, di innovazione tipologica, filosofiche e produttive contemporanee, che siano in grado di interpretare il futuro, attraverso un processo che abbracci la ricerca, la progettazione e lo sviluppo formale e per il tramite dell’uso di materiali congrui e sostenibili, anche di tipo avanzato. Il design del prodotto mira a sviluppare le idee progettuali in elaborati prevalentemente materiali, a supporto di un miglioramento della vita e del progresso sociale ed economico, tramite una solida formazione di base nell’ambito delle discipline del progetto, sia a livello interdisciplinare teorico e operativo. Il settore include inoltre la riflessione critica e la pratica responsabile del design, valutandone l’impatto sui sistemi complessi e le implicazioni morali, sociali, culturali e ambientali, promuovendo valori come integrità, giustizia, rispetto, sostenibilità e responsabilità, superando bias impliciti e pregiudizi per favorire pratiche inclusive. L’etica del design incoraggia comportamenti trasparenti e rispettosi, adattandosi alle sfide digitali e globali, mantenendo il benessere umano e l’equilibrio ambientale come priorità","codice_sector":"AFAM087","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecniche e tecnologie del prodotto moda","discipline_descrizione":"Il settore riguarda lo studio dei fondamentali processi di trasformazione delle materie prime per i prodotti moda: tessuti, filati, pellami, prodotti per l’abbigliamento, applicando l’approccio formale delle tecniche del cartamodello o l’approccio creativo del drappeggio sul manichino, le tecniche di costruzione, compreso il fitting, e la realizzazione dei prototipi attraverso soluzioni progettuali e produttive che tengano in considerazione taglie, consumi e costi. Il settore include l’analisi dello sviluppo tecnico operativo e l’apporto delle nuove tecnologie nel processo produttivo industriale nei vari campi del settore moda e dell’accessorio: dalla conoscenza di costumi e linguaggi contemporanei, alla sperimentazione di nuove tipologie e recupero di materiali, fino alla conoscenza di tecnologie di produzione nuove e tradizionali. I percorsi didattici puntano ad un equilibrio tra la ricerca e le conoscenze teoriche e applicazioni tecnico-professionali, nonché all’acquisizione di esperienza nel rapporto con il mondo della produzione","codice_sector":"AFAM093","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Sistemi interattivi","discipline_descrizione":"Il settore si interessa all’attività scientifica, artistica e didattico-formativa, sia teorica che pratica, nel campo dei sistemi interattivi e dell’interazione uomo-macchina applicata alla creazione artistica contemporanea e più in generale delle industrie creative e culturali. La ricerca, la produzione e la didattica per l’alta formazione di questo settore si articolano in conoscenze e competenze nella teoria e nelle tecniche per la progettazione, lo sviluppo e la realizzazione di ambienti interattivi, multimediali e immersivi, che prevedono un rapporto attivo tra spettatore e spazio, di ambienti di realtà virtuale, aumentata e mista, di prodotti audiovisivi caratterizzati da funzionalità di interazione per lo spettatore, e di procedure e strumenti finalizzati al design della interazione di un utente con un dispositivo, un’interfaccia, un’opera artisitca, e più in generale con un ambiente digitale interattivo Questo settore si articola in quattro profili principali","codice_sector":"AFAM097","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Linguaggi e tecniche dell'audiovisivo","discipline_descrizione":"II settore disciplinare riguarda il pluralismo dei linguaggi e delle innovazioni nelle tecniche che caratterizzano la contemporaneità, tanto nell’ambito dei linguaggi audiovisivi legati alle tecniche della tradizione, quanto nell’elaborazione e nella sperimentazione di nuovi linguaggi espressivi. Il settore comprende sia la formazione tecnico-operativa relativa ai settori di ricerca negli ambiti propri delle arti, della cinematografia, dell’audiovisivo, del documentario, sia gli strumenti metodologici e critici per l’acquisizione di competenze correlate ai linguaggi espressivi delle arti mediali. Il settore affronta altresì l’estetica e la semiotica dell’immagine in movimento, le tecniche di produzione della ripresa e del montaggio degli audiovisivi","codice_sector":"AFAM099","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Estetica","discipline_descrizione":"Il settore delinea l’ambito disciplinare costituito dall’insieme di competenze costitutive dell’Estetica, intesa quale riflessione teorico-filosofica radicata nelle pratiche delle arti. In questo senso, l’indagine teorico-filosofica dell’estetica riguarda sia il momento della fruizione dell’arte, che quello della produzione, considerata nelle sue varie articolazioni, nei contesti più significativi e nei più disparati materiali e tecniche, dalle tecniche tradizionali alle tecnologie più avanzate. Le ricerche nel settore sono condotte nella prospettiva fondativa del sapere che trova nelle arti il campo di indagine e di espressione privilegiata","codice_sector":"AFAM106","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Arte del fumetto","discipline_descrizione":"I contenuti artistici disciplinari dell’illustrazione e del fumetto riguardano gli ambiti propri della comunicazione visiva attraverso i diversi linguaggi della narrazione per immagini. Il settore comprende teorie, tecniche, strumenti, competenze e ambiti di ricerca circa i metodi e i processi operativi impiegati per la progettazione e la realizzazione delle strutture narrative e discorsive proprie del fumetto e dell’illustrazione. I contenuti scientifici concernono lo statuto teorico e storico-critico dei prodotti – materiali e virtuali – e le forme proprie del pensiero progettuale come prassi interdisciplinare, e momento di sintesi dei molteplici saperi, nonché l’insieme dei linguaggi visivi, delle prassi artistiche e dei significati estetici e culturali che interagiscono con l’illustrazione e il fumetto. L’attività laboratoriale ha finalità tecnico-espressive che si realizzano attraverso le interconnesioni con altri linguaggi e le relazioni con le diverse tecniche grafiche, da quelle più tradizionali alle nuove tecnologie digitali, approfondendo tutte le fasi in cui si articola la creazione di un libro illustrato e di un volume a fumetti: dall’ideazione al soggetto, dallo storytellig alla sceneggiatura, dal character design alla definizione del layout e dello storyboard, dall’articolazione fra testo e immagine alla realizzazione e pubblicazione cartacea, digitale e per il web","codice_sector":"AFAM118","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Restauro e tecniche dei materiali lapidei e derivati; superfici decorate dell'architettura","discipline_descrizione":"I contenuti scientifico-disciplinari del settore artistico disciplinare in questione comprendono i fondamenti teorico critici e pratici relativi all’attività di conservazione e restauro materiali lapidei e derivati; superfici decorate dell’architettura. I suddetti contenuti abbracciano la ricerca necessaria alla comprensione delle tecniche e dei materiali costitutivi, dei fenomeni di degrado e delle loro cause; la disamina delle differenti metodologie e tecniche di intervento al fine di predisporre un progetto e l’esecuzione dell’intervento di restauro. Comprendono altresì le conoscenze relative ad interventi di manutenzione che contemplano sia la conservazione preventiva dei manufatti in questione sia i restauri indiretti, ovvero relativi al contesto ambientale dell’opera. Il settore prevede un approccio che, partendo dalle problematiche relative alle differenti tecniche storiche di produzione, individui e risolva sul piano pratico-operativo gli snodi critici connessi alle varie condizioni in cui viene ad essere effettuato l’intervento di restauro. Il settore si articola in due aree: restauro e tecniche dei materiali lapidei, musivi e derivati (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di materiali lapidei, musivi e derivati – opere lapidee, lapidee artificiali, mosaici, rivestimenti lapide, etc. – compresi i prodotti e le opere dell’arte contemporanea e di design in cui l’impiego di questi materiali e tecniche è prevalente); e restauro e tecniche delle superfici decorate dell’architettura (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro delle superfici decorate dell’architettura – dipinti murali, opere in stucco e/o gesso, dipinte e non, etc. – di vario genere comprese le opere e i prodotti dell’arte contemporanea e di design in cui l’impiego di questi materiali e tecniche è prevalente)","codice_sector":"AFAM122","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Restauro dei manufatti dipinti su supporto ligneo e tessile. Manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee. Manufatti in materiali sintetici lavorati, assemblati e/o dipinti.","discipline_descrizione":"I contenuti scientifico-disciplinari del settore artistico disciplinare in questione comprendono i fondamenti teorico critici e pratici relativi all’attività di conservazione e restauro dei manufatti dipinti su supporto ligneo e tessile. Manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee. Manufatti in materiali sintetici lavorati, assemblati e/o dipinti. I suddetti contenuti abbracciano la ricerca necessaria alla comprensione delle tecniche e dei materiali costitutivi, dei fenomeni di degrado e delle loro cause; la disamina delle differenti metodologie e tecniche di intervento al fine di predisporre un progetto e l’esecuzione dell’intervento di restauro. Comprendono altresì le conoscenze relative ad interventi di manutenzione che contemplano sia la conservazione preventiva dei manufatti in questione sia i restauri indiretti, ovvero relativi al contesto ambientale dell’opera. Il settore prevede un approccio che, partendo dalle problematiche relative alle differenti tecniche storiche di produzione, individui e risolva sul piano praticooperativo gli snodi critici connessi alle varie condizioni in cui viene ad essere effettuato l’intervento di restauro. Il settore si articola in tre aree: restauro e tecniche dei manufatti dipinti su supporto ligneo e tessile (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di materiali e manufatti dipinti su supporto ligneo e tessile, compresi i prodotti e le opere dell’arte contemporanea e di design in cui l’impiego di questi materiali è prevalente); restauro e tecniche dei manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di manufatti scolpiti in legno e/o polimaterici, naturali o policromi, arredi e strutture lignee comprese le opere e i prodotti dell’arte contemporanea e di design in cui l’impiego di questi materiali è prevalente); e, infine, restauro e tecniche dei manufatti e materiali sintetici lavorati, assemblati e/o dipinti (comprende i fondamenti teorico critici e operativi richiesti dall’attività di conservazione e restauro di Manufatti in materiali sintetici lavorati, assemblati e/o dipinti , nell’accezione più ampia comprese le opere e i prodotti dell’arte contemporanea e di design in cui l’impiego di questi materiali è prevalente)","codice_sector":"AFAM123","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2691","istituto":"ACCADEMIA DI BELLE ARTI DI BOLOGNA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2691","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi- ico, antico, medioevale, moderno, contemporaneo e demo-etno-antropologico).","codice_sector":"AFAM127","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"BOLOGNA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12588/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0d07ce6e7c49434bafd6e2537d2b3958","email_rup":"marco.bronzi@ababo.it","telefono_rup":"0514226411"},{"bando_id":"2690","istituto":"CONSERVATORIO DI MUSICA DI VIBO VALENTIA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2690","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"VIBO VALENTIA","puoi_candidarsi_da":"07-10-2026","ultimo_giorno_candidatura":"22-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/12575/download/BANDO","https://afam-anagrafiche.mur.gov.it/12576/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/4e944586ce344995886929fc8ef823ba","email_rup":"g.ginese@consvv.it","telefono_rup":"0963-375235"},{"bando_id":"2689","istituto":"CONSERVATORIO DI MUSICA DI PARMA","bando_url":"https://afam-anagrafiche.mur.gov.it/visualizza-bando/2689","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Clarinetto","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attivi
