<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osservatorio-afam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sfondo: #FCFDFD;
  --accento: #0066CC;
  --accento-2: #FF0000;
  --contrasto: #000000;
  --neutro-1: #E8E8E8;
  --neutro-2: #525252;
  --font-size: 20px;
  --font-size-mobile: 14px;
  --testo: lowercase;
  --weight-1: 420;
  --weight-2: 570;
  --weight-3: 720;
  --raggio-bottoni: 10px;
  --raggio-card: 30px;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  text-transform: var(--testo);
  background: var(--sfondo);
  color: var(--accento);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  font-size: var(--font-size);
  background: var(--sfondo);
  text-transform: var(--testo);
  padding: 10px 10px;
  border-bottom: 2px solid var(--neutro-1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header-testo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.br-mobile {
  display: none;
}

header h1 {
  font-size: var(--font-size);
  font-weight: var(--weight-3);
  text-transform: var(--testo);
  letter-spacing: 0;
  white-space: nowrap;
}

.header-sottotitolo {
  font-weight: var(--weight-1);
  color: var(--accento);
  margin-top: 0;
  margin-left: auto;
  letter-spacing: 0;
  white-space: nowrap;
}

.header-conteggio {
  display: none;
}

main {
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);

  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

#filtri {
  width: 33.333%;
  min-width: 33.333%;
  overflow-y: auto;
  padding: 20px;
  border-right: 2px solid var(--neutro-1);
  background: var(--sfondo);
}

#offerte {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.filtro-categoria {
  margin-bottom: 14px;
}

.filtro-titolo {
  color: var(--accento);
  letter-spacing: 0;
  margin-bottom: 10px;
}

.filtro-bottoni {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filtro-bottone {
  font-size: var(--font-size);
  font-weight: var(--weight-1);
  background: var(--neutro-1);
  color: var(--neutro-2);
  text-transform: var(--testo);
  border: 1px solid transparent;
  border-radius: var(--raggio-bottoni);
  padding: 1px 7px;
  font-family: 'Titillium Web', sans-serif;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filtro-bottone.attivo {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-bottone.attivo.azzerato {
  background: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown {
  position: relative;
}

.filtro-dropdown-trigger {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 0;
  transition: all 0.15s ease;
}

.filtro-dropdown-trigger.ha-filtri,
.filtro-dropdown-trigger.aperto {
  background: var(--accento);
  color: var(--sfondo);
}

.filtro-dropdown-trigger.ha-azzerati {
  background: var(--accento-2);
  border-color: var(--accento-2);
  color: var(--sfondo);
}

.filtro-dropdown-toggle {
  line-height: 1;
}

.filtro-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sfondo);
  border: 0px solid var(--neutro-2);
  z-index: 200;
  padding: 6px;
}

.filtro-dropdown-menu.aperto {
  display: block;
  position: static;
  margin-top: 6px;
  width: 100%;
}

.filtro-dropdown-menu::-webkit-scrollbar {
  width: 6px;
}

.filtro-dropdown-menu::-webkit-scrollbar-thumb {
  background: var(--neutro-2);
}

.filtro-dropdown-menu .filtro-codice-toggle {
  margin-top: 6px;
  margin-bottom: 6px;
}

.filtro-reset {
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  border-radius: var(--raggio-bottoni);
  padding: 8px 10px;
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
  margin-top: 7px;
  transition: all 0.15s ease;
}

@media (hover: hover) and (pointer: fine) {
  .filtro-bottone:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-dropdown-trigger:hover {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtro-reset:hover {
    background: var(--accento);
    color: var(--sfondo);
  }
}

.lista-offerte {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media (min-width: 900px) {
  .lista-offerte {
    grid-template-columns: 1fr 1fr;
  }
}

.card {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 20px;
  position: relative;
  transition: border-color 0.15s ease;
  min-width: 0;
  overflow-wrap: break-word;
}

.card:hover {
  border-color: var(--accento);
}

.card-disciplina {
  font-weight: var(--weight-3);
  color:  var(--accento);
  line-height: 1.1;
  margin-bottom: 3px;
}

.card-info-icon {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--accento);
  cursor: pointer;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  height: 1em;
}

.card .tooltip {
  display: none;
  position: absolute;
  top: 34px;
  right: 20px;
  width: calc(100% - 40px);
  background: var(--neutro-1);
  color: var(--contrasto);
  border: 1px solid var(--contrasto);
  padding: 12px;
  font-weight: var(--weight-1);
  line-height: 1.15;
  z-index: 1000;
  white-space: normal;
}

.card:has(.card-info-icon:hover) .tooltip,
.card:has(.tooltip:hover) .tooltip {
  display: block;
    color: var(--neutro-2);
}

.card-campo {
  font-weight: var(--weight-2);
  margin-bottom: 3px;
  line-height: 1.4;
}

.card-valore-puro {
  color: var(--contrasto);
}

.card-etichetta {
  color: var(--neutro-2);
  font-weight: 400;

}

.card-valore {
  color: var(--contrasto);
}

.card-id,
.card-id:visited {
  color: var(--accento);
  text-decoration: none;
}

.card-id:hover {
  color: var(--accento);
  text-decoration: none;
}

.card.offerta-scaduta,
.card.offerta-scaduta .card-disciplina,
.card.offerta-scaduta .card-valore-puro,
.card.offerta-scaduta .card-valore,
.card.offerta-scaduta .card-etichetta,
.card.offerta-scaduta .card-id,
.card.offerta-scaduta .card-id:visited {
  color: var(--neutro-1);
}

.card.offerta-scaduta .card-info-icon {
  color: var(--neutro-1);
}

.card.offerta-scaduta:hover {
  border-color: var(--neutro-1);
}

#filtri::-webkit-scrollbar,
#offerte::-webkit-scrollbar {
  width: 6px;
}

#filtri::-webkit-scrollbar-track,
#offerte::-webkit-scrollbar-track {
  background: transparent;
}

#filtri::-webkit-scrollbar-thumb,
#offerte::-webkit-scrollbar-thumb {
  background: var(--neutro-1);
}

@media (max-width: 768px) {
  :root {
    --font-size: var(--font-size-mobile);
  }

  body {
    height: auto;
    overflow: visible;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 300;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 16px;
    row-gap: 0;
    align-items: start;
  }

  .header-testo {
    display: contents;
  }

  header h1 {
    grid-column: 1;
    grid-row: 1 / 3;
    white-space: normal;
    align-self: start;
    line-height: 1;
  }

  .header-sottotitolo {
    grid-column: 2;
    grid-row: 1 / 3;
    justify-self: end;
    align-self: start;
    margin-left: 0;
    white-space: normal;
    text-align: right;
    line-height: 1;
  }

  .br-mobile {
    display: block;
  }

  .hyphen {
    display: none;
  }

  main {
    flex-direction: column;
    height: auto;
    overflow: visible;
  }

  #filtri {
    width: 100%;
    min-width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--neutro-1);
    overflow-x: auto;
    display: none;
  }

  #filtri.aperto {
    display: block;
  }

  .card .tooltip,
  .card-info-icon {
    display: none;
  }

  .filtro-bottoni {
    flex-wrap: nowrap;
  }

  .filtro-dropdown-menu .filtro-bottoni {
    flex-wrap: wrap;
  }

  .filtro-dropdown-menu .filtro-bottone {
    flex: 0 1 auto;
  }

  .filtro-bottone-luogo {
    white-space: nowrap;
  }

  .filtro-bottone-disciplina {
    white-space: normal;
    overflow-wrap: break-word;
  }

  .filtro-bottone {
    line-height: 1;
  }

  .filtro-dropdown-trigger {
    line-height: 1;
  }

  .filtro-reset {
    line-height: 1;
  }

  .filtri-toggle {
    background: transparent;
    color: var(--accento);
    border: 2px solid var(--accento);
    border-radius: var(--raggio-bottoni);
    padding: 6px 10px;
    font-family: 'Titillium Web', sans-serif;
    font-size: var(--font-size);
    font-weight: var(--weight-2);
    text-transform: var(--testo);
    line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filtri-toggle.ha-filtri {
    background: var(--accento);
    color: var(--sfondo);
  }

  .filtri-toggle.ha-azzerati {
    background: var(--accento-2);
    border-color: var(--accento-2);
    color: var(--sfondo);
  }

  .filtro-dropdown-menu .filtro-codice-toggle {
    display: none;
  }

  .header-conteggio {
    display: block;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: calc(var(--font-size) * 1.5);
    font-weight: var(--weight-3);
    line-height: 1;
    color: var(--contrasto);
  }

  .offerte-bar .offerte-conteggio {
    display: none;
  }

  #offerte {
    overflow: visible;
  }

  .card {
    padding: 14px;
  }
}

#donazione-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
}

#donazione-overlay.aperto {
  display: flex;
}

.donazione-modal {
  background: var(--sfondo);
  border: 2px solid var(--neutro-1);
  border-radius: var(--raggio-card);
  padding: 24px;
  max-width: 560px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
}

.donazione-contenuto {
  display: flex;
  gap: 20px;
  align-items: center;
}

.donazione-qr {
  flex: 0 0 auto;
  width: 150px;
  height: 150px;
}

.donazione-qr img {
  width: 100%;
  height: 100%;
  display: block;
  border: 2px solid var(--neutro-1);
  border-radius: 8px;
}

.donazione-testo {
  flex: 1;
  min-width: 0;
}

.donazione-testo h2 {
  color: var(--accento);
  font-weight: var(--weight-3);
  margin-bottom: 8px;
}

.donazione-testo p {
  color: var(--neutro-2);
  font-weight: var(--weight-1);
  margin-bottom: 16px;
  line-height: 1.3;
}

.donazione-bottone-paypal {
  display: block;
  text-align: center;
  background: var(--accento);
  color: var(--sfondo);
  padding: 10px;
  border-radius: var(--raggio-bottoni);
  text-decoration: none;
  font-weight: var(--weight-2);
  margin-bottom: 10px;
}

.donazione-bottone-continua {
  display: block;
  width: 100%;
  background: transparent;
  color: var(--accento);
  border: 2px solid var(--accento);
  padding: 8px;
  border-radius: var(--raggio-bottoni);
  font-family: 'Titillium Web', sans-serif;
  font-size: var(--font-size);
  font-weight: var(--weight-2);
  text-transform: var(--testo);
  cursor: pointer;
}

@media (max-width: 768px) {
  .donazione-contenuto {
    flex-direction: column;
  }
  .donazione-qr {
    width: 140px;
    height: 140px;
  }
}
  </style>
</head>

tuto":"CONSERVATORIO DI MUSICA DI PALERMO","sito_istituzionale":"https://conservatoriopalermo.it/","discipline_nomi":"Orchestra","discipline_descrizione":"Il settore concerne la formazione orchestrale, nella quale l’attenzione riguarda la ricerca, l’esercizio della pratica e dell’interpretazione orchestrale, vista come elemento fondamentale della formazione musicale dello strumentista. Si affrontano i repertori delle varie epoche fino ai nostri giorni, fornendo competenze legate alle metodologie di lettura estemporanea e alle tecniche di intonazione. Il settore concerne altresì l’interpretazione, lo studio delle tecniche e delle prassi della concertazione e della direzione d’orchestra, dal piccolo ensemble alla grande formazione comprendente anche compagini vocali e corali, fino al teatro musicale. La formazione del direttore d’orchestra comporta l’approfondimento della teoria e dell’analisi della musica nonché la conoscenza degli strumenti musicali, dei linguaggi, degli stili e della storia","codice_sector":"AFAM049","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"PALERMO","puoi_candidarsi_da":"01-10-2026","ultimo_giorno_candidatura":"16-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11936/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"protocollo@conservatoriopalermo.it","telefono_rup":"091580921"},{"bando_id":"2605","istituto":"CONSERVATORIO DI MUSICA DI VENEZIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pratica pianistica e della lettura vocale e pianistica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’uso del pianoforte come strumento conoscitivo della letteratura musicale e della ricerca, la pratica della lettura a prima vista, della lettura della partitura, dell’accompagnamento e dell’improvvisazione al pianoforte. Comprende inoltre l’identificazione e la realizzazione di percorsi armonici al pianoforte, le trasposizioni tonali e le metodologie di armonizzazione al pianoforte, anche con specifico riferimento all’applicazione in ambito didattico","codice_sector":"AFAM051","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"VENEZIA","puoi_candidarsi_da":"01-10-2026","ultimo_giorno_candidatura":"16-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11920/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it","email_rup":"conservatorio.venezia@conservatoriovenezia.eu","telefono_rup":"0415236561"},{"bando_id":"2598","istituto":"CONSERVATORIO DI MUSICA DI SIENA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pianoforte","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM018","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"SIENA","puoi_candidarsi_da":"30-09-2026","ultimo_giorno_candidatura":"30-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11895/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/b891c859b6d34b3dbd0e4eaa186afc55","email_rup":"direttoreamministrativo@conservatoriosiena.it","telefono_rup":"0577288904"},{"bando_id":"2592","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecnica e repertorio della danza classica","discipline_descrizione":"Il settore comprende i due ambiti disciplinari di Tecnica e di Repertorio della danza classica; prevede la conoscenza dell’analisi dei principi tecnici e stilistici concernenti i due ambiti disciplinari, con particolare riguardo alla ricerca nel campo artistico, performativo, metodologico e didattico. Il settore include le abilità tecniche e interpretative che concorrono alla formazione del danzatore, del coreografo, del ripetitore e dell’insegnante. Relativamente alla Tecnica della danza classica le competenze acquisite consentono di progettare corsi per danzatori di diverso livello, dalla formazione di base a quella professionale. Relativamente al Repertorio della danza classica è richiesta un’esperienza artistico-professionale, con particolare riguardo ai principali ruoli del balletto classico, incluse le danze di carattere e le danze di sala a uso scenico. Le competenze acquisite consentono di analizzare il repertorio dal punto vista tecnico, stilistico, drammaturgico, inquadrandolo nel suo contesto storico","codice_sector":"AFAM061","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"30-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11886/download/BANDO","https://afam-anagrafiche.mur.gov.it/11884/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=673973485e9746cf841fa8722a27453c","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2591","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione della danza, progettazione e realizzazione coreografica","discipline_descrizione":"Il settore disciplinare favorisce lo sviluppo del processo creativo individuale e originale e offre le conoscenze necessarie per realizzare le proprie intenzioni espressive anche nell’ambito della ricerca nei diversi linguaggi della danza, sia storici che attuali. Stimola l’acquisizione delle forme di organizzazione e costruzione dei materiali coreografici individuali, il consolidamento del processo coreografico, le capacità di trasmettere. Il settore comprende altresì l’analisi e la progettazione degli aspetti relativi alla regia e alla drammaturgia della creazione coreografica. Forma coreografi di livello professionale in grado di realizzare opere coreografiche, per solisti e ensemble, fornisce la preparazione per elaborare progetti coreografici e per allestirli in spazi convenzionali e alternativi","codice_sector":"AFAM064","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"30-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11883/download/BANDO","https://afam-anagrafiche.mur.gov.it/11885/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=d5a0e5f6de3b436b9da1e8e8afd6788a","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2590","istituto":"CONSERVATORIO DI MUSICA DI CUNEO","sito_istituzionale":"https://www.conservatoriocuneo.it/","discipline_nomi":"Contrabbasso","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relat ompetenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM006","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"LECCE","puoi_candidarsi_da":"30-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11846/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=205a176c66934e98bf0ccef874624f39","email_rup":"cmlecce@conservatoriolecce.it","telefono_rup":"0832344267"},{"bando_id":"2586","istituto":"ACCADEMIA DI BELLE ARTI DI VERONA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"VERONA","puoi_candidarsi_da":"30-09-2026","ultimo_giorno_candidatura":"29-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11845/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/2e3d4b9fc0164cdab70ad85986b36be3","email_rup":"pec@pec.accademiabelleartiverona.it","telefono_rup":"0458000082"},{"bando_id":"2585","istituto":"CONSERVATORIO DI MUSICA DI GENOVA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecnologie del suono e della multimedialità","discipline_descrizione":"Il settore delle Tecnologie del suono e della multimedialità comprende diversi ambiti di ricerca e applicazione delle tecnologie nella produzione musicale, nei multimedia e in tutte le forme d’arte che coinvolgano il suono. Tali ambiti riguardano le tecnologie elettroacustiche e informatiche rivolte all’attività degli studi di registrazione e produzione sonora e musicale; le tecnologie per l’audio e la multimedialità utilizzate nelle produzioni per la radio, la televisione, la diffusione di contenuti multimediali sul web, e simili; le tecnologie per l’audio e la multimedialità impiegate nello spettacolo dal vivo (sia per quanto riguarda gli aspetti sonori che multimediali, anche in termini di realizzazione di sistemi interattivi per la scena); le tecnologie per l’audio e la multimedialità rivolte alle forme artistiche performative o installative, nonché alla comunicazione in genere","codice_sector":"AFAM047","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"GENOVA","puoi_candidarsi_da":"01-10-2026","ultimo_giorno_candidatura":"31-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11842/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/","email_rup":"protocollo@conspaganini.it","telefono_rup":"0103620747"},{"bando_id":"2584","istituto":"CONSERVATORIO DI MUSICA DI CUNEO","sito_istituzionale":"https://www.conservatoriocuneo.it/","discipline_nomi":"Pedagogia musicale e psicologia della musica","discipline_descrizione":"Il settore concerne lo studio e la ricerca sia delle metodologie e della didattica dell’insegnamento musicale, sia degli aspetti psicologici e pedagogici che sottendono ai processi di insegnamento/apprendimento della musica e dello strumento, dalla prima infanzia fino all’età adulta, in contesti scolastici ed extrascolastici. È previsto l’approfondimento delle tematiche relative alle disabilità e ai bisogni educativi speciali","codice_sector":"AFAM053","tipo_contratto":"Tempo determinato","tipo_scuola":"Conservatorio","dove":"CUNEO","puoi_candidarsi_da":"30-09-2026","ultimo_giorno_candidatura":"16-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11838/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"protocollo@conservatoriocuneo.it","telefono_rup":"0171693148"},{"bando_id":"2583","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Scienze e tecniche della comunicazione","discipline_descrizione":"Il settore attraverso strumenti teorici che attingono alle scienze del linguaggio, alla semiotica (dell’immagine, del design e delle arti performative), alle teorie della comunicazione, indaga la complessità dei prodotti di comunicazione che popolano la cultura materiale e immateriale. L’ambito disciplinare privilegia competenze che permettono un’indagine critica delle strategie di comunicazione del prodotto, nonché permette l’acquisizione di capacità relative all’analisi e alla produzione di testi visivi e verbali, con riferimento alla specificità dei media utilizzati. Il settore comprende anche gli studi che hanno per oggetto le produzione dell’arte, come articolazioni di segni, e i fenomeni comunicativi connessi alla produzione artistica. Gli studi e la ricerca riguardano il design, la cultura visuale, i settori della comunicazione mediale, editoriale, istituzionale e d’impresa, come anche la valorizzazione del patrimonio culturale, con attenzione alle forme di comunicazione creativa adottate dallo spettacolo, dalla pubblicità e dal marketing culturale","codice_sector":"AFAM101","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11805/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2583","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pedagogia e didattica dell'arte e del design","discipline_descrizione":"Il settore comprende tre ambiti principali di ricerca, considerati in una prospettiva di reciprocità e interconnessione: 1:) teoretico e speculativo; 2:) applicativo e procedurale; 3:) sperimentale ed esperienziale. Studia gli aspetti storici e metodologici della pedagogia e delle teorie dell’educazione come percorso storico, socioculturale, politico e concettuale dell’educazione in Occidente nel legame società-educazione all’arte, con particolare riferimento alle problematiche contemporanee, nelle loro componenti sia di ordine filosofico che empirico, delineate in senso generale e specificatamente in relazione all’arte e ai diversi linguaggi artistici, compresi quelli audiovisivi. Il settore include anche gli studi e le ricerche sulla mediazione culturale e artistica, la filosofia dell’educazione, la letteratura per l’infanzia e le pratiche di animazione ludico-creative. In particolare, la didattica è riconsiderata alla luce delle innovazioni linguistiche delle arti contemporanee e delle nuove metodologie che ne derivano. Così contraddistinte, la sperimentazione e progettazione dei percorsi didattici, compreso il centrale ambito della didattica museale, sono indirizzate non solo alla formazione in luoghi istituzionali e scolastici ma in tutti gli altri possibili contesti educativi, anche informali, come strategia culturale e sociale, strumento trasferibile per l’avvicinamento al sapere e l’apprendimento in profondità e per favorire l’acquisizione delle competenze trasversali. I diversi linguaggi artistici sono dunque considerati chiavi interpretative di lettura per un’educazione al patrimonio materiale e immateriale e per la sua valorizzazione e tramite la mediazione culturale, dando forte attenzione alla pratica laboratoriale anche attraverso percorsi e strumenti multimediali. Vengono infine comprese sperimentazioni, mutuate dalle pratiche teatrali e dedicate alla corporeità nella relazione educativa, alle tecniche di narrazione e comunicazione, all’utilizzo consapevole del linguaggio verbale e non verbale","codice_sector":"AFAM107","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11805/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2583","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11805/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2583","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Teoria, storia e metodo dei mass media","discipline_descrizione":"Teoria, storia e metodo dei mass media è un settore che si concentra sulle forme, le strategie e le tecnologie che caratterizzano le comunicazioni di massa, con un’attenzione specifica al loro impatto socio-culturale. Il settore definisce la fenomenologia dei media nel loro rapporto con i linguaggi artistici e i loro mutamenti sia nel contesto comunicativo sia in quello espressivo. Sono ambiti di ricerca della disciplina la teoria dei media e l’analisi delle strutture linguistiche e comunicazionali connesse all’evoluzione dei mass media. All’interno della storia sociale le comunicazioni di massa hanno svolto un importante ruolo di mediazione, veicolando contenuti simbolici e contribuendo ai processi di costruzione dell’identità culturale e sociale. Nell’attuale società digitale e iperconnessa, i media svolgono un ruolo centrale in tutte le interazioni sociali e pervadono la gran parte delle attività culturali: dalla comunicazione all’educazione, dall’intrattenimento alle pratiche artistiche. Pertanto, vista l’ampiezza degli ambiti di interesse, la metodologia adottata è interdisciplinare e fa dialogare lo studio dei linguaggi multimediali, audiovisivi e digital con l’analisi sociologica dei processi comunicativi, la storia culturale e la cultura visuale","codice_sector":"AFAM119","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11805/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2581","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Organo","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM017","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11804/download/BANDO","https://afam-anagrafiche.mur.gov.it/11937/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2581","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Disegno e illustrazione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11804/download/BANDO","https://afam-anagrafiche.mur.gov.it/11937/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2581","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11804/download/BANDO","https://afam-anagrafiche.mur.gov.it/11937/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2581","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design degli ambienti","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano i principi teorici, le metodologie e gli strumenti operativi nell’ambito della progettazione dell’architettura di interni, dell’allestimento espositivo della progettazione di esposizioni temporanee e museali, dell’arredo urbano, deldesign degli oggetti per l’arredamento di spazi pubblici e privati. I diversi indirizzi progettuali sono intesi quali ambiti di ricerca e di sperimentazione per lo sviluppo di progetti innovativi in relazione agli aspetti e alle problematiche sociali, culturali e ambientali, alle ragioni produttive e di mercato. Il settore considera i principi tecnici e i processi tecnologici, fornisce le conoscenze per la valutazione dei bisogni funzionali ed ergonomici considerando i diversi aspetti fisici, percettivi, cognitivi. I contenuti disciplinari permettono inoltre di comprendere ed elaborare le tendenze estetico-formali e di considerare l’evoluzione storica dei comportamenti e dei linguaggi riferibili alla cultura dell’abitare. Le discipline del settore curano in modo particolare la ricerca di soluzioni innovative sia per quanto riguarda l’ideazione, sia per quanto attiene all’articolazione dei percorsi espositivi e agli strumenti comunicativi","codice_sector":"AFAM088","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11804/download/BANDO","https://afam-anagrafiche.mur.gov.it/11937/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2581","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Progettazione grafica","discipline_descrizione":"Il settore disciplinare comprende contenuti progettuali-teorici, metodi, saperi e ambiti di ricerca della progettazione grafica. Il progetto grafico (graphic design) è un’attività che unisce componenti tecniche e culturali volte al raggiungimento di finalità di comunicazione eterogenee. Le competenze interdisciplinari che confluiscono nell’attività di progettazione grafica sono declinate nella molteplicità degli ambiti applicativi e di ricerca del progetto grafico, operando in maniera trasversale rispetto agli stessi. Ambiti principali di applicazione sono la grafica di pubblica utilità, l’editoria, la pubblicità e gli strumenti analogici, digitali e interattivi per i settori pubblici e privati. Il settore include, inoltre, discipline quali progettazione grafica, layout e tecniche di visualizzazione, progettazione editoriale, progettazione tipografica, disegno di caratteri, progettazione grafica dell’immagine spaziando dall’identità visiva, all’editoria, al packaging e alla progettazione di interfacce, nonché allo sviluppo di sistemi di segnaletica e mappature di orientamento. Determina ambiti di insegnamento e ricerca specifici tra attività tecnica e intellettuale finalizzata alla progettazione di artefatti comunicativi culturali anche attraverso l’uso sperimentale di strumenti e metodi innovativi","codice_sector":"AFAM110","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11804/download/BANDO","https://afam-anagrafiche.mur.gov.it/11937/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2581","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11804/download/BANDO","https://afam-anagrafiche.mur.gov.it/11937/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2580","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Disegno e illustrazione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2580","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2580","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design degli ambienti","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano i principi teorici, le metodologie e gli strumenti operativi nell’ambito della progettazione dell’architettura di interni, dell’allestimento espositivo della progettazione di esposizioni temporanee e museali, dell’arredo urbano, deldesign degli oggetti per l’arredamento di spazi pubblici e privati. I diversi indirizzi progettuali sono intesi quali ambiti di ricerca e di sperimentazione per lo sviluppo di progetti innovativi in relazione agli aspetti e alle problematiche sociali, culturali e ambientali, alle ragioni produttive e di mercato. Il settore considera i principi tecnici e i processi tecnologici, fornisce le conoscenze per la valutazione dei bisogni funzionali ed ergonomici considerando i diversi aspetti fisici, percettivi, cognitivi. I contenuti disciplinari permettono inoltre di comprendere ed elaborare le tendenze estetico-formali e di considerare l’evo , saperi e ambiti di ricerca della progettazione grafica. Il progetto grafico (graphic design) è un’attività che unisce componenti tecniche e culturali volte al raggiungimento di finalità di comunicazione eterogenee. Le competenze interdisciplinari che confluiscono nell’attività di progettazione grafica sono declinate nella molteplicità degli ambiti applicativi e di ricerca del progetto grafico, operando in maniera trasversale rispetto agli stessi. Ambiti principali di applicazione sono la grafica di pubblica utilità, l’editoria, la pubblicità e gli strumenti analogici, digitali e interattivi per i settori pubblici e privati. Il settore include, inoltre, discipline quali progettazione grafica, layout e tecniche di visualizzazione, progettazione editoriale, progettazione tipografica, disegno di caratteri, progettazione grafica dell’immagine spaziando dall’identità visiva, all’editoria, al packaging e alla progettazione di interfacce, nonché allo sviluppo di sistemi di segnaletica e mappature di orientamento. Determina ambiti di insegnamento e ricerca specifici tra attività tecnica e intellettuale finalizzata alla progettazione di artefatti comunicativi culturali anche attraverso l’uso sperimentale di strumenti e metodi innovativi","codice_sector":"AFAM110","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2579","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2578","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Disegno e illustrazione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2578","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2578","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design degli ambienti","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano i principi teorici, le metodologie e gli strumenti operativi nell’ambito della progettazione dell’architettura di interni, dell’allestimento espositivo della progettazione di esposizioni temporanee e museali, dell’arredo urbano, deldesign degli oggetti per l’arredamento di spazi pubblici e privati. I diversi indirizzi progettuali sono intesi quali ambiti di ricerca e di sperimentazione per lo sviluppo di progetti innovativi in relazione agli aspetti e alle problematiche sociali, culturali e ambientali, alle ragioni produttive e di mercato. Il settore considera i principi tecnici e i pro ezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2576","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2576","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design degli ambienti","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano i principi teorici, le metodologie e gli strumenti operativi nell’ambito della progettazione dell’architettura di interni, dell’allestimento espositivo della progettazione di esposizioni temporanee e museali, dell’arredo urbano, deldesign degli oggetti per l’arredamento di spazi pubblici e privati. I diversi indirizzi progettuali sono intesi quali ambiti di ricerca e di sperimentazione per lo sviluppo di progetti innovativi in relazione agli aspetti e alle problematiche sociali, culturali e ambientali, alle ragioni produttive e di mercato. Il settore considera i principi tecnici e i processi tecnologici, fornisce le conoscenze per la valutazione dei bisogni funzionali ed ergonomici considerando i diversi aspetti fisici, percettivi, cognitivi. I contenuti disciplinari permettono inoltre di comprendere ed elaborare le tendenze estetico-formali e di considerare l’evoluzione storica dei comportamenti e dei linguaggi riferibili alla cultura dell’abitare. Le discipline del settore curano in modo particolare la ricerca di soluzioni innovative sia per quanto riguarda l’ideazione, sia per quanto attiene all’articolazione dei percorsi espositivi e agli strumenti comunicativi","codice_sector":"AFAM088","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2576","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Progettazione grafica","discipline_descrizione":"Il settore disciplinare comprende contenuti progettuali-teorici, metodi, saperi e ambiti di ricerca della progettazione grafica. Il progetto grafico (graphic design) è un’attività che unisce componenti tecniche e culturali volte al raggiungimento di finalità di comunicazione eterogenee. Le competenze interdisciplinari che confluiscono nell’attività di progettazione grafica sono declinate nella molteplicità degli ambiti applicativi e di ricerca del progetto grafico, operando in maniera trasversale rispetto agli stessi. Ambiti principali di applicazione sono la grafica di pubblica utilità, l’editoria, la pubblicità e gli strumenti anal azione","discipline_descrizione":"Il settore si articola in due ambiti: disegno e illustrazione. L’ambito del disegno comprende i contenuti artistici e scientifico-disciplinari e della ricerca che riguardano la formazione teorico-pratica e laboratoriale della cultura del disegno nell’accezione più ampia che comprende sia gli aspetti teorici che le indagini storiche sul disegno nei settori delle arti visive. Gli aspetti laboratoriali ed in particolare l’uso di strumenti e supporti legati tanto alle tecniche analogiche della tradizione quanto alle nuove tecnologie verranno considerati come finalità descrittive-progettuali ed espressive del disegno, visto come elemento di rappresentazione e come forma artistica autonoma ed applicata. I contenuti disciplinari dell’illustrazione riguardano gli ambiti propri della comunicazione visiva che utilizza la rappresentazione e la narrazione per immagini. Il settore comprende teorie, ricerche, metodi, tecniche e saperi impiegati per la progettazione e realizzazione di strutture narrative e discorsive visive. Le componenti tecniche e culturali offerte sono volte al raggiungimento di finalità eterogenee. L’attività teorico-pratica e laboratoriale ha finalità tecnico-espressive realizzate attraverso interconnessioni con altri linguaggi e relazioni con diverse tecniche grafiche, da quelle tradizionali alle nuove tecnologie digitali in tutte le declinazioni possibili dell’illustrazione (naturalistica, del libro d’arte e per l’infanzia) fino all’Intelligenza Artificiale","codice_sector":"AFAM077","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2574","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design della comunicazione","discipline_descrizione":"Il Design della Comunicazione è una disciplina fondamentale nella creazione e attuazione di strategie di comunicazione efficaci, chiare e coinvolgenti. Si occupa dell’architettura dell’informazione, di trasmettere valori e obiettivi di prodotti, servizi, processi e iniziative combinando elementi strutturati di visual design, tecniche di narrazione e psicologia della percezione per spazi o ambienti pubblici e privati ad uso mostre, convegni, eventi culturali e di pubblica utilità, anche mediante sistemi di wayfinding. Il Design della Comunicazione mira a stabilire connessioni tra marchi, istituzioni e persone, sostenendo un impatto positivo sia nel tessuto sociale che culturale. Nell’ambito pubblico, svolge un ruolo cruciale nell’informare sulle questioni socialmente rilevanti, facilitando la partecipazione civica e promuovendo una maggiore consapevolezza collettiva. Nel settore privato, supporta con efficacia il branding e la fidelizzazione, migliorando la comunicazione dei valori aziendali attraverso pubblicità, identità di marca e comunicazione digitale. Il Design della Comunicazione si adatta e anticipa i mutamenti culturali, sociali e tecnologici, promuovendo l’innovazione attraverso la ricerca e l’esplorazione di forme innovative di interazione e narrazione. L’etica del design si impegna per il superamento dei bias impliciti e dei pregiudizi culturali e di genere, incoraggiando pratiche inclusive ed eque","codice_sector":"AFAM086","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2574","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design degli ambienti","discipline_descrizione":"I contenuti scientifico-disciplinari del settore riguardano i principi teorici, le metodologie e gli strumenti operativi nell’ambito della progettazione dell’architettura di interni, dell’allestimento espositivo della progettazione di esposizioni temporanee e museali, dell’arredo urbano, deldesign degli oggetti per l’arredamento di spazi pubblici e privati. I diversi indirizzi progettuali sono intesi quali ambiti di ricerca e di sperimentazione per lo sviluppo di progetti innovativi in relazione agli aspetti e alle problematiche sociali, culturali e ambientali, alle ragioni produttive e di mercato. Il settore considera i principi tecnici e i processi tecnologici, fornisce le conoscenze per la valutazione dei bisogni funzionali ed ergonomici considerando i diversi aspetti fisici, percettivi, cognitivi. I contenuti disciplinari permettono inoltre di comprendere ed elaborare le tendenze estetico-formali e di considerare l’evoluzione storica dei comportamenti e dei linguaggi riferibili alla cultura dell’abitare. Le discipline del settore curano in modo particolare la ricerca di soluzioni innovative sia per quanto riguarda l’ideazione, sia per quanto attiene all’articolazione dei percorsi espositivi e agli strumenti comunicativi","codice_sector":"AFAM088","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2574","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Progettazione grafica","discipline_descrizione":"Il settore disciplinare comprende contenuti progettuali-teorici, metodi, saperi e ambiti di ricerca della progettazione grafica. Il progetto grafico (graphic design) è un’attività che unisce componenti tecniche e culturali volte al raggiungimento di finalità di comunicazione eterogenee. Le competenze interdisciplinari che confluiscono nell’attività di progettazione grafica sono declinate nella molteplicità degli ambiti applicativi e di ricerca del progetto grafico, operando in maniera trasversale rispetto agli stessi. Ambiti principali di applicazione sono la grafica di pubblica utilità, l’editoria, la pubblicità e gli strumenti analogici, digitali e interattivi per i settori pubblici e privati. Il settore include, inoltre, discipline quali progettazione grafica, layout e tecniche di visualizzazione, progettazione editoriale, progettazione tipografica, disegno di caratteri, progettazione grafica dell’immagine spaziando dall’identità visiva, all’editoria, al packaging e alla progettazione di interfacce, nonché allo sviluppo di sistemi di segnaletica e mappature di orientamento. Determina ambiti di insegnamento e ricerca specifici tra attività tecnica e intellettuale finalizzata alla progettazione di artefatti comunicativi culturali anche attraverso l’uso sperimentale di strumenti e metodi innovativi","codice_sector":"AFAM110","tipo_contratto":"Altri contratti","tipo_scuola":"Isia","dove":"ROMA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2574","istituto":"ISIA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e
