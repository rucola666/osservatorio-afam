15-10-2026","allegati":[],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"direzione@isiaroma.it","telefono_rup":"066796195"},{"bando_id":"2570","istituto":"CONSERVATORIO DI MUSICA DI NOCERA TERINESE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione","discipline_descrizione":"Il settore concerne la ricerca e lo studio dei processi creativi-compositivi (composizione originale, elaborazione, trascrizione, arrangiamento), nei vari generi e linguaggi musicali, storici e caratteristici della contemporaneità, compresa la composizione applicata alle immagini. In particolare il settore mira a sviluppare, attraverso l’analisi e l’esercizio compositivo nelle diverse formazioni strumentali e vocali, le competenze storicostilistiche e linguistiche in campo melodico, ritmico, armonico, contrappuntistico, timbrico, nonché le competenze tecnicoespressive relative all’uso della voce. Fondamentale aspetto di questo settore è lo studio delle forme compositive e delle tecniche della comunicazione musicale. Il settore concerne inoltre la didattica della composizione, con specifico riferimento all’applicazione in ambito formativo-educativo, in contesti scolastici ed extrascolastici","codice_sector":"AFAM041","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"NOCERA TERINESE","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"14-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11786/download/BANDO","https://afam-anagrafiche.mur.gov.it/11785/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"ufficiopersonale@tchaikovsky.it","telefono_rup":"0968923854"},{"bando_id":"2569","istituto":"ACCADEMIA DI BELLE ARTI DI MILANO","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"MILANO","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"29-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11782/download/BANDO","https://afam-anagrafiche.mur.gov.it/11781/download/BANDO","https://afam-anagrafiche.mur.gov.it/11783/download/BANDO","https://afam-anagrafiche.mur.gov.it/11784/download/BANDO","https://afam-anagrafiche.mur.gov.it/11780/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/60edf2ad5d9e4c7695925bed06d47876","email_rup":"protocollo@accademiadibrera.milano.it","telefono_rup":"0286955268-242"},{"bando_id":"2568","istituto":"CONSERVATORIO DI MUSICA DI REGGIO EMILIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"REGGIO EMILIA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"29-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11762/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it","email_rup":"maria.elena.mazzanti@conservatorio.peri-merulo.it","telefono_rup":"05221172170"},{"bando_id":"2567","istituto":"CONSERVATORIO DI MUSICA DI REGGIO EMILIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Pianoforte","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM018","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"REGGIO EMILIA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"29-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11749/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it","email_rup":"maria.elena.mazzanti@conservatorio.peri-merulo.it","telefono_rup":"05221172170"},{"bando_id":"2566","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Scienze e tecniche della comunicazione","discipline_descrizione":"Il settore attraverso strumenti teorici che attingono alle scienze del linguaggio, alla semiotica (dell’immagine, del design e delle arti performative), alle teorie della comunicazione, indaga la complessità dei prodotti di comunicazione che popolano la cultura materiale e immateriale. L’ambito disciplinare privilegia competenze che permettono un’indagine critica delle strategie di comunicazione del prodotto, nonché permette l’acquisizione di capacità relative all’analisi e alla produzione di testi visivi e verbali, con riferimento alla specificità dei media utilizzati. Il settore comprende anche gli studi che hanno per oggetto le produzione dell’arte, come articolazioni di segni, e i fenomeni comunicativi connessi alla produzione artistica. Gli studi e la ricerca riguardano il design, la cultura visuale, i settori della comunicazione mediale, editoriale, istituzionale e d’impresa, come anche la valorizzazione del patrimonio culturale, con attenzione alle forme di comunicazione creativa adottate dallo spettacolo, dalla pubblicità e dal marketing culturale","codice_sector":"AFAM101","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"29-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11790/download/BANDO","https://afam-anagrafiche.mur.gov.it/11915/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/657618c56d4844a6ba62da00a3a67396","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2565","istituto":"ACCADEMIA DI BELLE ARTI DI REGGIO CALABRIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Teoria, storia e metodo dei mass media","discipline_descrizione":"Teoria, storia e metodo dei mass media è un settore che si concentra sulle forme, le strategie e le tecnologie che caratterizzano le comunicazioni di massa, con un’attenzione specifica al loro impatto socio-culturale. Il settore definisce la fenomenologia dei media nel loro rapporto con i linguaggi artistici e i loro mutamenti sia nel contesto comunicativo sia in quello espressivo. Sono ambiti di ricerca della disciplina la teoria dei media e l’analisi delle strutture linguistiche e comunicazionali connesse all’evoluzione dei mass media. All’interno della storia sociale le comunicazioni di massa hanno svolto un importante ruolo di mediazione, veicolando contenuti simbolici e contribuendo ai processi di costruzione dell’identità culturale e sociale. Nell’attuale società digitale e iperconnessa, i media svolgono un ruolo centrale in tutte le interazioni sociali e pervadono la gran parte delle attività culturali: dalla comunicazione all’educazione, dall’intrattenimento alle pratiche artistiche. Pertanto, vista l’ampiezza degli ambiti di interesse, la metodologia adottata è interdisciplinare e fa dialogare lo studio dei linguaggi multimediali, audiovisivi e digital con l’analisi sociologica dei processi comunicativi, la storia culturale e la cultura visuale","codice_sector":"AFAM119","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"18-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11716/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=0cb1b075632c449f9bc5463cdade74cb","email_rup":"protocollo@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2564","istituto":"ACCADEMIA DI BELLE ARTI DI REGGIO CALABRIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecniche artistiche della scultura","discipline_descrizione":"Il settore disciplinare comprende conoscenze, metodi e strumenti per sviluppare competenze multidisciplinari necessarie per un completo sviluppo professionale nel mondo della produzione artistica e industriale. Le applicazioni spaziano dalla realizzazione di opere alla progettazione e rappresentazione di manufatti artistici, includendo la sperimentazione in ambito pubblico e privato. Il settore comprende l’insieme dei saperi delle tecniche per la scultura, la fonderia, marmo e pietre dure, la lavorazione del legno e la saldatura, sviluppando una preparazione tecnica che copre sia le metodologie tradizionali che quelle moderne e contemporanee. L’attività di laboratorio è inscindibile dall’attività della ricerca progettuale, affrontata in una dimensione personale o nelle possibili relazioni interdisciplinari. I contenuti scientifico-disciplinari includono esperienze pratico-operative con materiali tradizionali e di nuova generazione utilizzati nella scultura contemporanea, approfondendo i procedimenti tecnici e le sollecitazioni percettive ed emotive che questi materiali possono originare. Attraverso la pratica si esplorano tecniche di lavorazione delle argille, costruzione di stampi, colatura e stratificazione di materiali, oltre a tecniche di brasatura e saldatura dei metalli. La lavorazione del legno copre tipologie, caratteristiche fisiche e meccaniche, strumenti, incastri, intarsio, assemblaggi e finitura per la creazione di opere tridimensionali. La brasatura e saldatura, compresa la modellazione, forniscono competenze pratico-operative per lavorazioni di strutture e opere scultoree complesse. Il percorso didattico interagisce con imprese creative e culturali, oltre che con istituzioni pubbliche e private operanti nel settore. Il settore delle tecniche del marmo comprende una conoscenza delle problematiche operative per la realizzazione di manufatti in materiale lapideo, sia dal punto di vista teorico, sia sul versante della pratica. La parte teorica si basa sullo studio dei materiali (marmi, graniti, basalti, pietre arenarie e calcaree), delle tecnologie e degli strumenti da utilizzare. La parte pratica assicura un processo completo di lavorazione. I contenuti scientifico-disciplinari delle tecniche per la scultura comprendono lo sviluppo di esperienze pratico operative. Si trattano sia i materiali della tradizione che di nuova generazione della scultura contemporanea, approfondendone la conoscenza Ciò anche per consentire un monitoraggio attento delle innumerevoli sollecitazioni percettive ed emotive che da tali materiali possono avere origine. Si approfondiscono, attraverso la pratica laboratoriale, le varie tecniche di lavorazione delle argille, le tecniche di costruzione di stampi (in gesso, vetro resina e con gomme siliconiche) il riempimento degli stampi attraverso la colatura e la stratificazione dei vari materiali (cemento, cere, polimeri termoplastici e termoindurenti). Inoltre si trattano le tecniche di brasatura e saldatura dei metalli compresa la modellazione. Le tecniche della lavorazione del legno abbracciano attività didattico-formative e di ricerca per fornire metodologie e strumenti sia tradizionali che tecnologici. Lo studente apprenderà la conoscenza delle varie tipologie di legno, gli strumenti per la lavorazione e gli incastri, l’intarsio, gli assemblaggi e la finitura. Le tecniche di fonderia racchiudono conoscenze delle differenti tecniche fusorie, della formatura e lo studio delle cere che, partendo dalle problematiche relative alla produzione di sculture e oggetti, individuano e risolvono gli snodi critici connessi alle tecniche di assemblaggio, all’uso vantaggioso dei materiali metallici nella scultura con strumenti per esplorare il rapporto spaziale della forma con l’ambiente, anche in dialogo con altre discipline","codice_sector":"AFAM082","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"18-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11714/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=0cb1b075632c449f9bc5463cdade74cb","email_rup":"protocollo@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2563","istituto":"CONSERVATORIO DI MUSICA DI MATERA","sito_istituzionale":"https://www.conservatoriomatera.it/amministrazione_trasparente/bandi-di-concorso/bandi-di-concorso-attivi/","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"MATERA","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"13-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11712/download/BANDO","https://afam-anagrafiche.mur.gov.it/11713/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=986edc160df94ca787f6aaf5d83ce994","email_rup":"protocollo@conservatoriomatera.it","telefono_rup":"0835333202"},{"bando_id":"2562","istituto":"ACCADEMIA DI BELLE ARTI DI REGGIO CALABRIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design del prodotto","discipline_descrizione":"Il Design del Prodotto riguarda i temi della ricerca e della progettazione di prodotti che soddisfino le esigenze funzionali, ergonomiche, formali, sociali ed etiche in sintonia con le esigenze del mercato e del benessere, nell’ottica degli obiettivi imprescindibili di una progettazione attenta e sostenibile per l’uomo, l’ambiente e le altre forme di vita che popolano il pianeta. I designer del prodotto lavorano su soluzioni innovative di processo o di prodotto che migliorino la vita quotidiana degli utenti e delle comunità, che rispondano a sfide tecnologiche, di innovazione tipologica, filosofiche e produttive contemporanee, che siano in grado di interpretare il futuro, attraverso un processo che abbracci la ricerca, la progettazione e lo sviluppo formale e per il tramite dell’uso di materiali congrui e sostenibili, anche di tipo avanzato. Il design del prodotto mira a sviluppare le idee progettuali in elaborati prevalentemente materiali, a supporto di un miglioramento della vita e del progresso sociale ed economico, tramite una solida formazione di base nell’ambito delle discipline del progetto, sia a livello interdisciplinare teorico e operativo. Il settore include inoltre la riflessione critica e la pratica responsabile del design, valutandone l’impatto sui sistemi complessi e le implicazioni morali, sociali, culturali e ambientali, promuovendo valori come integrità, giustizia, rispetto, sostenibilità e responsabilità, superando bias impliciti e pregiudizi per favorire pratiche inclusive. L’etica del design incoraggia comportamenti trasparenti e rispettosi, adattandosi alle sfide digitali e globali, mantenendo il benessere umano e l’equilibrio ambientale come priorità","codice_sector":"AFAM087","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"18-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11711/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=0cb1b075632c449f9bc5463cdade74cb","email_rup":"protocollo@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2561","istituto":"CONSERVATORIO DI MUSICA DI NOCERA TERINESE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Diritto delle arti, del design, dello spettacolo e dei beni culturali","discipline_descrizione":"Il settore comprende competenze e ambiti di ricerca inerenti al diritto dei beni e delle attività culturali, al diritto del lavoro e della previdenza sociale con particolare riguardo all’ambito artistico e dello spettacolo, alla proprietà intellettuale – incluso il diritto d’autore – nel contesto nazionale e internazionale in una prospettiva di comparazione, alla gestione delle imprese operanti nel mondo delle arti e dello spettacolo ed ai relativi sistemi produttivi-industriali, anche legati allo sviluppo delle nuove tecnologie e delle intelligenze artificiali, alla legislazione di cantiere e in materia di sicurezza sul lavoro, nonché all’ordinamento scolastico e dell’Alta Formazione Artistica e Musicale. Completano il settore gli studi riguardanti il rapporto tra diritto e discipline umanistiche, nelle varie declinazioni riconosciute","codice_sector":"AFAM058","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"NOCERA TERINESE","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"13-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11705/download/BANDO","https://afam-anagrafiche.mur.gov.it/11704/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"ufficiopersonale@tchaikovsky.it","telefono_rup":"0968923854"},{"bando_id":"2560","istituto":"CONSERVATORIO DI MUSICA DI NOCERA TERINESE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Arpa","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM001","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"NOCERA TERINESE","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"13-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11703/download/BANDO","https://afam-anagrafiche.mur.gov.it/11702/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"ufficiopersonale@tchaikovsky.it","telefono_rup":"0968923854"},{"bando_id":"2559","istituto":"CONSERVATORIO DI MUSICA DI NOCERA TERINESE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Lingua straniera","discipline_descrizione":"Il settore concerne gli studi e le ricerche sulle lingue europee ed extra europee con attenzione rivolta particolarmente all’utilizzo dei differenti modelli linguistici in ambito artistico, dello spettacolo, del design e del restauro. Comprende, inoltre, le modalità espressive e più estesamente concettuali usate nelle diverse culture con specifiche terminologie critiche e tecniche utilizzate oggi nel mondo di tutte le arti","codice_sector":"AFAM057","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"NOCERA TERINESE","puoi_candidarsi_da":"28-09-2026","ultimo_giorno_candidatura":"13-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11701/download/BANDO","https://afam-anagrafiche.mur.gov.it/11700/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/","email_rup":"ufficiopersonale@tchaikovsky.it","telefono_rup":"0968923854"},{"bando_id":"2558","istituto":"CONSERVATORIO DI MUSICA DI NOCERA TERINESE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Basso tuba","discipline_descrizione":"Il settore, nei suoi ambit ologie, agli strumenti, ai materiali, alle ultime tendenze applicate in un’ottica di sostenibilità ambientale","codice_sector":"AFAM112","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"12-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11421/download/BANDO","https://afam-anagrafiche.mur.gov.it/11913/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/ba611eb6a0094be5908331e68c989dbe","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2526","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Storia delle arti visive","discipline_descrizione":"Il settore comprende gli studi e le ricerche di carattere teorico, storico, metodologico negli ambiti della storia delle arti visive dall’antichità ai nostri giorni con particolare riferimento alla cultura occidentale per un’interpretazione critica delle manifestazioni artistiche dell’essere umano. La storia dell’arte è intesa elemento identitario della cultura in Italia e nell’ambito degli studi nel settore AFAM, nonché quale fattore necessario di consapevolezza civile sulla centralità del patrimonio artistico, la sua conservazione, tutela, valorizzazione e la sua trasmissione al futuro. Sono prese in esame con metodo interdisciplinare e nell’ottica della complessità le opere architettoniche, scultoree, pittoriche, grafiche fotografiche, installative e performative, con particolare attenzione agli agenti e ai fattori sociali che concorrono alla loro produzione nel contesto storico e culturale di appartenenza, nonché lo studio degli artisti, delle poetiche e dei movimenti artistici e il loro impatto sulla società. La disciplina studia le conseguenti modificazioni dei linguaggi anche in funzione dei cambiamenti delle tecniche e delle pratiche artistiche all’interno dell’orizzonte storico sociologico, estetico e culturale, dalle origini fino alle più attuali tendenze artistiche, non solo nelle tradizionali espressioni, ma anche con riferimento alle culture sceniche, coreografiche e filmiche, nonché in relazione alla produzione della società industriale e postindustriale, inclusa l’interazione e la contaminazione tra i nuovi e diversi linguaggi visivi, multimediali e con l’Intelligenza Artificiale. Include gli studi e le ricerche di iconografia e iconologia, di sociologia dell’arte, nonché quelli di carattere teorico e metodologico inerenti la critica d’arte, la letteratura artistica, la storia e la metodologia della storia dell’arte, la storia del collezionismo, la museologia, le relazioni tra le arti visive e le arti performative. Comprende infine gli studi le ricerche sulle tecniche artistiche, la storia e la teoria della conservazione e del restauro del patrimonio e le problematiche di conservazione dell’arte contemporanea","codice_sector":"AFAM102","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"12-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11419/download/BANDO","https://afam-anagrafiche.mur.gov.it/11802/download/BANDO","https://afam-anagrafiche.mur.gov.it/11914/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/e6e762a72d444887b27ba9f9cbf15cfb","email_rup":"direttore@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2525","istituto":"CONSERVATORIO DI MUSICA DI BOLZANO","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Teoria e tecnica dell'interpretazione scenica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, si occupa delle relazioni fra scena e musica e, in particolare, dello studio della recitazione, della dizione, della gestualità e degli aspetti concernenti la regia e i costumi, con particolare riferimento al teatro musicale e ad altre forme di spettacolo. Si approfondisce anche l’indagine concernente l’analisi del personaggio attraverso il metodo dell’interpretazione","codice_sector":"AFAM055","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"BOLZANO","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"24-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11418/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it","email_rup":"christin.tomasello@cons.bz.it","telefono_rup":"0471975891"},{"bando_id":"2524","istituto":"ACCADEMIA DI BELLE ARTI DI CARRARA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Applicazioni digitali per le arti e il design","discipline_descrizione":"Il settore comprende le competenze legate all’applicazione di strumenti digitali evoluti ai linguaggi visivi artistici e performativi, tanto per ciò che concerne gli aspetti sperimentali ed espressivi, quanto per le possibili applicazioni professionali. Questo settore combina pertanto principi artistici e di design, algoritmi di elaborazione, fondamenti di grafica, conoscenze creative e sperimentali, nell’uso di software per la generazione ed elaborazione di immagini anche in movimento. L’approccio alle tematiche che caratterizzano il settore, prevede, in particolare, la trattazione, sotto il profilo teorico, metodologico ed applicativo, dell’immagine bidimensionale e tridimensionale e della sua elaborazione statica ed in movimento anche relativamente a spazi virtuali e in realtà aumentata. Il settore non comprende solo gli ambiti di creazione di immagini, ma anche tutto ciò che concerne la progettazione e la ricerca. L’esperienza laboratoriale costituisce un momento essenziale dell’esperienza formativa in rapporto alle diverse forme di rappresentazione e ai differenti strumenti anche dinamici e interattivi, secondo procedure, tecniche e strumenti di acquisizione, archiviazione, gestione e rappresentazione grafica di dati, anche in tempo reale","codice_sector":"AFAM094","tipo_contratto":"Tempo determinato","tipo_scuola":"Accademia","dove":"CARRARA","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"12-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11414/download/BANDO","https://afam-anagrafiche.mur.gov.it/11912/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0a03b51b7f9540dba226632f4f0840c0","email_rup":"dir.amministrativo@accademiacarrara.it","telefono_rup":"058571658"},{"bando_id":"2523","istituto":"CONSERVATORIO DI MUSICA DI PAVIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Arpa","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, e agli eventuali strumenti affini, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM001","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"PAVIA","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"09-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11406/download/BANDO","https://afam-anagrafiche.mur.gov.it/11402/download/BANDO","https://afam-anagrafiche.mur.gov.it/11405/download/BANDO","https://afam-anagrafiche.mur.gov.it/11403/download/BANDO","https://afam-anagrafiche.mur.gov.it/11404/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/publi  di temperamento in uso. Il profilo disciplinare di basso continuo alle tastiere storiche caratterizza il percorso formativo di maestro al cembalo. La pratica strumentale è supportata da una riflessione teorica sulle possibili interpretazioni a partire dallo studio dei trattati e delle fonti, con particolare riferimento all’ornamentazione, all’improvvisazione, alla gestualità e alle tecniche di esecuzione della musica delle avanguardie storiche e contemporanea, eventualmente contemplata nei repertori dei profili disciplinari. È prevista inoltre la conoscenza delle metodologie riferite alla didattica dello strumento","codice_sector":"AFAM026","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"GALLARATE","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"09-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11368/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=53ccf570b7814f7aa266711087ca173e","email_rup":"amministrazione@issmpuccinigallarate.it","telefono_rup":"0331790202"},{"bando_id":"2519","istituto":"CONSERVATORIO DI MUSICA DI GALLARATE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Movimento espressivo e consapevolezza corporea per le arti performative","discipline_descrizione":"Il settore concerne la ricerca e la conoscenza delle metodologie e delle tecniche utili al fine di acquisire la consapevolezza corporea per le arti performative, favorendo altresì lo sviluppo motorio-gestuale ed espressivo in ambito artistico e musicale","codice_sector":"AFAM054","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"GALLARATE","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"09-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11368/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=53ccf570b7814f7aa266711087ca173e","email_rup":"amministrazione@issmpuccinigallarate.it","telefono_rup":"0331790202"},{"bando_id":"2519","istituto":"CONSERVATORIO DI MUSICA DI GALLARATE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Teoria e tecnica dell'interpretazione scenica","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, si occupa delle relazioni fra scena e musica e, in particolare, dello studio della recitazione, della dizione, della gestualità e degli aspetti concernenti la regia e i costumi, con particolare riferimento al teatro musicale e ad altre forme di spettacolo. Si approfondisce anche l’indagine concernente l’analisi del personaggio attraverso il metodo dell’interpretazione","codice_sector":"AFAM055","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"GALLARATE","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"09-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11368/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=53ccf570b7814f7aa266711087ca173e","email_rup":"amministrazione@issmpuccinigallarate.it","telefono_rup":"0331790202"},{"bando_id":"2519","istituto":"CONSERVATORIO DI MUSICA DI GALLARATE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Lingua straniera","discipline_descrizione":"Il settore concerne gli studi e le ricerche sulle lingue europee ed extra europee con attenzione rivolta particolarmente all’utilizzo dei differenti modelli linguistici in ambito artistico, dello spettacolo, del design e del restauro. Comprende, inoltre, le modalità espressive e più estesamente concettuali usate nelle diverse culture con specifiche terminologie critiche e tecniche utilizzate oggi nel mondo di tutte le arti","codice_sector":"AFAM057","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"GALLARATE","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"09-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11368/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=53ccf570b7814f7aa266711087ca173e","email_rup":"amministrazione@issmpuccinigallarate.it","telefono_rup":"0331790202"},{"bando_id":"2516","istituto":"CONSERVATORIO DI MUSICA DI LA SPEZIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"LA SPEZIA","puoi_candidarsi_da":"24-09-2026","ultimo_giorno_candidatura":"24-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11380/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/","email_rup":"amministrazione@conssp.it","telefono_rup":"0187770333"},{"bando_id":"2514","istituto":"ACCADEMIA DI BELLE ARTI DI MILANO","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"MILANO","puoi_candidarsi_da":"23-09-2026","ultimo_giorno_candidatura":"23-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11312/download/BANDO","https://afam-anagrafiche.mur.gov.it/11314/download/BANDO","https://afam-anagrafiche.mur.gov.it/11313/download/BANDO"],"bando_inpa":"","email_rup":"direzioneamministrativa@accademiadibrera.milano.it","telefono_rup":"0286955222"},{"bando_id":"2513","istituto":"CONSERVATORIO DI MUSICA DI PERUGIA","sito_istituzionale":"https://www.conservatorioperugia.it/","discipline_nomi":"Diritto delle arti, del design, dello spettacolo e dei beni culturali","discipline_descrizione":"Il settore comprende competenze e ambiti di ricerca inerenti al diritto dei beni e delle attività culturali, al diritto del lavoro e della previdenza sociale con particolare riguardo all’ambito artistico e dello spettacolo, alla proprietà intellettuale – incluso il diritto d’autore – nel contesto nazionale e internazionale in una prospettiva di comparazione, alla gestione delle imprese operanti nel mondo delle arti e dello spettacolo ed ai relativi sistemi produttivi-industriali, anche legati allo sviluppo delle nuove tecnologie e delle intelligenze artificiali, alla legislazione di cantiere e in materia di sicurezza sul lavoro, nonché all’ordinamento scolastico e dell’Alta Formazione Artistica e Musicale. Completano il settore gli studi riguardanti il rapporto tra diritto e discipline umanistiche, nelle varie declinazioni riconosciute","codice_sector":"AFAM058","tipo_contratto":"Altri contratti","tipo_scuola":"Conservatorio","dove":"PERUGIA","puoi_candidarsi_da":"23-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11307/download/BANDO","https://afam-anagrafiche.mur.gov.it/11306/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=adcce2f5828e4506b286431212f5925e","email_rup":"o.bonanno@conservatorioperugia.it","telefono_rup":"0755733844"},{"bando_id":"2509","istituto":"ISIA DI FIRENZE","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Ingegnerizzazione, matematica e fisica per il design","discipline_descrizione":"Il settore tratta l’ingegnerizzazione del prodotto, inquadrandola come una disciplina interdisciplinare che abbraccia aspetti economici, tecnici e sociali, mirata a ottimizzare i processi produttivi, i materiali e le tecnologie per armonizzare fra loro i requisiti economici, ambientali e prestazionali in fase di progettazione, pre-produzione e produzione. Oltre a considerare la sostenibilità ambientale, sociale ed economica, questo approccio si avvale di competenze in ambito logico-matematico e scientifico. In particolare, la progettazione di prodotti e sistemi implica la conoscenza di principi di fisica applicata al design, calcolo differenziale e integrale, algebra lineare e algoritmi utili alla rappresentazione geometrica e visiva. Il settore include pertanto competenze matematiche e fisiche utili a fornire una base essenziale per l’analisi e la stima dei dati e la comunicazione efficace di informazioni complesse, con un focus sull’ottimizzazione dei processi anche in presenza di vincoli. Inoltre l’adozione di materiali ecocompatibili e processi produttivi a basso impatto energetico in fase progettuale si affianca alla verifica strutturale e prestazionale dei materiali, utilizzando strumenti della fisica applicata. Il settore tratta inoltre sia l’innovazione tecnologica, sia l’uso di modelli matematici e fisici avanzati per migliorare la funzionalità dei prodotti e dei processi produttivi, anche attraverso l’uso di software specifici, attraverso il calcolo e lo sviluppo di soluzioni sostenibili lungo tutto il ciclo di vita del prodotto, dalla progettazione allo smaltimento. Il settore include, ancora, riflessioni storiche e teoriche sui rapporti tra scienza, arte e design, arricchendo il processo progettuale con una prospettiva culturale più ampia. La ricerca operativa e la fisica applicata svolgono un ruolo chiave non solo nell’ottimizzazione produttiva, ma anche nella conservazione del patrimonio culturale","codice_sector":"AFAM091","tipo_contratto":"Tempo determinato","tipo_scuola":"Isia","dove":"FIRENZE","puoi_candidarsi_da":"23-09-2026","ultimo_giorno_candidatura":"08-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/11292/download/BANDO","https://afam-anagrafiche.mur.gov.it/11291/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/0ffb1e201bd64de994479acd251d5676","email_rup":"direttore.amministrativo@isiadesign.fi.it","telefono_rup":"055700301"},{"bando_id":"2508","istituto":"CONSERVATORIO DI MUSICA DI NOVARA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_se tratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"MONOPOLI","puoi_candidarsi_da":"17-09-2026","ultimo_giorno_candidatura":"19-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10892/download/BANDO","https://afam-anagrafiche.mur.gov.it/10890/download/BANDO","https://afam-anagrafiche.mur.gov.it/10891/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=fd2eb5407fcc4c429abea957a8430df6","email_rup":"rota@conservatoriodimonopoli.org","telefono_rup":"0809303607"},{"bando_id":"2405","istituto":"ACCADEMIA DI BELLE ARTI DI MILANO","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Storia delle arti visive","discipline_descrizione":"Il settore comprende gli studi e le ricerche di carattere teorico, storico, metodologico negli ambiti della storia delle arti visive dall’antichità ai nostri giorni con particolare riferimento alla cultura occidentale per un’interpretazione critica delle manifestazioni artistiche dell’essere umano. La storia dell’arte è intesa elemento identitario della cultura in Italia e nell’ambito degli studi nel settore AFAM, nonché quale fattore necessario di consapevolezza civile sulla centralità del patrimonio artistico, la sua conservazione, tutela, valorizzazione e la sua trasmissione al futuro. Sono prese in esame con metodo interdisciplinare e nell’ottica della complessità le opere architettoniche, scultoree, pittoriche, grafiche fotografiche, installative e performative, con particolare attenzione agli agenti e ai fattori sociali che concorrono alla loro produzione nel contesto storico e culturale di appartenenza, nonché lo studio degli artisti, delle poetiche e dei movimenti artistici e il loro impatto sulla società. La disciplina studia le conseguenti modificazioni dei linguaggi anche in funzione dei cambiamenti delle tecniche e delle pratiche artistiche all’interno dell’orizzonte storico sociologico, estetico e culturale, dalle origini fino alle più attuali tendenze artistiche, non solo nelle tradizionali espressioni, ma anche con riferimento alle culture sceniche, coreografiche e filmiche, nonché in relazione alla produzione della società industriale e postindustriale, inclusa l’interazione e la contaminazione tra i nuovi e diversi linguaggi visivi, multimediali e con l’Intelligenza Artificiale. Include gli studi e le ricerche di iconografia e iconologia, di sociologia dell’arte, nonché quelli di carattere teorico e metodologico inerenti la critica d’arte, la letteratura artistica, la storia e la metodologia della storia dell’arte, la storia del collezionismo, la museologia, le relazioni tra le arti visive e le arti performative. Comprende infine gli studi le ricerche sulle tecniche artistiche, la storia e la teoria della conservazione e del restauro del patrimonio e le problematiche di conservazione dell’arte contemporanea","codice_sector":"AFAM102","tipo_contratto":"Altri contratti","tipo_scuola":"Accademia","dove":"MILANO","puoi_candidarsi_da":"16-09-2026","ultimo_giorno_candidatura":"01-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10873/download/BANDO","https://afam-anagrafiche.mur.gov.it/10874/download/BANDO","https://afam-anagrafiche.mur.gov.it/10872/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=ee263af2eb61491ab43384242adb9328","email_rup":"protocollo@accademiadibrera.milano.it","telefono_rup":"0286955242"},{"bando_id":"2404","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecnologie digitali per le arti","discipline_descrizione":"Il settore comprende l’attività scientifica, artistica e formativa, sia teorica che pratica nel campo delle nuove tecnologie applicate alle arti performative. La ricerca, la produzione e la didattica di questo settore si articolano in conoscenze e competenze nella teoria e nelle tecniche di scrittura scenica, di composizione, di regia e conduzione delle componenti digitali e performative nell’ambito della scena digitale e nelle arti visive. Include le tecniche di scrittura coreografica per la danza, compresi lo studio e l’analisi del gesto, del movimento e della interazione con lo spettatore mediante tecnologie digitali","codice_sector":"AFAM108","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"16-09-2026","ultimo_giorno_candidatura":"17-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10849/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=08e294fb9eed42edb8ce75a91f7d5a27","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2403","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Scenografia","discipline_descrizione":"I contenuti del settore fanno riferimento ai diversi ambiti di competenza della ricerca e della progettazione scenografica e scenotecnica per il teatro, il teatro di figura, il cinema, la televisione e i nuovi media. Si contemplano le connessioni con le tecniche e tecnologie della tradizione e del contemporaneo, incluse le modalità di restituzione grafica, pittorica, plastica e la rappresentazione esecutiva dello spazio scenico. I contenuti disciplinari comprendono: la progettazione per il teatro (dalla prosa al teatro musicale alle sperimentazioni drammaturgiche, musicali e coreutiche in spazi tradizionali, urbani e di nuova concezione); la progettazione dello spazio per eventi e allestimenti; la progettazione dello spazio scenico, performativo e coreutico; le tecniche di realizzazione per il teatro di figura; la scenografia del cinema comprese le tecnologie per la creazione di ambienti ed architetture virtuali per la produzione filmica, seriale, documentaristica e di sperimentazione; per la televisione di palinsesto, di divulgazione ed intrattenimento compresa la progettazione e restituzione in spazi e set tradizionali ed ambienti virtuali o di nuova concezione. Si contempla la progettazione e la ricerca con una particolare attenzione al ciclo di vita delle realizzazioni scenografiche, nell’ottica della sostenibilità e dell’economicità","codice_sector":"AFAM072","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"16-09-2026","ultimo_giorno_candidatura":"17-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10848/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=8897fb4964984dcfaf6b870c8721c14a","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2402","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Composizione della danza, progettazione e realizzazione coreografica","discipline_descrizione":"Il settore disciplinare favorisce lo sviluppo del processo creativo individuale e originale e offre le conoscenze necessarie per realizzare le proprie intenzioni espressive anche nell’ambito della ricerca nei diversi linguaggi della danza, sia storici che attuali. Stimola l’acquisizione delle forme di organizzazione e costruzione dei materiali coreografici individuali, il consolidamento del processo coreografico, le capacità di trasmettere. Il settore comprende altresì l’analisi e la progettazione degli aspetti relativi alla regia e alla drammaturgia della creazione coreografica. Forma coreografi di livello professionale in grado di realizzare opere coreografiche, per solisti e ensemble, fornisce la preparazione per elaborare progetti coreografici e per allestirli in spazi convenzionali e alternativi","codice_sector":"AFAM064","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"16-09-2026","ultimo_giorno_candidatura":"17-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10847/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=06dbf71db1f943fca0501d784a67bdea","email_rup":"protocollo@accademianazionaledanza.it","telefono_rup":"0657177771"},{"bando_id":"2401","istituto":"ACCADEMIA NAZIONALE DI DANZA DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Tecnica e repertorio della danza classica","discipline_descrizione":"Il settore comprende i due ambiti disciplinari di Tecnica e di Repertorio della danza classica; prevede la conoscenza dell’analisi dei principi tecnici e stilistici concernenti i due ambiti disciplinari, con particolare riguardo alla ricerca nel campo artistico, performativo, metodologico e didattico. Il settore include le abilità tecniche e interpretative che concorrono alla formazione del danzatore, del coreografo, del ripetitore e dell’insegnante. Relativamente alla Tecnica della danza classica le competenze acquisite consentono di progettare corsi per danzatori di diverso livello, dalla formazione di base a quella professionale. Relativamente al Repertorio della danza classica è richiesta un’esperienza artistico-professionale, con particolare riguardo ai principali ruoli del balletto classico, incluse le danze di carattere e le danze di sala a uso scenico. Le competenze acquisite consentono di analizzare il repertorio dal punto vista tecnico, stilistico, drammaturgico, inquadrandolo nel suo contesto storico","codice_sector":"AFAM061","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"16-09-2026","ultimo_giorno_candidatura":"17-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10841/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=8189cc0817c84affbb6b5c49dae4adfc","email_rup": 90","istituto":"CONSERVATORIO DI MUSICA DI MODENA E CARPI","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Viola","discipline_descrizione":"Il settore, nei suoi ambiti di pratica e di ricerca, concerne l’acquisizione delle abilità tecniche e delle competenze musicali, culturali e interpretative relative allo strumento, necessarie per affrontare i diversi repertori delle varie epoche fino ai nostri giorni con piena consapevolezza delle correlate prassi esecutive. Si approfondiscono anche quegli aspetti esecutivi e interpretativi relativi all’uso dello strumento nell’attività concertistica solistica, d’insieme e con orchestra. Al fine di una completa formazione dello strumentista sono altresì comprese nel settore le conoscenze relative alla storia, alla trattatistica e alla didattica dello strumento","codice_sector":"AFAM005","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"MODENA E CARPI","puoi_candidarsi_da":"14-09-2026","ultimo_giorno_candidatura":"14-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10725/download/BANDO","https://afam-anagrafiche.mur.gov.it/10724/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/9a3cf27e587a4e19b2e6748d448ea581","email_rup":"giuseppe.modugno@vecchitonelli.com","telefono_rup":"0592032925"},{"bando_id":"2389","istituto":"CONSERVATORIO DI MUSICA D'ADRIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Musica da camera strumentale e vocale","discipline_descrizione":"Il settore concerne lo studio, la ricerca, la pratica e l’interpretazione della letteratura cameristica strumentale e vocale, con l’approfondimento delle prassi esecutive e i repertori di varie epoche, anche con riferimento all’interpretazione del repertorio vocale da camera e liederistico","codice_sector":"AFAM034","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"MUSICA D'ADR escrizione":"Il settore si occupa della fenomenologia delle arti contemporanee e approfondisce le teorie delle arti multimediali e delle culture digitali. Indaga la contemporaneità nel suo divenire attraverso lo studio e la ricerca delle interrelazioni tra le diverse arti contemporanee in un’ottica interdisciplinare secondo una prospettiva teorica, metodologica, organizzativa e critica, con particolare riferimento alle questioni connesse ai processi di innovazione tecnologica e alla ricerca delle loro possibili conseguenze linguistiche, sociologiche, antropologiche e culturali","codice_sector":"AFAM104","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"14-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10695/download/BANDO","https://afam-anagrafiche.mur.gov.it/10696/download/BANDO"],"bando_inpa":"https://www.inpa.gov.it/bandi-e-avvisi/dettaglio-bando-avviso/?concorso_id=b349f15451a943008d3b93895574d8d1","email_rup":"direttore@abaroma.it","telefono_rup":"063227025"},{"bando_id":"2363","istituto":"ACCADEMIA DI BELLE ARTI DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Systemic design","discipline_descrizione":"Il settore Systemic Design studia i processi, i modelli e i metodi per la progettazione di sistemi complessi (multidimensionalità, non linearità, autonomia e adattamento, evoluzione e coevoluzione), nella loro articolazione di sistemi integrati di progetto al fine di prevederne i comportamenti e di ottimizzarne le prestazioni. Il settore introduce ad una visione sistemica specifica per il designer laddove l’esito dell’analisi e della ricerca, produca una risoluzione progettuale rispondente in maniera integrale (filiera) alla problematica in oggetto, determinando flussi relazionali (interazioni generanti buone prassi di miglioramento della dimensione comunitaria e di crescita del territorio-impresa) tra i nodi (prodotti e servizi fisici e digitali) e gli attori (imprese, enti, organizzazioni di cittadini) necessariamente coinvolti nel raggiungimento di macro-obiettivi valoriali e strategici di economia-civile. L’innovazione è intesa come organismo di inter-relazioni feconde che, a partire dall’indagine del contesto sociale, identificano le aree di opportunità e attivano una compartecipazione responsabile ed evolutiva, in ottica di pensiero circolare (sistema emergente auto-organizzante). Sono forniti strumenti concettuali e operativi che permettono di ‘pensare per sistemi’ e ‘per la complessità’, sviluppando capacità gestionali e di pianificazione del progetto, e di coordinamento e direzione delle diverse competenze che concorrono allo sviluppo dei processi innovativi. All’interno di questo quadro complesso, il Design dei Servizi rappresenta una specializzazione del Systemic Design, concentrandosi in modo specifico sulla progettazione e ottimizzazione sistemica dei servizi, siano essi pubblici o privati, che non solo rispondano ai bisogni degli utenti, ma che si integrino perfettamente nei sistemi più ampi di cui fanno parte. Attraverso un approccio centrato sull’utente e la co-creazione, il Design dei Servizi studia le interazioni tra gli utenti e le organizzazioni, cercando di migliorare l’esperienza complessiva e di ottimizzare le prestazioni dei servizi, sempre con una prospettiva sistemica. Il Design dei servizi si fonda su un modello di innovazione continua, capace di gestire la complessità dei sistemi non lineari, con l’obiettivo primario di sviluppare servizi che migliorino la vita delle persone, ponendo particolare attenzione all’impatto sociale generato e alla gestione costante dei feedback","codice_sector":"AFAM089","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"14-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10684/download/BANDO","https://afam-anagrafiche.mur.gov.it/10682/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"direzione@abaroma.it","telefono_rup":"063227025"},{"bando_id":"2361","istituto":"ACCADEMIA DI BELLE ARTI DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Storia delle arti visive","discipline_descrizione":"Il settore comprende gli studi e le ricerche di carattere teorico, storico, metodologico negli ambiti della storia delle arti visive dall’antichità ai nostri giorni con particolare riferimento alla cultura occidentale per un’interpretazione critica delle manifestazioni artistiche dell’essere umano. La storia dell’arte è intesa elemento identitario della cultura in Italia e nell’ambito degli studi nel settore AFAM, nonché quale fattore necessario di consapevolezza civile sulla centralità del patrimonio artistico, la sua conservazione, tutela, valorizzazione e la sua trasmissione al futuro. Sono prese in esame con metodo interdisciplinare e nell’ottica della complessità le opere architettoniche, scultoree, pittoriche, grafiche fotografiche, installative e performative, con particolare attenzione agli agenti e ai fattori sociali che concorrono alla loro produzione nel contesto storico e culturale di appartenenza, nonché lo studio degli artisti, delle poetiche e dei movimenti artistici e il loro impatto sulla società. La disciplina studia le conseguenti modificazioni dei linguaggi anche in funzione dei cambiamenti delle tecniche e delle pratiche artistiche all’interno dell’orizzonte storico sociologico, estetico e culturale, dalle origini fino alle più attuali tendenze artistiche, non solo nelle tradizionali espressioni, ma anche con riferimento alle culture sceniche, coreografiche e filmiche, nonché in relazione alla produzione della società industriale e postindustriale, inclusa l’interazione e la contaminazione tra i nuovi e diversi linguaggi visivi, multimediali e con l’Intelligenza Artificiale. Include gli studi e le ricerche di iconografia e iconologia, di sociologia dell’arte, nonché quelli di carattere teorico e metodologico inerenti la critica d’arte, la letteratura artistica, la storia e la metodologia della storia dell’arte, la storia del collezionismo, la museologia, le relazioni tra le arti visive e le arti performative. Comprende infine gli studi le ricerche sulle tecniche artistiche, la storia e la teoria della conservazione e del restauro del patrimonio e le problematiche di conservazione dell’arte contemporanea","codice_sector":"AFAM102","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"14-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10678/download/BANDO","https://afam-anagrafiche.mur.gov.it/10681/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"direzione@abaroma.it","telefono_rup":"063227025"},{"bando_id":"2360","istituto":"ACCADEMIA DI BELLE ARTI DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Metodi e strumenti per la rappresentazione del progetto","discipline_descrizione":"Il settore disciplinare si fonda sull’assunto culturale che la rappresentazione sia un’estensione del pensiero e un linguaggio universalmente riconosciuto di comunicazione. L’attività di ricerca, progettuale, artistica e didattico-formativa, sia teorica sia pratica, comprende l’insieme dei saperi, delle teorie, dei metodi e delle tecniche per la produzione di rappresentazioni bidimensionali e tridimensionali, sia analogiche sia digitali sia post-digitali, relative alle attività di ideazione alle diverse scale, dello spazio, del manufatto e dell’oggetto, sia reali sia immaginate, compresi i beni culturali","codice_sector":"AFAM083","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"14-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10676/download/BANDO","https://afam-anagrafiche.mur.gov.it/10677/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"direzione@abaroma.it","telefono_rup":"063227025"},{"bando_id":"2358","istituto":"ACCADEMIA DI BELLE ARTI DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"ROMA","puoi_candidarsi_da":"14-09-2026","ultimo_giorno_candidatura":"15-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10673/download/BANDO","https://afam-anagrafiche.mur.gov.it/10674/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it","email_rup":"direzione@abaroma.it","telefono_rup":"063227025"},{"bando_id":"2352","istituto":"ACCADEMIA DI BELLE ARTI DI ROMA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Design del prodotto","discipline_descrizione":"Il Design del Prodotto riguarda i temi della ricerca e della progettazione di prodotti che soddisfino le esigenze funzionali, ergonomiche, formali, sociali ed etiche in sintonia con le esigenze del mercato e del benessere, nell’ottica degli obiettivi imprescindibili di una progettazione attenta e sostenibile per l’uomo, l’ambiente e le altre forme di vita che popolano il pianeta. I designer del prodotto lavorano su soluzioni innovative di processo o di prodotto che migliorino la vita quotidiana degli utenti e delle comunità, che rispondano a sfide tecnologiche, di innovazione tipologica, filosofiche e produttive contemporanee, che siano in grado di interpretare il futuro, attraverso un processo che abbracci la ricerca, la progettazione e lo sviluppo formale e per il tramite dell’uso di materiali congrui e sostenibili, anche di tipo avanzato. Il design del prodotto mira a sviluppare le idee progettuali in elaborati prevalentemente materiali, a supporto di un miglioramento della vita e del progresso sociale ed economico, tramite una solida formazione di base nell’ambito delle discipline del progetto, sia a livello interdisciplinare teorico e operativo. Il settore include inoltre la riflessione critica e la pratica responsabile del design, valutandone l’impatto sui sistemi complessi e le implicazioni morali, sociali, culturali e ambientali, promuovendo valori come integrità, giustizia, rispetto, sostenibilità e responsabilità, superando bias impliciti e pregiudizi per favorire pratiche inclusive. L’etica del design incoraggia comportamenti trasparenti e rispettosi, adattandosi alle sfide digitali e globali, mantenendo il benessere umano e l’equilibrio ambientale come priorità","co  dell’Intelligenza Artificiale, nonché alla riflessione di carattere filosofico attorno alle tecnologie","codice_sector":"AFAM095","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"07-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10232/download/BANDO"],"bando_inpa":"https://ww2.gazzettaamministrativa.it/opencms/opencms/_gazzetta_amministrativa/amministrazione_trasparente/_calabria/_accademia_di_belle_arti_di_reggio_calabria/050_ban_con/2026/0008_Documenti_1788761303513/","email_rup":"direttore@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2264","istituto":"ACCADEMIA DI BELLE ARTI DI REGGIO CALABRIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"Fotografia","discipline_descrizione":"Il settore fornisce una conoscenza tecnica e metodologica, e propone una riflessione approfondita sulle molteplici possibilità del linguaggio fotografico dall’analogico al digitale. Permette l’uso consapevole del mezzo quale strumento di comunicazione visiva e quale metodo progettuale per la realizzazione di lavori fotografici, intesi come testi complessi. Il settore riconosce il ruolo che il dispositivo fotografico ha raggiunto nel contesto dell’arte contemporanea, sviluppandone gli interessi nei campi della ricerca artistica e delle innovazioni culturali e produttive ad esse connesse. L’ambito comprende anche tutti gli aspetti espressivi, comunicativi, linguistici e operativi introdotti dalle tecnologie digitali e generative ed è finalizzato ad esplorare le modalità di produzione dell’immagine nel quadro della pratica fotografica contemporanea, con riferimenti al dibattito teorico e culturale sulla forma in divenire della rappresentazione nelle arti visive, performative, nel design e nel restauro. Le attività didattiche laboratoriali saranno orientate alla pratica narrativa e di linguaggio, in funzione di progetti di comunicazione in generale e di quelli editoriali, all’utilizzo della sala di posa e della sperimentazione in camera oscura","codice_sector":"AFAM113","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Accademia","dove":"REGGIO CALABRIA","puoi_candidarsi_da":"07-09-2026","ultimo_giorno_candidatura":"07-10-2026","allegati":[],"bando_inpa":"https://ww2.gazzettaamministrativa.it/opencms/opencms/_gazzetta_amministrativa/amministrazione_trasparente/_calabria/_accademia_di_belle_arti_di_reggio_calabria/050_ban_con/2026/0007_Documenti_1788759734844/","email_rup":"direttore@abarc.it","telefono_rup":"0965499415"},{"bando_id":"2262","istituto":"CONSERVATORIO DI MUSICA DI FOGGIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"FOGGIA","puoi_candidarsi_da":"03-09-2026","ultimo_giorno_candidatura":"05-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10221/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/086edb7f53ef42d08b82f21d04a87012","email_rup":"d.amministrativa@conservatoriofoggia.it","telefono_rup":"0881723668"},{"bando_id":"2261","istituto":"CONSERVATORIO DI MUSICA DI FOGGIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricerca-bandi-ante-2025","discipline_nomi":"","discipline_descrizione":"","codice_sector":"","tipo_contratto":"Tempo indeterminato","tipo_scuola":"Conservatorio","dove":"FOGGIA","puoi_candidarsi_da":"03-09-2026","ultimo_giorno_candidatura":"05-10-2026","allegati":["https://afam-anagrafiche.mur.gov.it/10220/download/BANDO"],"bando_inpa":"https://portale.inpa.gov.it/ui/public-area/concoursedetail/c39c06a8254f46a9a2565868afd00acf","email_rup":"d.amministrativa@conservatoriofoggia.it","telefono_rup":"0881723668"},{"bando_id":"2260","istituto":"CONSERVATORIO DI MUSICA D'ADRIA","sito_istituzionale":"https://afam-bandi.mur.gov.it/ricer
